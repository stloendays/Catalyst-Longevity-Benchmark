name: Upgrade OpenClaw and connect local Qwen

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/openclaw-upgrade-clean-local.yml

permissions:
  contents: read

concurrency:
  group: openclaw-upgrade-clean-local
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"

      - name: Ensure OpenClaw 2026.9.2 and migrate legacy config
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          export PATH="/home/ubuntu/.npm-global/bin:$PATH"
          OC='/home/ubuntu/.npm-global/bin/openclaw'
          CFG='/home/ubuntu/.openclaw/openclaw.json'
          STAMP=$(date '+%Y%m%d-%H%M%S')
          mkdir -p /home/ubuntu/openclaw-backups/repair-$STAMP
          cp -a "$CFG" /home/ubuntu/openclaw-backups/repair-$STAMP/openclaw.json.before

          CURRENT=$($OC --version 2>&1 || true)
          echo "Current version: $CURRENT"
          if ! printf '%s' "$CURRENT" | grep -q '2026.9.2'; then
            systemctl --user stop openclaw-gateway.service || true
            npm install -g openclaw@2026.9.2 --prefix /home/ubuntu/.npm-global
            hash -r
          fi
          "$OC" --version

          python3 - "$CFG" <<'PY'
          import json, sys
          p=sys.argv[1]
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          removed=[]
          def drop(obj, key, path):
              if isinstance(obj, dict) and key in obj:
                  obj.pop(key, None); removed.append(path)
          drop(d.get('meta'), 'lastTouchedAt', 'meta.lastTouchedAt')
          drop(d.get('commands'), 'ownerDisplay', 'commands.ownerDisplay')
          gateway=d.get('gateway') if isinstance(d.get('gateway'), dict) else {}
          drop(gateway.get('controlUi'), 'allowInsecureAuth', 'gateway.controlUi.allowInsecureAuth')
          drop(gateway.get('tailscale'), 'resetOnExit', 'gateway.tailscale.resetOnExit')
          drop(gateway.get('nodes'), 'denyCommands', 'gateway.nodes.denyCommands')
          with open(p+'.tmp','w',encoding='utf-8') as f:
              json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          import os
          os.replace(p+'.tmp',p)
          print('Removed legacy keys:', ', '.join(removed) if removed else 'none')
          PY

          "$OC" doctor --fix --non-interactive || true
          "$OC" config validate
          cp -a "$CFG" /home/ubuntu/openclaw-backups/repair-$STAMP/openclaw.json.migrated
          REMOTE

      - name: Remove social chat plugins and legacy root gateway
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          export PATH="/home/ubuntu/.npm-global/bin:$PATH"
          OC='/home/ubuntu/.npm-global/bin/openclaw'
          CFG='/home/ubuntu/.openclaw/openclaw.json'

          echo '=== CHAT PLUGINS BEFORE ==='
          "$OC" plugins list 2>&1 | grep -Ei 'qq|weixin|wechat|wecom|yuanbao|dingtalk|ding' || true

          for id in openclaw-qqbot qqbot openclaw-weixin weixin wechat wecom openclaw-plugin-yuanbao yuanbao ddingtalk dingtalk; do
            "$OC" plugins uninstall "$id" --force >/tmp/uninstall-$id.log 2>&1 || true
          done

          python3 - "$CFG" <<'PY'
          import json, os, sys
          p=sys.argv[1]
          terms=('qqbot','qq','weixin','wechat','wecom','yuanbao','dingtalk','ding')
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          changed=[]
          channels=d.get('channels')
          if isinstance(channels, dict):
              for key in list(channels):
                  if any(t in key.lower() for t in terms):
                      channels.pop(key,None); changed.append('channels.'+key)
          plugins=d.get('plugins')
          if isinstance(plugins, dict):
              entries=plugins.get('entries')
              if isinstance(entries, dict):
                  for key in list(entries):
                      if any(t in key.lower() for t in terms):
                          entries.pop(key,None); changed.append('plugins.entries.'+key)
              load=plugins.get('load')
              if isinstance(load, dict) and isinstance(load.get('paths'), list):
                  old=list(load['paths'])
                  load['paths']=[x for x in old if not any(t in str(x).lower() for t in terms)]
                  if load['paths'] != old: changed.append('plugins.load.paths')
              for lk in ('allow','deny'):
                  if isinstance(plugins.get(lk), list):
                      old=list(plugins[lk])
                      plugins[lk]=[x for x in old if not any(t in str(x).lower() for t in terms)]
                      if plugins[lk] != old: changed.append('plugins.'+lk)
          with open(p+'.tmp','w',encoding='utf-8') as f:
              json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          os.replace(p+'.tmp',p)
          print('Cleaned ubuntu config:', ', '.join(changed) if changed else 'no matching entries')
          PY

          if sudo test -f /root/.openclaw/openclaw.json; then
            sudo python3 - <<'PY'
          import json, os
          p='/root/.openclaw/openclaw.json'
          terms=('qqbot','qq','weixin','wechat','wecom','yuanbao','dingtalk','ding')
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          channels=d.get('channels')
          if isinstance(channels, dict):
              for key in list(channels):
                  if any(t in key.lower() for t in terms): channels.pop(key,None)
          plugins=d.get('plugins')
          if isinstance(plugins, dict):
              entries=plugins.get('entries')
              if isinstance(entries, dict):
                  for key in list(entries):
                      if any(t in key.lower() for t in terms): entries.pop(key,None)
              load=plugins.get('load')
              if isinstance(load, dict) and isinstance(load.get('paths'), list):
                  load['paths']=[x for x in load['paths'] if not any(t in str(x).lower() for t in terms)]
              for lk in ('allow','deny'):
                  if isinstance(plugins.get(lk), list):
                      plugins[lk]=[x for x in plugins[lk] if not any(t in str(x).lower() for t in terms)]
          with open(p+'.tmp','w',encoding='utf-8') as f:
              json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          os.chmod(p+'.tmp',0o600)
          os.replace(p+'.tmp',p)
          print('Cleaned root OpenClaw config')
          PY
          fi

          sudo find /home/ubuntu/.openclaw/extensions /root/.openclaw/extensions -mindepth 1 -maxdepth 1 \
            \( -iname '*qq*' -o -iname '*weixin*' -o -iname '*wechat*' -o -iname '*wecom*' -o -iname '*yuanbao*' -o -iname '*dingtalk*' -o -iname '*ding*' \) \
            -print -exec rm -rf {} + 2>/dev/null || true

          echo '=== STOP ROOT LEGACY OPENCLAW ==='
          for pid in $(pgrep -u root -f '^openclaw-gateway$' || true); do sudo kill "$pid" || true; done
          for pid in $(pgrep -u root -f '^openclaw$' || true); do sudo kill "$pid" || true; done
          sleep 2
          for pid in $(pgrep -u root -f '^openclaw-gateway$' || true); do sudo kill -9 "$pid" || true; done
          for pid in $(pgrep -u root -f '^openclaw$' || true); do sudo kill -9 "$pid" || true; done

          "$OC" config validate
          echo '=== CHAT EXTENSION DIRECTORIES AFTER ==='
          sudo find /home/ubuntu/.openclaw/extensions /root/.openclaw/extensions -mindepth 1 -maxdepth 1 \
            \( -iname '*qq*' -o -iname '*weixin*' -o -iname '*wechat*' -o -iname '*wecom*' -o -iname '*yuanbao*' -o -iname '*dingtalk*' -o -iname '*ding*' \) -print 2>/dev/null || true
          REMOTE

      - name: Configure official llama cpp provider against existing server
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          export PATH="/home/ubuntu/.npm-global/bin:$PATH"
          OC='/home/ubuntu/.npm-global/bin/openclaw'
          CFG='/home/ubuntu/.openclaw/openclaw.json'

          sudo systemctl is-active --quiet rhocodec-llm.service
          curl -fsS --max-time 10 http://127.0.0.1:18080/v1/models >/tmp/llama-models.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/llama-models.json'))
          rows=d.get('data') or []
          assert rows, d
          row=rows[0]
          print('llama-server model:', row.get('id'))
          print('llama-server context:', (row.get('meta') or {}).get('n_ctx'))
          assert row.get('id') == 'qwen3.5-2b-q4', d
          assert int((row.get('meta') or {}).get('n_ctx') or 0) >= 8192, d
          PY

          ORIGINAL=$(python3 - "$CFG" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print((((d.get('agents') or {}).get('defaults') or {}).get('model') or {}).get('primary') or '')
          PY
          )
          echo "Preserving primary model: $ORIGINAL"

          "$OC" plugins install @openclaw/llama-cpp-provider --force
          "$OC" config unset models.providers.rhocodec_local >/dev/null 2>&1 || true
          "$OC" config unset 'agents.defaults.models["rhocodec_local/qwen3.5-2b-q4"]' >/dev/null 2>&1 || true

          "$OC" onboard --non-interactive --accept-risk \
            --auth-choice llama-cpp-existing-server \
            --custom-base-url http://127.0.0.1:18080/v1 \
            --custom-model-id qwen3.5-2b-q4

          if [ -n "$ORIGINAL" ]; then
            "$OC" config set agents.defaults.model.primary "\"$ORIGINAL\"" --strict-json
          fi
          "$OC" config validate

          "$OC" gateway install --force --port 18789
          "$OC" gateway start
          sleep 7
          "$OC" gateway status --deep --json | head -c 8000
          echo
          "$OC" plugins inspect llama-cpp --runtime --json 2>/dev/null | head -c 8000 || true
          echo
          "$OC" models list --provider llama-cpp
          REMOTE

      - name: Verify local Qwen through transport gateway and agent
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          export PATH="/home/ubuntu/.npm-global/bin:$PATH"
          OC='/home/ubuntu/.npm-global/bin/openclaw'
          MODEL='llama-cpp/qwen3.5-2b-q4'

          echo '=== RAW LOCAL MODEL PROBE ==='
          "$OC" infer model run --local --model "$MODEL" \
            --prompt 'Reply exactly with: LOCAL_TRANSPORT_OK' --json >/tmp/local-transport.json
          cat /tmp/local-transport.json
          grep -q 'LOCAL_TRANSPORT_OK' /tmp/local-transport.json

          echo '=== GATEWAY MODEL PROBE ==='
          "$OC" infer model run --gateway --model "$MODEL" \
            --prompt 'Reply exactly with: LOCAL_GATEWAY_OK' --json >/tmp/local-gateway.json
          cat /tmp/local-gateway.json
          grep -q 'LOCAL_GATEWAY_OK' /tmp/local-gateway.json

          echo '=== LEAN AGENT PROBE ==='
          "$OC" agent exec 'Reply exactly with: OPENCLAW_LOCAL_2B_OK' \
            --model "$MODEL" \
            --code-mode direct \
            --local-model-lean \
            --thinking off \
            --timeout 180 \
            --json >/tmp/local-agent.json
          cat /tmp/local-agent.json
          grep -q 'OPENCLAW_LOCAL_2B_OK' /tmp/local-agent.json
          echo 'OPENCLAW_LOCAL_2B=PASS'
          REMOTE

      - name: Final health report
        if: always()
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          export PATH="/home/ubuntu/.npm-global/bin:$PATH"
          OC='/home/ubuntu/.npm-global/bin/openclaw'
          echo '=== VERSION ==='; "$OC" --version 2>&1 || true
          echo '=== CONFIG ==='; "$OC" config validate 2>&1 || true
          echo '=== GATEWAY ==='; "$OC" gateway status --deep --json 2>&1 | head -c 8000 || true; echo
          echo '=== SERVICES ==='
          systemctl --user status openclaw-gateway.service --no-pager -l | head -35 || true
          sudo systemctl status rhocodec-llm.service --no-pager -l | head -30 || true
          echo '=== PORTS ==='; sudo ss -lntp | grep -E '(:18080|:11931|:18789)' || true
          echo '=== SOCIAL CHAT PLUGIN RESIDUE ==='
          "$OC" plugins list 2>&1 | grep -Ei 'qq|weixin|wechat|wecom|yuanbao|dingtalk|ding' || true
          sudo find /home/ubuntu/.openclaw/extensions /root/.openclaw/extensions -mindepth 1 -maxdepth 1 \
            \( -iname '*qq*' -o -iname '*weixin*' -o -iname '*wechat*' -o -iname '*wecom*' -o -iname '*yuanbao*' -o -iname '*dingtalk*' -o -iname '*ding*' \) -print 2>/dev/null || true
          echo '=== LOCAL MODEL ==='; "$OC" models list --provider llama-cpp 2>&1 || true
          echo '=== RESOURCES ==='; free -h; df -h /
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
