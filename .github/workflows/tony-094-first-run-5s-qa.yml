name: Tony 0.9.4 first-run 5s QA

on:
  push:
    branches:
      - qa/tony-094-full-exposure-visual
    paths:
      - '.github/workflows/tony-094-first-run-5s-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-run:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download exact release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download tony-v0.9.4 --repo $env:GITHUB_REPOSITORY --pattern TonyDesktopPet-0.9.4-windows-x64.zip --clobber
          Expand-Archive TonyDesktopPet-0.9.4-windows-x64.zip -DestinationPath runtime -Force
      - name: Capture at five seconds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Remove-Item Env:TONY_VISUAL_ACTION -ErrorAction SilentlyContinue
          $exe=(Resolve-Path runtime/TonyDesktopPet.exe).Path
          $proc=Start-Process -FilePath $exe -WorkingDirectory (Resolve-Path runtime).Path -PassThru
          try {
            Start-Sleep -Seconds 5
            if($proc.HasExited){ throw "Tony exited before first-run capture: $($proc.ExitCode)" }
            $bounds=[System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp=New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
            $gfx=[System.Drawing.Graphics]::FromImage($bmp)
            try {
              $gfx.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
              $bmp.Save((Join-Path $PWD 'tony-0.9.4-first-run-5s.png'),[System.Drawing.Imaging.ImageFormat]::Png)
            } finally { $gfx.Dispose(); $bmp.Dispose() }
          } finally { if(-not $proc.HasExited){ Stop-Process -Id $proc.Id -Force } }
      - uses: actions/upload-artifact@v4
        with:
          name: Tony-0.9.4-first-run-5s
          path: tony-0.9.4-first-run-5s.png
          if-no-files-found: error
