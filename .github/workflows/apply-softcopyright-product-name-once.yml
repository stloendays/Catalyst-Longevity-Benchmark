name: Apply Softcopyright Product Name Once

on:
  push:
    branches: [softcopyright-product-name]
    paths:
      - ".github/workflows/apply-softcopyright-product-name-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: softcopyright-product-name
          fetch-depth: 0
      - name: Apply product name
        run: python tools/apply_softcopyright_product_name.py
      - name: Commit updated product name
        shell: bash
        run: |
          git config user.name "stloendays"
          git config user.email "157110190+stloendays@users.noreply.github.com"
          git add -A
          git reset .github/workflows/apply-softcopyright-product-name-once.yml tools/apply_softcopyright_product_name.py
          if git diff --cached --quiet; then
            echo "No product-name changes to commit"
          else
            git commit -m "Align product name for software copyright materials"
            git push origin HEAD:softcopyright-product-name
          fi
