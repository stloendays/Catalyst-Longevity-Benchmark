name: Local2B MCP Step 3A server LoRA

on:
  push:
    paths:
      - .github/workflows/local2b-mcp-step3a-server.yml
      - training/local2b_mcp/prepare_qvac_sft.py

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Step 3 branch
        uses: actions/checkout@v4

      - name: Rebuild frozen Step 2 train split
        run: |
          rm -rf "$RUNNER_TEMP/local2b-s2" "$RUNNER_TEMP/local2b-s3a"
          python3 training/local2b_mcp/generate_stage2_dataset.py \
            --out "$RUNNER_TEMP/local2b-s2" \
            --train 16000 --val 0 --test 0 --seed 20260908
          sha256sum "$RUNNER_TEMP/local2b-s2/train.jsonl"

      - name: Prepare focused QVAC Stage 3A curriculum
        run: |
          mkdir -p "$RUNNER_TEMP/local2b-s3a"
          python3 training/local2b_mcp/prepare_qvac_sft.py \
            --input "$RUNNER_TEMP/local2b-s2/train.jsonl" \
            --output "$RUNNER_TEMP/local2b-s3a/train.jsonl" \
            --manifest "$RUNNER_TEMP/local2b-s3a/manifest.json" \
            --preset cpu-stage3a-16 \
            --seed 20260908 \
            --max-tools 2
          cat "$RUNNER_TEMP/local2b-s3a/manifest.json"
          echo '=== SAMPLE ==='
          head -1 "$RUNNER_TEMP/local2b-s3a/train.jsonl" | cut -c1-2500

      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"

      - name: Transfer Stage 3A curriculum
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" \
            ubuntu@150.158.27.206 'mkdir -p /home/ubuntu/local2b-training/step3a'
          scp -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" \
            "$RUNNER_TEMP/local2b-s3a/train.jsonl" \
            ubuntu@150.158.27.206:/home/ubuntu/local2b-training/step3a/train.jsonl
          scp -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" \
            "$RUNNER_TEMP/local2b-s3a/manifest.json" \
            ubuntu@150.158.27.206:/home/ubuntu/local2b-training/step3a/manifest.json

      - name: Train focused MCP LoRA on Tencent CPU server
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=40 -o ConnectTimeout=15 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT=/home/ubuntu/local2b-training/step3a
          TRAINER=/home/ubuntu/qvac-trainer-step3/llama-finetune-lora
          MODEL=/opt/rhocodec-llm/models/Qwen3.5-2B-Q4_K_M.gguf
          DATA="$ROOT/train.jsonl"
          OUT="$ROOT/local2b-mcp-step3a-r4-qv.gguf"
          LOG="$ROOT/train.log"
          RESULT="$ROOT/result.txt"
          DEST=/opt/rhocodec-llm/adapters/local2b-mcp-step3a-r4-qv.gguf

          test -x "$TRAINER"
          test -s "$MODEL"
          test -s "$DATA"
          echo '=== CURRICULUM ==='
          cat "$ROOT/manifest.json"
          echo '=== SERVER BEFORE ==='
          date -Is
          free -h
          df -h /

          WAS_ACTIVE=0
          if systemctl is-active --quiet rhocodec-llm.service; then
            WAS_ACTIVE=1
            sudo systemctl stop rhocodec-llm.service
          fi
          restore_service() {
            if [ "$WAS_ACTIVE" -eq 1 ]; then
              sudo systemctl start rhocodec-llm.service || true
            fi
          }
          trap restore_service EXIT

          rm -f "$OUT" "$LOG" "$RESULT"
          START=$(date +%s)
          set +e
          timeout 2100 "$TRAINER" \
            -m "$MODEL" \
            -f "$DATA" \
            --assistant-loss-only \
            --num-epochs 1 \
            --lora-rank 4 \
            --lora-alpha 8 \
            --lora-modules attn_q,attn_v \
            --lora-seed 20260908 \
            --learning-rate 1e-5 \
            --weight-decay 0 \
            --lr-scheduler constant \
            --checkpoint-save-steps 0 \
            --output-adapter "$OUT" \
            -c 512 -b 32 -ub 16 -ngl 0 -fa off \
            2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          set -e
          END=$(date +%s)
          ELAPSED=$((END - START))

          echo "TRAIN_RC=$RC"
          echo "ELAPSED_SECONDS=$ELAPSED"
          tail -120 "$LOG" || true
          if [ "$RC" -ne 0 ]; then
            exit "$RC"
          fi
          test -s "$OUT"

          sudo install -d -m 755 /opt/rhocodec-llm/adapters
          sudo install -m 644 "$OUT" "$DEST"
          SHA=$(sha256sum "$DEST" | awk '{print $1}')
          SIZE=$(stat -c '%s' "$DEST")
          {
            echo "adapter=$DEST"
            echo "sha256=$SHA"
            echo "bytes=$SIZE"
            echo "elapsed_seconds=$ELAPSED"
            echo "seed=20260908"
            echo "rank=4"
            echo "alpha=8"
            echo "modules=attn_q,attn_v"
            echo "context=512"
            echo "batch=32"
            echo "ubatch=16"
          } | tee "$RESULT"

          restore_service
          WAS_ACTIVE=0
          trap - EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/v1/models >/dev/null 2>&1; then
              echo 'INFERENCE_SERVICE=HEALTHY'
              break
            fi
            sleep 2
          done
          systemctl is-active rhocodec-llm.service
          curl -fsS http://127.0.0.1:18080/v1/models >/dev/null
          free -h
          echo 'STEP3A_SERVER_TRAINING=PASS'
          REMOTE

      - name: Collect training metadata
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/step3a-result"
          scp -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" \
            ubuntu@150.158.27.206:/home/ubuntu/local2b-training/step3a/manifest.json \
            "$RUNNER_TEMP/step3a-result/manifest.json" || true
          scp -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" \
            ubuntu@150.158.27.206:/home/ubuntu/local2b-training/step3a/result.txt \
            "$RUNNER_TEMP/step3a-result/result.txt" || true
          scp -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" \
            ubuntu@150.158.27.206:/home/ubuntu/local2b-training/step3a/train.log \
            "$RUNNER_TEMP/step3a-result/train.log" || true

      - name: Upload Step 3A metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local2b-mcp-step3a-server-training
          path: ${{ runner.temp }}/step3a-result/
          if-no-files-found: warn

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
