name: Build and release Tony Desktop Pet

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bear-agent-pet
      - feature/tony-v093-release-integration
    paths:
      - 'bear_agent_pet/client/VERSION'
      - 'bear_agent_pet/client/installer/**'
      - '.github/workflows/tony-release.yml'

permissions:
  contents: write

concurrency:
  group: tony-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Read canonical Tony version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content bear_agent_pet/client/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid Tony VERSION: $version" }
          "TONY_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "TONY_RELEASE_VERSION=$version"

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebsockets'
          cache: true

      - name: Validate artwork
        shell: pwsh
        run: python bear_agent_pet/client/tools/validate_state_assets.py

      - name: Configure
        shell: pwsh
        run: cmake -S bear_agent_pet/client -B bear_agent_pet/client/build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build bear_agent_pet/client/build --config Release --parallel

      - name: Package Qt runtime
        shell: pwsh
        run: |
          $package = "$PWD/bear_agent_pet/client/package"
          if (Test-Path $package) { Remove-Item $package -Recurse -Force }
          cmake --install bear_agent_pet/client/build --config Release --prefix $package
          if ($LASTEXITCODE -ne 0) { throw 'CMake install failed' }
          Copy-Item bear_agent_pet/client/RUN_TONY.md "$package/RUN_TONY.md"
          "TonyDesktopPet $env:TONY_VERSION`ncommit=$env:GITHUB_SHA" | Set-Content "$package/VERSION.txt" -Encoding utf8
          windeployqt --release --no-translations "$package/TonyDesktopPet.exe"
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }

          $root = (Resolve-Path $package).Path
          $managed = Get-ChildItem $package -Recurse -File | ForEach-Object {
            $_.FullName.Substring($root.Length + 1)
          } | Sort-Object
          @($managed) + 'tony-file-list.txt' | Sort-Object -Unique | Set-Content "$package/tony-file-list.txt" -Encoding utf8

          foreach ($required in @('TonyDesktopPet.exe','VERSION','VERSION.txt','tony-install-root.marker','tony-file-list.txt')) {
            if (-not (Test-Path (Join-Path $package $required))) { throw "Missing release package entry: $required" }
          }
          if ((Get-Content "$package/VERSION" -Raw).Trim() -ne $env:TONY_VERSION) { throw 'Packaged VERSION mismatch' }
          $productVersion = (Get-Item "$package/TonyDesktopPet.exe").VersionInfo.ProductVersion
          if ($productVersion -notlike "$env:TONY_VERSION*") { throw "EXE ProductVersion mismatch: $productVersion" }
          Write-Host "TONY_VERSION_SYNC=PASS version=$env:TONY_VERSION exe=$productVersion"

      - name: Sign application when certificate is configured
        shell: pwsh
        env:
          TONY_SIGNING_CERT_BASE64: ${{ secrets.TONY_SIGNING_CERT_BASE64 }}
          TONY_SIGNING_CERT_PASSWORD: ${{ secrets.TONY_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TONY_SIGNING_CERT_BASE64)) {
            Write-Host 'TONY_AUTHENTICODE_APP=SKIPPED (no signing certificate configured)'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'tony-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:TONY_SIGNING_CERT_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:TONY_SIGNING_CERT_PASSWORD "$PWD/bear_agent_pet/client/package/TonyDesktopPet.exe"
          if ($LASTEXITCODE -ne 0) { throw 'TonyDesktopPet.exe signing failed' }
          $signature = Get-AuthenticodeSignature "$PWD/bear_agent_pet/client/package/TonyDesktopPet.exe"
          if ($signature.Status -ne 'Valid') { throw "TonyDesktopPet.exe signature invalid: $($signature.Status)" }
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          Write-Host 'TONY_AUTHENTICODE_APP=PASS'

      - name: Portable startup smoke test
        shell: pwsh
        run: |
          $exe = "$PWD/bear_agent_pet/client/package/TonyDesktopPet.exe"
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 7
            if ($process.HasExited) { throw "Tony exited during portable smoke test: $($process.ExitCode)" }
            Write-Host 'TONY_PORTABLE_SMOKE=PASS'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $dist = "$PWD/bear_agent_pet/client/dist"
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $zipName = "TonyDesktopPet-$env:TONY_VERSION-windows-x64.zip"
          $zipPath = Join-Path $dist $zipName
          Compress-Archive -Path "$PWD/bear_agent_pet/client/package/*" -DestinationPath $zipPath -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content "$zipPath.sha256" -Encoding ascii
          Write-Host "TONY_ZIP_SHA256=$hash"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build version-synchronized installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          & $iscc "/DMyAppVersion=$env:TONY_VERSION" "$PWD/bear_agent_pet/client/installer/TonyDesktopPet.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          $setup = "$PWD/bear_agent_pet/client/dist/TonyDesktopPet-Setup-v$env:TONY_VERSION.exe"
          if (-not (Test-Path $setup)) { throw 'Installer output missing' }

      - name: Sign installer when certificate is configured
        shell: pwsh
        env:
          TONY_SIGNING_CERT_BASE64: ${{ secrets.TONY_SIGNING_CERT_BASE64 }}
          TONY_SIGNING_CERT_PASSWORD: ${{ secrets.TONY_SIGNING_CERT_PASSWORD }}
        run: |
          $setup = "$PWD/bear_agent_pet/client/dist/TonyDesktopPet-Setup-v$env:TONY_VERSION.exe"
          if ([string]::IsNullOrWhiteSpace($env:TONY_SIGNING_CERT_BASE64)) {
            Write-Host 'TONY_AUTHENTICODE_INSTALLER=SKIPPED (no signing certificate configured)'
          } else {
            $pfx = Join-Path $env:RUNNER_TEMP 'tony-signing-installer.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:TONY_SIGNING_CERT_BASE64))
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe not found' }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:TONY_SIGNING_CERT_PASSWORD $setup
            if ($LASTEXITCODE -ne 0) { throw 'Tony installer signing failed' }
            $signature = Get-AuthenticodeSignature $setup
            if ($signature.Status -ne 'Valid') { throw "Tony installer signature invalid: $($signature.Status)" }
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            Write-Host 'TONY_AUTHENTICODE_INSTALLER=PASS'
          }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $setup -Leaf)" | Set-Content "$setup.sha256" -Encoding ascii
          Write-Host "TONY_INSTALLER_SHA256=$hash"

      - name: Installer install/start/uninstall smoke test
        shell: pwsh
        run: |
          $setup = "$PWD/bear_agent_pet/client/dist/TonyDesktopPet-Setup-v$env:TONY_VERSION.exe"
          $testDir = "$env:LOCALAPPDATA\TonyDesktopPet-Smoke-$env:GITHUB_RUN_ID"
          if (Test-Path $testDir) { Remove-Item $testDir -Recurse -Force }
          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',"/DIR=$testDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer smoke install failed: $($install.ExitCode)" }
          foreach ($required in @('TonyDesktopPet.exe','VERSION','tony-install-root.marker','tony-file-list.txt')) {
            if (-not (Test-Path (Join-Path $testDir $required))) { throw "Installed entry missing: $required" }
          }
          if ((Get-Content (Join-Path $testDir 'VERSION') -Raw).Trim() -ne $env:TONY_VERSION) { throw 'Installed VERSION mismatch' }
          $process = Start-Process -FilePath (Join-Path $testDir 'TonyDesktopPet.exe') -WorkingDirectory $testDir -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 6
            if ($process.HasExited) { throw "Installed Tony exited during smoke test: $($process.ExitCode)" }
            Write-Host 'TONY_INSTALLER_SMOKE=PASS'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          $uninstaller = Get-ChildItem $testDir -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Installer smoke test could not find uninstaller' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          if (Test-Path $testDir) { Remove-Item $testDir -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Publish formal GitHub release
        if: github.ref == 'refs/heads/feature/bear-agent-pet'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "tony-v$env:TONY_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite a published version." }
          $notes = @"
          Tony Desktop Pet v$env:TONY_VERSION

          - Canonical version now comes from bear_agent_pet/client/VERSION and is shared by CMake, runtime metadata, AgentClient, installer and release packaging.
          - Windows executable metadata and package VERSION are checked during CI.
          - Update packages retain SHA-256 verification and managed-file metadata.
          - Installer and portable package are smoke-tested before publication.
          - Authenticode signing is applied when repository signing secrets are configured.
          "@
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Tony Desktop Pet v$env:TONY_VERSION" --notes $notes `
            "bear_agent_pet/client/dist/TonyDesktopPet-Setup-v$env:TONY_VERSION.exe" `
            "bear_agent_pet/client/dist/TonyDesktopPet-Setup-v$env:TONY_VERSION.exe.sha256" `
            "bear_agent_pet/client/dist/TonyDesktopPet-$env:TONY_VERSION-windows-x64.zip" `
            "bear_agent_pet/client/dist/TonyDesktopPet-$env:TONY_VERSION-windows-x64.zip.sha256"
          if ($LASTEXITCODE -ne 0) { throw 'Formal Tony release publication failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: TonyDesktopPet-${{ steps.version.outputs.version }}-release
          path: bear_agent_pet/client/dist/*
          if-no-files-found: error
