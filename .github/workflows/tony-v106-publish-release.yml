name: Publish Tony v1.0.6 release

on:
  push:
    branches:
      - feature/tony-v106-autonomous-companion
    paths:
      - '.github/workflows/tony-v106-publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tony-v106-publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: '35062400429'
      SOURCE_ARTIFACT: TonyDesktopPet-1.0.6-windows-x64-autonomous-companion
      VERSION: '1.0.6'
      RELEASE_TAG: tony-v1.0.6
      UPDATE_TAG: tony-desktop-latest
      RELEASE_COMMIT: e34f4caa97d6c321dd88dd61162f972bccb8f310
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tony-v106-autonomous-companion
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < bear_agent_pet/client/VERSION)" = "$VERSION"
          git cat-file -e "$RELEASE_COMMIT^{commit}"
          git diff --quiet "$RELEASE_COMMIT" HEAD -- bear_agent_pet/client
          echo "TONY_V106_RELEASE_SOURCE=PASS binary_commit=$RELEASE_COMMIT workflow_head=$(git rev-parse HEAD)"

      - name: Download verified Windows artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir package
          test -f package/TonyDesktopPet.exe
          test -f package/VERSION
          test -f package/tony-install-root.marker
          test -f package/assets/config/tony_responses.json
          test -f package/assets/config/tony_autonomous_responses.json
          test "$(tr -d '\r\n ' < package/VERSION)" = "$VERSION"

          # v1.0.6's validated build artifact predates the updater's managed-file
          # list generation. Add only this deterministic metadata before release;
          # the smoke-tested executable and runtime bytes remain untouched.
          (
            cd package
            find . -type f -printf '%P\n' | sort -u > tony-file-list.txt
            grep -qx 'TonyDesktopPet.exe' tony-file-list.txt
            grep -qx 'tony-install-root.marker' tony-file-list.txt
            grep -qx 'assets/config/tony_autonomous_responses.json' tony-file-list.txt
          )
          echo 'TONY_V106_RELEASE_ARTIFACT=PASS'

      - name: Build versioned and updater packages
        id: package
        shell: bash
        run: |
          set -euo pipefail
          rm -f TonyDesktopPet-windows-x64.zip TonyDesktopPet-${VERSION}-windows-x64.zip
          (
            cd package
            zip -q -r ../TonyDesktopPet-windows-x64.zip .
          )
          cp TonyDesktopPet-windows-x64.zip "TonyDesktopPet-${VERSION}-windows-x64.zip"
          sha256sum "TonyDesktopPet-${VERSION}-windows-x64.zip" > "TonyDesktopPet-${VERSION}-windows-x64.zip.sha256"

          SHA256="$(sha256sum TonyDesktopPet-windows-x64.zip | awk '{print $1}')"
          SIZE="$(stat -c '%s' TonyDesktopPet-windows-x64.zip)"
          export SHA256 SIZE
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          repo=os.environ['GITHUB_REPOSITORY']
          version=os.environ['VERSION']
          manifest={
              'schema': 1,
              'product': 'Tony Desktop Pet',
              'platform': 'windows-x64',
              'version': version,
              'url': f'https://github.com/{repo}/releases/download/tony-desktop-latest/TonyDesktopPet-windows-x64.zip?version={version}',
              'sha256': os.environ['SHA256'],
              'size': int(os.environ['SIZE']),
              'published_at': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'commit': os.environ['RELEASE_COMMIT'],
              'minimum_updater_version': '0.9.0',
          }
          with open('latest.json','w',encoding='utf-8',newline='\n') as f:
              json.dump(manifest,f,indent=2)
              f.write('\n')
          print('TONY_V106_MANIFEST=PASS', manifest['version'], manifest['sha256'], manifest['size'])
          PY
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Validate updater package structure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify-package
          mkdir verify-package
          unzip -q TonyDesktopPet-windows-x64.zip -d verify-package
          test -f verify-package/TonyDesktopPet.exe
          test -f verify-package/VERSION
          test -f verify-package/tony-install-root.marker
          test -f verify-package/tony-file-list.txt
          test -f verify-package/assets/config/tony_autonomous_responses.json
          test "$(tr -d '\r\n ' < verify-package/VERSION)" = "$VERSION"
          echo 'TONY_V106_UPDATER_STRUCTURE=PASS'

      - name: Publish versioned Tony v1.0.6 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES_FILE=release-notes-v106.md
          cat > "$NOTES_FILE" <<'EOF'
          Tony Desktop Pet v1.0.6 — Autonomous Companion

          - Adds state-driven spontaneous speech and autonomous companion behavior.
          - Adds Off / Quiet / Normal / Lively autonomy modes.
          - Adds night-time suppression, cooldowns, and hourly speech caps.
          - Adds autonomous reactions for warmth, loneliness, energy, curiosity, chemistry study, desktop observation, and rare Paula moments.
          - Tony's actual replies are English-only, including local replies, autonomous speech, and Agent/server responses.
          - Preserves the v1.0.5 local response-pack and explicit-memory pipeline.
          - Windows executable was built and smoke-tested by GitHub Actions from commit e34f4caa97d6c321dd88dd61162f972bccb8f310.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "TonyDesktopPet-${VERSION}-windows-x64.zip" \
              "TonyDesktopPet-${VERSION}-windows-x64.zip.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Tony Desktop Pet v${VERSION}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" \
              "TonyDesktopPet-${VERSION}-windows-x64.zip" \
              "TonyDesktopPet-${VERSION}-windows-x64.zip.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --title "Tony Desktop Pet v${VERSION}" \
              --notes-file "$NOTES_FILE"
          fi
          echo 'TONY_V106_VERSIONED_RELEASE=PASS'

      - name: Publish automatic update channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$UPDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$UPDATE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --prerelease \
              --title 'Tony Desktop Pet automatic update channel' \
              --notes 'Managed automatically by Tony release workflows. latest.json is the updater manifest.'
          fi
          gh release upload "$UPDATE_TAG" \
            TonyDesktopPet-windows-x64.zip latest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo 'TONY_V106_UPDATE_CHANNEL_PUBLISH=PASS'

      - name: Verify published updater assets
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$UPDATE_TAG/latest.json?verify=$GITHUB_RUN_ID"
          PACKAGE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$UPDATE_TAG/TonyDesktopPet-windows-x64.zip?verify=$GITHUB_RUN_ID"
          curl -fL --retry 5 --retry-delay 2 "$MANIFEST_URL" -o published-latest.json
          curl -fL --retry 5 --retry-delay 2 "$PACKAGE_URL" -o published-package.zip
          python - <<'PY'
          import hashlib, json, os
          with open('published-latest.json',encoding='utf-8-sig') as f:
              m=json.load(f)
          assert m['schema']==1
          assert m['version']==os.environ['VERSION'], m
          assert m['platform']=='windows-x64'
          assert m['commit']==os.environ['RELEASE_COMMIT']
          with open('published-package.zip','rb') as f:
              digest=hashlib.sha256(f.read()).hexdigest()
          assert digest==m['sha256'], (digest,m['sha256'])
          assert os.path.getsize('published-package.zip')==m['size']
          print('TONY_V106_PUBLIC_UPDATE_VERIFY=PASS',m['version'],digest,m['size'])
          PY
