name: Deploy local 2B Q4 LLM v2

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/deploy-local-llm-v2.yml

permissions:
  contents: read

concurrency:
  group: deploy-local-llm-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect server and preserve partial downloads
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          MODEL_TMP='/tmp/Qwen3.5-2B-Q4_K_M.gguf'
          MODEL_FINAL='/opt/rhocodec-llm/models/Qwen3.5-2B-Q4_K_M.gguf'
          EXPECTED_SIZE='1274396608'
          EXPECTED_SHA='d6bd9f4175302658c1d704e44858842606652bbe53c56cd542e31ff10d0cfd58'

          sudo mkdir -p /opt/rhocodec-llm/bin /opt/rhocodec-llm/models
          sudo chown -R ubuntu:ubuntu /opt/rhocodec-llm
          sudo systemctl stop rhocodec-llm.service 2>/dev/null || true

          echo '=== SERVER RESOURCES ==='
          df -h /
          free -h
          echo '=== EXISTING MODEL STATE ==='
          for f in "$MODEL_FINAL" "$MODEL_TMP"; do
            if [ -f "$f" ]; then
              printf '%s bytes=' "$f"
              stat -c '%s' "$f"
              ls -lh "$f"
            else
              echo "$f missing"
            fi
          done

          if [ -f "$MODEL_FINAL" ]; then
            FINAL_SIZE=$(stat -c '%s' "$MODEL_FINAL")
            if [ "$FINAL_SIZE" -eq "$EXPECTED_SIZE" ] && echo "$EXPECTED_SHA  $MODEL_FINAL" | sha256sum -c -; then
              echo 'Installed model is already complete and verified.'
            else
              echo 'Installed model is incomplete or invalid; moving it back to the resumable temp path.'
              if [ ! -f "$MODEL_TMP" ] || [ "$(stat -c '%s' "$MODEL_TMP" 2>/dev/null || echo 0)" -lt "$FINAL_SIZE" ]; then
                mv -f "$MODEL_FINAL" "$MODEL_TMP"
              else
                rm -f "$MODEL_FINAL"
              fi
            fi
          fi
          REMOTE

      - name: Resume verified model directly on Tencent server
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          MODEL_TMP='/tmp/Qwen3.5-2B-Q4_K_M.gguf'
          MODEL_FINAL='/opt/rhocodec-llm/models/Qwen3.5-2B-Q4_K_M.gguf'
          EXPECTED_SIZE='1274396608'
          EXPECTED_SHA='d6bd9f4175302658c1d704e44858842606652bbe53c56cd542e31ff10d0cfd58'
          MIRROR_URL='https://hf-mirror.com/openresearchtools/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf?download=true'
          OFFICIAL_URL='https://huggingface.co/openresearchtools/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf?download=true'

          if [ -f "$MODEL_FINAL" ]; then
            if echo "$EXPECTED_SHA  $MODEL_FINAL" | sha256sum -c -; then
              echo 'Verified installed model found; download step is unnecessary.'
              exit 0
            fi
          fi

          if [ -f "$MODEL_TMP" ]; then
            CURRENT_SIZE=$(stat -c '%s' "$MODEL_TMP")
          else
            CURRENT_SIZE=0
          fi
          echo "Current resumable model bytes: $CURRENT_SIZE / $EXPECTED_SIZE"

          if [ "$CURRENT_SIZE" -gt "$EXPECTED_SIZE" ]; then
            echo 'Partial model is larger than expected; resetting it.'
            rm -f "$MODEL_TMP"
            CURRENT_SIZE=0
          fi

          if [ "$CURRENT_SIZE" -eq "$EXPECTED_SIZE" ] && [ "$CURRENT_SIZE" -gt 0 ]; then
            if echo "$EXPECTED_SHA  $MODEL_TMP" | sha256sum -c -; then
              echo 'Resumable model is already complete and verified.'
              exit 0
            fi
            echo 'Full-sized temp file failed SHA-256; restarting from zero.'
            rm -f "$MODEL_TMP"
            CURRENT_SIZE=0
          fi

          resume_from() {
            url="$1"
            label="$2"
            echo "Attempting resumable server-side download via $label"
            curl -fL -C - \
              --retry 12 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --speed-time 120 --speed-limit 1024 \
              -o "$MODEL_TMP" "$url"
          }

          if ! resume_from "$MIRROR_URL" 'hf-mirror.com'; then
            echo 'Mirror resume failed; falling back to official Hugging Face.'
            resume_from "$OFFICIAL_URL" 'huggingface.co'
          fi

          FINAL_SIZE=$(stat -c '%s' "$MODEL_TMP")
          echo "Downloaded model bytes: $FINAL_SIZE"
          if [ "$FINAL_SIZE" -ne "$EXPECTED_SIZE" ]; then
            echo "Model size mismatch: expected $EXPECTED_SIZE, got $FINAL_SIZE"
            exit 1
          fi

          if ! echo "$EXPECTED_SHA  $MODEL_TMP" | sha256sum -c -; then
            echo 'SHA-256 failed after resumed download; retrying one clean download.'
            rm -f "$MODEL_TMP"
            if ! curl -fL --retry 12 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --speed-time 120 --speed-limit 1024 \
              -o "$MODEL_TMP" "$MIRROR_URL"; then
              curl -fL --retry 12 --retry-all-errors --retry-delay 5 \
                --connect-timeout 30 --speed-time 120 --speed-limit 1024 \
                -o "$MODEL_TMP" "$OFFICIAL_URL"
            fi
            test "$(stat -c '%s' "$MODEL_TMP")" -eq "$EXPECTED_SIZE"
            echo "$EXPECTED_SHA  $MODEL_TMP" | sha256sum -c -
          fi
          REMOTE

      - name: Install llama.cpp runtime and systemd service
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          MODEL_TMP='/tmp/Qwen3.5-2B-Q4_K_M.gguf'
          MODEL_FINAL='/opt/rhocodec-llm/models/Qwen3.5-2B-Q4_K_M.gguf'
          EXPECTED_SHA='d6bd9f4175302658c1d704e44858842606652bbe53c56cd542e31ff10d0cfd58'
          RUNTIME_ARCHIVE='/tmp/llama-runtime.tar.gz'
          RELEASE_ARCHIVE='/tmp/llama-release.tar.gz'
          RELEASE_URL='https://github.com/ggml-org/llama.cpp/releases/download/b10809/llama-b10809-bin-ubuntu-x64.tar.gz'

          sudo mkdir -p /opt/rhocodec-llm/bin /opt/rhocodec-llm/models
          sudo chown -R ubuntu:ubuntu /opt/rhocodec-llm

          if [ -f "$MODEL_TMP" ]; then
            echo "$EXPECTED_SHA  $MODEL_TMP" | sha256sum -c -
            mv -f "$MODEL_TMP" "$MODEL_FINAL"
          fi
          echo "$EXPECTED_SHA  $MODEL_FINAL" | sha256sum -c -

          rm -rf /opt/rhocodec-llm/bin/* /tmp/llama-unpack
          mkdir -p /tmp/llama-unpack

          USE_REPACKED=0
          if [ -s "$RUNTIME_ARCHIVE" ] && tar -tzf "$RUNTIME_ARCHIVE" >/tmp/llama-runtime-list.txt 2>/dev/null; then
            if grep -q 'llama-server$' /tmp/llama-runtime-list.txt; then
              USE_REPACKED=1
            fi
          fi

          if [ "$USE_REPACKED" -eq 1 ]; then
            echo 'Reusing the previously transferred llama.cpp runtime archive.'
            tar -xzf "$RUNTIME_ARCHIVE" -C /opt/rhocodec-llm/bin
          else
            echo 'No valid cached runtime archive; downloading the official llama.cpp runtime on the server.'
            rm -f "$RELEASE_ARCHIVE"
            curl -fL --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
              -o "$RELEASE_ARCHIVE" "$RELEASE_URL"
            tar -xzf "$RELEASE_ARCHIVE" -C /tmp/llama-unpack
            SERVER_BIN=$(find /tmp/llama-unpack -type f -name llama-server -print -quit)
            test -n "$SERVER_BIN"
            SRC_DIR=$(dirname "$SERVER_BIN")
            cp -a "$SRC_DIR"/. /opt/rhocodec-llm/bin/
          fi

          test -x /opt/rhocodec-llm/bin/llama-server
          chmod +x /opt/rhocodec-llm/bin/llama-server
          /opt/rhocodec-llm/bin/llama-server --version || true

          sudo tee /etc/systemd/system/rhocodec-llm.service >/dev/null <<'UNIT'
          [Unit]
          Description=RhoCodec local Qwen3.5 2B Q4 llama.cpp server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=/opt/rhocodec-llm/bin
          Environment=HOME=/home/ubuntu
          Environment=LD_LIBRARY_PATH=/opt/rhocodec-llm/bin
          ExecStart=/opt/rhocodec-llm/bin/llama-server -m /opt/rhocodec-llm/models/Qwen3.5-2B-Q4_K_M.gguf --host 127.0.0.1 --port 18080 -c 1536 -t 4 -b 128 -ub 128 --parallel 1 --jinja --no-webui
          Restart=on-failure
          RestartSec=5
          TimeoutStartSec=180
          LimitNOFILE=65535

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo systemctl daemon-reload
          sudo systemctl enable rhocodec-llm.service
          sudo systemctl restart rhocodec-llm.service
          sudo systemctl is-enabled rhocodec-llm.service
          echo 'systemd service installation completed.'
          REMOTE

      - name: Wait for local API and smoke test
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          ready=0
          for i in $(seq 1 80); do
            if curl -fsS --max-time 5 http://127.0.0.1:18080/v1/models >/tmp/rhocodec-models.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Local model API failed to become ready.'
            sudo systemctl status rhocodec-llm.service --no-pager -l || true
            sudo journalctl -u rhocodec-llm.service -n 200 --no-pager || true
            exit 1
          fi

          sudo systemctl is-active --quiet rhocodec-llm.service
          MODEL_ID=$(python3 - <<'PY'
          import json
          with open('/tmp/rhocodec-models.json') as f:
              d = json.load(f)
          assert d.get('data'), d
          print(d['data'][0]['id'])
          PY
          )

          python3 - "$MODEL_ID" > /tmp/rhocodec-request.json <<'PY'
          import json, sys
          print(json.dumps({
              'model': sys.argv[1],
              'messages': [
                  {'role': 'user', 'content': 'Reply briefly with the words RhoCodec local model is running.'}
              ],
              'max_tokens': 32,
              'temperature': 0
          }))
          PY

          curl -fsS --max-time 180 http://127.0.0.1:18080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/rhocodec-request.json \
            -o /tmp/rhocodec-smoke.json

          python3 - <<'PY'
          import json
          with open('/tmp/rhocodec-smoke.json') as f:
              d = json.load(f)
          choices = d.get('choices') or []
          assert choices, d
          content = choices[0].get('message', {}).get('content', '')
          assert content.strip(), d
          print('Smoke response:', content.strip())
          print('LOCAL_API_SMOKE_TEST=PASS')
          PY

          echo '=== SERVICE ==='
          sudo systemctl status rhocodec-llm.service --no-pager -l | head -40 || true
          echo '=== RESOURCES ==='
          free -h
          df -h /
          echo '=== PORTS (existing services preserved) ==='
          sudo ss -lntp | grep -E '(:18080|:8080|:11931|:18789)' || true
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
