name: Apply Zhice UI Polish Once

on:
  push:
    branches: [ui-zhice-native-polish]
    paths:
      - ".github/workflows/apply-zhice-ui-polish-once.yml"

permissions:
  contents: write

jobs:
  polish-and-validate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui-zhice-native-polish
          fetch-depth: 0

      - name: Apply native UI changes
        shell: pwsh
        run: |
          python tools/apply_zhice_ui_polish.py

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true
          modules: "qtpdf"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S native/qt -B build-qt -G "Visual Studio 17 2022" -A x64

      - name: Build native desktop app
        shell: pwsh
        run: |
          cmake --build build-qt --config Release --parallel
          $exe = "build-qt\Release\Catalyst Longevity Research.exe"
          if (-not (Test-Path $exe)) { throw "Native Qt executable was not produced: $exe" }

      - name: Run native self-test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build-qt\Release\Catalyst Longevity Research.exe").Path
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test" -WorkingDirectory (Split-Path $exe) -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Native self-test failed with exit code $($test.ExitCode)" }

      - name: Smoke-test desktop window
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build-qt\Release\Catalyst Longevity Research.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 6
            if ($process.HasExited) { throw "Desktop app exited unexpectedly with code $($process.ExitCode)" }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Commit validated UI changes and clean temporary files
        shell: pwsh
        run: |
          Remove-Item "tools/apply_zhice_ui_polish.py" -Force
          Remove-Item ".github/workflows/apply-zhice-ui-polish-once.yml" -Force
          git config user.name "stloendays"
          git config user.email "157110190+stloendays@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { throw "No validated UI changes were produced" }
          git commit -m "Upgrade native UI and rename product to Zhice"
          git push origin HEAD:ui-zhice-native-polish
