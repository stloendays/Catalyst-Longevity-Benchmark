name: Tony v1.02 release zero-crop replay

on:
  push:
    branches:
      - integration/tony-v102-zero-crop-release
    paths:
      - '.github/scripts/apply_tony_zero_crop_guard_release.py'
      - '.github/workflows/tony-v102-release-zero-crop-replay.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tony-v102-release-zero-crop
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/tony-v102-zero-crop-release
          fetch-depth: 0
      - name: Apply verified zero-crop logic on current release head
        run: python3 .github/scripts/apply_tony_zero_crop_guard_release.py
      - name: Verify source invariant
        run: |
          grep -F 'const qreal zeroCropFit=qMin(' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -F 'qBound(minCenterX,desiredCenterX,maxCenterX)' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -F 'qBound(minCenterY,desiredCenterY,maxCenterY)' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -F 'if(qAlpha(line[x])>0)' bear_agent_pet/client/src/PetWindowV7.cpp
          ! grep -F 'if(qAlpha(line[x])>8)' bear_agent_pet/client/src/PetWindowV7.cpp
      - name: Commit replayed source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bear_agent_pet/client/src/PetWindowV7.cpp
          git commit -m 'Replay zero-crop rendering on Tony v1.01 release head'
          git push origin HEAD:integration/tony-v102-zero-crop-release

  windows-build:
    needs: patch
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/tony-v102-zero-crop-release
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebsockets'
          cache: true
      - name: Verify release version and artwork
        shell: pwsh
        run: |
          $version=(Get-Content bear_agent_pet/client/VERSION -Raw).Trim()
          if ($version -ne '1.0.1') { throw "Expected release version 1.0.1, got $version" }
          python bear_agent_pet/client/tools/validate_state_assets.py
      - name: Configure
        shell: pwsh
        run: cmake -S bear_agent_pet/client -B bear_agent_pet/client/build -G "Visual Studio 17 2022" -A x64
      - name: Build
        shell: pwsh
        run: cmake --build bear_agent_pet/client/build --config Release --parallel
      - name: Verify zero-crop invariant after build
        shell: pwsh
        run: |
          $src=Get-Content bear_agent_pet/client/src/PetWindowV7.cpp -Raw
          foreach($token in @('const qreal zeroCropFit=qMin(','qBound(minCenterX,desiredCenterX,maxCenterX)','qBound(minCenterY,desiredCenterY,maxCenterY)','if(qAlpha(line[x])>0)','QRectF(0,0,sprite->width(),sprite->height())')) {
            if(-not $src.Contains($token)) { throw "Missing zero-crop token: $token" }
          }
          if($src.Contains('if(qAlpha(line[x])>8)')) { throw 'Legacy alpha clipping threshold remains' }
          Write-Host 'TONY_RELEASE_ZERO_CROP_BUILD=PASS'

  cleanup:
    needs: windows-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/tony-v102-zero-crop-release
          fetch-depth: 0
      - name: Remove temporary replay machinery
        run: |
          rm -f .github/scripts/apply_tony_zero_crop_guard_release.py
          rm -f .github/workflows/tony-v102-release-zero-crop-replay.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary Tony v1.02 replay gate'
          git push origin HEAD:integration/tony-v102-zero-crop-release
