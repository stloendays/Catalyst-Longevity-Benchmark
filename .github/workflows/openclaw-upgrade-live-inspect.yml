name: Inspect live OpenClaw upgrade

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/openclaw-upgrade-live-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"
      - name: Inspect upgrade state
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set +e
          echo '=== TIME ==='; date -Is
          echo '=== OPENCLAW VERSION ==='; /home/ubuntu/.npm-global/bin/openclaw --version 2>&1
          echo '=== NPM NODE PROCESSES ==='
          ps -eo pid,ppid,user,%cpu,%mem,etime,args --sort=-%cpu | grep -E 'npm|node|openclaw' | grep -v grep | head -80
          echo '=== DISK ==='; df -h /
          echo '=== MEMORY ==='; free -h
          echo '=== NPM CACHE ==='; du -sh /home/ubuntu/.npm /home/ubuntu/.npm-global 2>/dev/null
          echo '=== USER GATEWAY ==='; systemctl --user status openclaw-gateway.service --no-pager -l | head -35
          echo '=== LOCAL LLM ==='; sudo systemctl status rhocodec-llm.service --no-pager -l | head -30
          echo '=== RECENT FILES ==='
          find /home/ubuntu/.npm-global/lib/node_modules/openclaw -maxdepth 2 -type f -mmin -10 -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | tail -40
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
