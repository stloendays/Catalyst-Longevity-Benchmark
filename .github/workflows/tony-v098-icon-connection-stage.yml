name: Stage Tony 0.9.8 icon and connection hardening

on:
  push:
    branches:
      - fix/tony-v098-icon-connection
    paths:
      - '.github/workflows/tony-v098-icon-connection-stage.yml'
      - '.github/scripts/apply_tony_v098_icon_connection.py'
      - 'bear_agent_pet/client/assets/tony-app.ico'
      - 'bear_agent_pet/client/src/**'
      - 'bear_agent_pet/client/installer/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tony-v098-icon-connection-stage
  cancel-in-progress: true

jobs:
  windows-proof:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tony-v098-icon-connection
          fetch-depth: 0

      - name: Build Tony app icon from approved artwork
        shell: pwsh
        run: |
          $source = 'bear_agent_pet/client/assets/states/idle.png'
          $iconPath = 'bear_agent_pet/client/assets/tony-app.ico'
          if (-not (Test-Path $source)) { throw 'Approved Tony idle artwork is missing' }
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick -y --no-progress
          }
          $bg = Join-Path $env:RUNNER_TEMP 'tony-icon-bg.png'
          $character = Join-Path $env:RUNNER_TEMP 'tony-icon-character.png'
          $master = Join-Path $env:RUNNER_TEMP 'tony-icon-master.png'
          & magick -size 256x256 xc:none -fill '#F1E7D5' -draw 'roundrectangle 8,8 248,248 46,46' $bg
          if ($LASTEXITCODE -ne 0) { throw 'Could not create Tony icon background' }
          & magick $source -trim +repage -resize '196x196>' $character
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare Tony icon character artwork' }
          & magick $bg $character -gravity center -geometry '+0+6' -composite $master
          if ($LASTEXITCODE -ne 0) { throw 'Could not compose Tony icon master' }
          & magick $master -define icon:auto-resize=256,64,48,32,16 $iconPath
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $iconPath)) { throw 'Could not create Tony Windows icon' }
          Write-Host 'TONY_ICON_SOURCE=approved states/idle.png; no character crop or redesign'

      - name: Validate Windows icon structure
        shell: pwsh
        run: |
          $iconPath = 'bear_agent_pet/client/assets/tony-app.ico'
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $iconPath))
          if ($bytes.Length -lt 1024) { throw "Tony icon is unexpectedly small: $($bytes.Length) bytes" }
          if ($bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1 -or $bytes[3] -ne 0) {
            throw 'Tony icon does not have a valid ICO header'
          }
          $count = [BitConverter]::ToUInt16($bytes, 4)
          if ($count -lt 3) { throw "Tony icon has too few embedded sizes: $count" }
          for ($i=0; $i -lt $count; $i++) {
            $entry = 6 + 16 * $i
            $size = [BitConverter]::ToUInt32($bytes, $entry + 8)
            $offset = [BitConverter]::ToUInt32($bytes, $entry + 12)
            if ($size -lt 8 -or ($offset + $size) -gt $bytes.Length) { throw "Invalid ICO entry $i" }
            $isPng = $bytes[$offset] -eq 0x89 -and $bytes[$offset+1] -eq 0x50 -and $bytes[$offset+2] -eq 0x4e -and $bytes[$offset+3] -eq 0x47
            if (-not $isPng) {
              $dibHeader = [BitConverter]::ToUInt32($bytes, $offset)
              if ($dibHeader -notin @(40,108,124)) { throw "ICO entry $i uses unsupported DIB header $dibHeader" }
            }
          }
          Add-Type -AssemblyName System.Drawing
          $icon = New-Object System.Drawing.Icon((Resolve-Path $iconPath))
          if ($null -eq $icon) { throw 'System.Drawing could not load Tony icon' }
          $icon.Dispose()
          $sha = (Get-FileHash -Algorithm SHA256 $iconPath).Hash.ToLowerInvariant()
          Write-Host "TONY_APP_ICON_BYTES=PASS entries=$count sha256=$sha"

      - name: Apply guarded runtime patch
        shell: pwsh
        run: python .github/scripts/apply_tony_v098_icon_connection.py

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebsockets'
          cache: true

      - name: Validate artwork and connection source contract
        shell: pwsh
        run: |
          python bear_agent_pet/client/tools/validate_state_assets.py
          $source = Get-Content bear_agent_pet/client/src/AgentClient.cpp -Raw
          foreach ($needle in @('connectWatchdog_','setTransferTimeout(12000)','setTransferTimeout(8000)','friendlyTransportMessage','scheduleReconnect')) {
            if (-not $source.Contains($needle)) { throw "Missing connection hardening marker: $needle" }
          }
          $pet = Get-Content bear_agent_pet/client/src/PetWindowV7.cpp -Raw
          if (-not $pet.Contains('tray_.setIcon(QApplication::windowIcon())')) { throw 'Tray icon integration missing' }
          $installer = Get-Content bear_agent_pet/client/installer/TonyDesktopPet.iss -Raw
          if (-not $installer.Contains('SetupIconFile=..\assets\tony-app.ico')) { throw 'Installer icon integration missing' }
          Write-Host 'TONY_CONNECTION_SOURCE_CONTRACT=PASS'

      - name: Configure and build Release
        shell: pwsh
        run: |
          cmake -S bear_agent_pet/client -B bear_agent_pet/client/build -G 'Visual Studio 17 2022' -A x64
          cmake --build bear_agent_pet/client/build --config Release --parallel

      - name: Verify embedded Windows icon and runtime startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'bear_agent_pet/client/build/Release/TonyDesktopPet.exe').Path
          $rc = Get-Content bear_agent_pet/client/build/TonyVersion.rc -Raw
          if (-not $rc.Contains('IDI_TONY_APP_ICON ICON')) { throw 'Generated RC does not contain Tony icon resource' }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw 'Windows could not extract an associated icon from TonyDesktopPet.exe' }
          $proof = Join-Path $env:RUNNER_TEMP 'tony-exe-icon.png'
          $bitmap = $icon.ToBitmap()
          $bitmap.Save($proof, [System.Drawing.Imaging.ImageFormat]::Png)
          $bitmap.Dispose()
          $icon.Dispose()
          if ((Get-Item $proof).Length -lt 500) { throw 'Extracted executable icon proof is unexpectedly small' }
          Write-Host "TONY_EXE_ICON=PASS proof=$proof"

          $env:TONY_VISUAL_ACTION='idle'
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($p.HasExited) { throw "Tony exited during startup proof: $($p.ExitCode)" }
            Write-Host 'TONY_V098_STARTUP=PASS'
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Tony-v0.9.8-icon-proof
          path: |
            ${{ runner.temp }}/tony-icon-master.png
            ${{ runner.temp }}/tony-exe-icon.png
          if-no-files-found: error

      - name: Commit Windows-tested source changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bear_agent_pet/client/assets/tony-app.ico bear_agent_pet/client/src/TonyVersion.rc.in bear_agent_pet/client/src/main.cpp bear_agent_pet/client/src/PetWindowV7.cpp bear_agent_pet/client/src/SettingsDialog.cpp bear_agent_pet/client/src/AgentClient.h bear_agent_pet/client/src/AgentClient.cpp bear_agent_pet/client/installer/TonyDesktopPet.iss
          if (git diff --cached --quiet) {
            Write-Host 'No staged source changes; guarded patch was already committed.'
            exit 0
          }
          git commit -m 'Integrate Tony app icon and harden Agent connection'
          git push origin HEAD:fix/tony-v098-icon-connection
