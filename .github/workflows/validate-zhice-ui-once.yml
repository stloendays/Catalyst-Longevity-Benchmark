name: Validate Zhice UI Once

on:
  push:
    branches: [ui-zhice-monochrome]
    paths:
      - ".github/workflows/validate-zhice-ui-once.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-zhice-monochrome
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true
          modules: "qtpdf"
      - name: Configure CMake
        shell: pwsh
        run: cmake -S native/qt -B build-qt -G "Visual Studio 17 2022" -A x64
      - name: Build native C++ application
        shell: pwsh
        run: cmake --build build-qt --config Release --parallel
      - name: Run native self-test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build-qt\Release\Catalyst Longevity Research.exe").Path
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test" -WorkingDirectory (Split-Path $exe) -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Native self-test failed with exit code $($test.ExitCode)" }
      - name: Smoke-test native window
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build-qt\Release\Catalyst Longevity Research.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 6
            if ($process.HasExited) { throw "Native desktop app exited unexpectedly with code $($process.ExitCode)" }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

  cleanup:
    needs: validate
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-zhice-monochrome
          fetch-depth: 0
      - name: Remove one-shot validation workflow
        shell: bash
        run: |
          rm .github/workflows/validate-zhice-ui-once.yml
          git config user.name "stloendays"
          git config user.email "157110190+stloendays@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-shot Zhice UI validation workflow"
          git push origin HEAD:ui-zhice-monochrome
