name: Tony Agent end-to-end smoke

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bear-agent-e2e.yml

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"

      - name: Exercise real Tony conversations through the deployed gateway
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          VENV='/home/ubuntu/.local/share/bear-agent/venv'
          test -x "$VENV/bin/python"
          curl -fsS http://127.0.0.1:18790/health
          echo

          "$VENV/bin/python" - <<'PY'
          import asyncio
          import json
          import websockets

          async def recv_json(ws, timeout=280):
              return json.loads(await asyncio.wait_for(ws.recv(), timeout))

          async def ask(ws, content, label):
              await ws.send(json.dumps({
                  'type':'message',
                  'id':f'github-actions-e2e-{label}',
                  'content':content,
              }, ensure_ascii=False))
              events=[]
              final=None
              while True:
                  msg=await recv_json(ws)
                  events.append(msg)
                  if msg.get('type') == 'error':
                      raise RuntimeError(f"{label}: {msg.get('message','Tony Gateway error')}")
                  if msg.get('type') == 'final':
                      final=msg
                      break
              text=str(final.get('content','')).strip()
              assert text, (label, final)
              assert final.get('action'), (label, final)
              assert final.get('emotion'), (label, final)
              kinds=[e.get('type') for e in events]
              assert 'agent_state' in kinds, (label, kinds)
              assert 'text_delta' in kinds, (label, kinds)
              print(f'{label}_AGENT=', final.get('agent'))
              print(f'{label}_FALLBACK=', final.get('fallback'))
              print(f'{label}_ACTION=', final.get('action'))
              print(f'{label}_EMOTION=', final.get('emotion'))
              print(f'{label}_TEXT=', text[:800].replace('\n',' '))
              return text, final

          async def main():
              async with websockets.connect(
                  'ws://127.0.0.1:18790/agent/ws', ping_interval=20, ping_timeout=20
              ) as ws:
                  first=await recv_json(ws, 10)
                  second=await recv_json(ws, 10)
                  assert first == {'type':'agent_state','state':'idle'}, first
                  assert second.get('type') == 'avatar_action', second

                  en, _ = await ask(ws, 'In one short sentence, introduce yourself as Tony.', 'CASUAL_EN')
                  assert 'tony' in en.casefold(), en

                  zh, _ = await ask(ws, '你怕冷吗？请只用一句自然的中文回答。', 'CASUAL_ZH')
                  assert any('\u4e00' <= ch <= '\u9fff' for ch in zh), zh

                  chem, _ = await ask(ws, 'Chemistry check: in one short sentence, what is the oxidation state of oxygen in H2O?', 'CHEMISTRY')
                  normalized=chem.replace('−','-').replace('–','-').replace('—','-').replace(' ','')
                  assert '-2' in normalized or '−2' in chem, chem

                  marker='CATALYST-731'
                  await ask(ws, f'Remember this exact test marker for my next message: {marker}. Reply briefly.', 'MEMORY_SET')
                  recalled, _ = await ask(ws, 'What exact test marker did I ask you to remember in my previous message?', 'MEMORY_GET')
                  assert marker.casefold() in recalled.casefold(), recalled

                  print('TONY_REAL_CONVERSATION_E2E=PASS')

          asyncio.run(main())
          PY
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
