name: Tony Agent end-to-end smoke

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bear-agent-e2e.yml

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"

      - name: Exercise real Tony boyfriend conversations
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          VENV='/home/ubuntu/.local/share/bear-agent/venv'
          test -x "$VENV/bin/python"
          curl -fsS http://127.0.0.1:18790/health >/tmp/tony-e2e-health.json
          cat /tmp/tony-e2e-health.json
          echo

          "$VENV/bin/python" - <<'PY'
          import asyncio
          import json
          import time
          import websockets

          health=json.load(open('/tmp/tony-e2e-health.json'))
          expected_model=str(health.get('local_model','')).strip()
          assert expected_model, health
          assert health.get('chat_only') is True, health
          assert health.get('language') == 'English', health
          assert health.get('persona') == 'Paula-boyfriend', health
          assert health.get('local_tools_enabled') is False, health
          assert health.get('openclaw_enabled') is False, health

          async def recv_json(ws, timeout=90):
              return json.loads(await asyncio.wait_for(ws.recv(), timeout))

          async def ask(ws, content, label):
              started=time.monotonic()
              await ws.send(json.dumps({
                  'type':'message',
                  'id':f'github-actions-e2e-{label}',
                  'content':content,
              }))
              events=[]
              while True:
                  msg=await recv_json(ws)
                  events.append(msg)
                  if msg.get('type') == 'error':
                      raise RuntimeError(f"{label}: {msg.get('message','Tony Gateway error')}")
                  if msg.get('type') == 'final':
                      final=msg
                      break
              elapsed=time.monotonic()-started
              text=str(final.get('content','')).strip()
              assert text, (label, final)
              agent=str(final.get('agent',''))
              assert agent == f'local-tony-chat:{expected_model}', (label, final, expected_model)
              assert final.get('fallback') is False, (label, final)
              assert final.get('action'), (label, final)
              assert final.get('emotion'), (label, final)
              assert not any('\u4e00' <= ch <= '\u9fff' for ch in text), (label, text)
              assert len(text.split()) <= 55, (label, text)
              kinds=[e.get('type') for e in events]
              assert 'agent_state' in kinds, (label, kinds)
              assert 'text_delta' in kinds, (label, kinds)
              print(f'{label}_LATENCY_SEC=', round(elapsed,2))
              print(f'{label}_TEXT=', text[:500].replace('\n',' '))
              return text, elapsed

          async def main():
              async with websockets.connect(
                  'ws://127.0.0.1:18790/agent/ws', ping_interval=20, ping_timeout=20
              ) as ws:
                  first=await recv_json(ws, 10)
                  second=await recv_json(ws, 10)
                  assert first == {'type':'agent_state','state':'idle'}, first
                  assert second.get('type') == 'avatar_action', second

                  intro,intro_latency=await ask(ws, 'Hi Tony. Tell me who you are in one short sentence.', 'INTRO')
                  low=intro.casefold()
                  assert ('boyfriend' in low) or ('paula' in low) or ('teddy' in low), intro

                  paula,_=await ask(ws, 'Who am I to you?', 'PAULA_RELATIONSHIP')
                  low=paula.casefold()
                  assert ('paula' in low) or ('girlfriend' in low), paula
                  assert ('boyfriend' in low) or ('girlfriend' in low) or ('love' in low), paula

                  marker='TEDDY-417'
                  await ask(ws, f'Remember this little secret for my next message: {marker}.', 'MEMORY_SET')
                  recalled,_=await ask(ws, 'What was the little secret I just asked you to remember?', 'MEMORY_GET')
                  assert marker.casefold() in recalled.casefold(), recalled

                  if health.get('model_profile') == 'fast':
                      print('TONY_FAST_PROFILE_FIRST_REPLY_SEC=', round(intro_latency,2))
                  else:
                      print('TONY_QUALITY_PROFILE_FIRST_REPLY_SEC=', round(intro_latency,2))
                  print('TONY_ACTIVE_MODEL=', expected_model)
                  print('TONY_ENGLISH_BOYFRIEND_CHAT=PASS')

          asyncio.run(main())
          PY
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
