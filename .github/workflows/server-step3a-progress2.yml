name: Server Step3A progress 2

on:
  push:
    paths:
      - .github/workflows/server-step3a-progress2.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"
      - name: Probe
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          date -Is
          ROOT=/home/ubuntu/local2b-training/step3a-recover
          echo '=== ROOT ==='
          ls -lh "$ROOT" 2>/dev/null || true
          echo '=== CHECKPOINTS ==='
          find "$ROOT/checkpoints" -maxdepth 2 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TS %p %s bytes\n' 2>/dev/null | sort | tail -30 || true
          echo '=== LOG TAIL ==='
          tail -80 "$ROOT/train.log" 2>/dev/null || true
          echo '=== PROC ==='
          ps -eo pid,ppid,lstart,etime,%cpu,%mem,args | grep -E 'llama-finetune-lora|timeout 4200|llama-server' | grep -v grep || true
          echo '=== MEMORY ==='
          free -h
          echo '=== SERVICE ==='
          systemctl is-active rhocodec-llm.service || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
# duplicate inspection
