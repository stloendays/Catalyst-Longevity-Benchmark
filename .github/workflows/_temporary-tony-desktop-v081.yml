name: Apply Tony V0.8.1 desktop behavior

on:
  push:
    branches:
      - feature/teddy-agent-pet
    paths:
      - .github/workflows/_temporary-tony-desktop-v081.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/teddy-agent-pet
          fetch-depth: 0
      - name: Patch Tony desktop behavior
        run: python .github/scripts/patch_tony_desktop_v081.py
      - name: Validate patch
        run: git diff --check
      - name: Commit V0.8.1 changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bear_agent_pet/client bear_agent_pet/docs/TONY_DESKTOP_BEHAVIOR.md
          git commit -m "Add Tony desktop-aware behavior"
          git push origin HEAD:feature/teddy-agent-pet
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build_windows:
    needs: patch
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch.outputs.commit_sha }}
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebsockets'
          cache: true
      - name: Validate Tony artwork
        shell: pwsh
        run: python bear_agent_pet/client/tools/validate_state_assets.py
      - name: Configure
        shell: pwsh
        run: cmake -S bear_agent_pet/client -B bear_agent_pet/client/build -G "Visual Studio 17 2022" -A x64
      - name: Build
        shell: pwsh
        run: cmake --build bear_agent_pet/client/build --config Release --parallel
      - name: Package and smoke test
        shell: pwsh
        run: |
          cmake --install bear_agent_pet/client/build --config Release --prefix bear_agent_pet/client/package
          if ($LASTEXITCODE -ne 0) { throw "CMake install failed" }
          windeployqt --release --no-translations bear_agent_pet/client/package/TonyDesktopPet.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          $process = Start-Process -FilePath "bear_agent_pet/client/package/TonyDesktopPet.exe" -WorkingDirectory "bear_agent_pet/client/package" -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 6
            if ($process.HasExited) { throw "Tony exited during smoke test: $($process.ExitCode)" }
            Write-Host 'TONY_DESKTOP_V081_SMOKE=PASS'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: TonyDesktopPet-v0.8.1-desktop-windows-x64
          path: bear_agent_pet/client/package
          if-no-files-found: error
