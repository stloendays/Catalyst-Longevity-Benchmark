name: Build Tony desktop pet

on:
  workflow_dispatch:
  push:
    paths:
      - 'bear_agent_pet/client/**'
      - '.github/workflows/bear-agent-build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebsockets'
          cache: true
      - name: Configure
        shell: pwsh
        run: cmake -S bear_agent_pet/client -B bear_agent_pet/client/build -G "Visual Studio 17 2022" -A x64
      - name: Build
        shell: pwsh
        run: cmake --build bear_agent_pet/client/build --config Release --parallel
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bear_agent_pet/client/package/assets | Out-Null
          Copy-Item bear_agent_pet/client/build/Release/TonyDesktopPet.exe bear_agent_pet/client/package/
          windeployqt --release --no-translations bear_agent_pet/client/package/TonyDesktopPet.exe
          Set-Content -Path bear_agent_pet/client/package/assets/PUT_TONY_PNG_HERE.txt -Value 'Place the approved Tony artwork here as tony.png.'
      - uses: actions/upload-artifact@v4
        with:
          name: TonyDesktopPet-windows-x64
          path: bear_agent_pet/client/package
          if-no-files-found: error
