name: Build Tony desktop pet

on:
  workflow_dispatch:
  push:
    paths:
      - 'bear_agent_pet/client/**'
      - '.github/tony_assets_bootstrap/**'
      - '.github/workflows/bear-agent-build-windows.yml'

permissions:
  contents: write

concurrency:
  group: tony-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-artwork:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.integrate.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bear-agent-pet
          fetch-depth: 0

      - name: Integrate seven Tony living-interaction animations
        id: integrate
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD_DIR='.github/tony_assets_bootstrap'
          echo 'changed=false' >> "$GITHUB_OUTPUT"
          if ! compgen -G "$PAYLOAD_DIR/chunk_*" > /dev/null; then
            echo 'TONY_V010_ARTWORK_ALREADY_INTEGRATED=PASS'
            exit 0
          fi

          cat "$PAYLOAD_DIR"/chunk_* | tr -d '\r\n ' | base64 -d > /tmp/tony-v010-assets.zip
          unzip -t /tmp/tony-v010-assets.zip
          unzip -o /tmp/tony-v010-assets.zip -d .
          python bear_agent_pet/client/tools/apply_v010_interactions.py
          python bear_agent_pet/client/tools/validate_state_assets.py

          rm -rf "$PAYLOAD_DIR"
          rm -f .github/workflows/tony-v010-integrate.yml
          rm -f bear_agent_pet/client/src/EmbeddedActionAssets.h
          rm -f bear_agent_pet/client/src/EmbeddedActionAssetsInternal.h
          rm -f bear_agent_pet/client/src/EmbeddedActionAssets.cpp
          rm -f bear_agent_pet/client/src/EmbeddedActionAssets_pat.cpp

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add seven living Tony interaction animations'
          git push origin HEAD:feature/bear-agent-pet
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo 'TONY_V010_ARTWORK_INTEGRATION=PASS'

  build:
    needs: integrate-artwork
    if: needs.integrate-artwork.outputs.changed != 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebsockets'
          cache: true
      - name: Validate Tony state artwork
        shell: pwsh
        run: python bear_agent_pet/client/tools/validate_state_assets.py
      - name: Configure
        shell: pwsh
        run: cmake -S bear_agent_pet/client -B bear_agent_pet/client/build -G "Visual Studio 17 2022" -A x64
      - name: Build
        shell: pwsh
        run: cmake --build bear_agent_pet/client/build --config Release --parallel
      - name: Deploy Qt runtime and Tony artwork
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bear_agent_pet/client/package/assets | Out-Null
          cmake --install bear_agent_pet/client/build --config Release --prefix bear_agent_pet/client/package
          if ($LASTEXITCODE -ne 0) { throw "CMake install failed" }
          Copy-Item bear_agent_pet/client/RUN_TONY.md bear_agent_pet/client/package/
          $projectLine = Get-Content bear_agent_pet/client/CMakeLists.txt | Select-String 'project\(TonyDesktopPet VERSION ([0-9.]+)'
          $version = $projectLine.Matches[0].Groups[1].Value
          "TonyDesktopPet $version`ncommit=$env:GITHUB_SHA" | Set-Content bear_agent_pet/client/package/VERSION.txt
          windeployqt --release --no-translations bear_agent_pet/client/package/TonyDesktopPet.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
      - name: Verify packaged artwork and executable
        shell: pwsh
        run: |
          $source = (Resolve-Path bear_agent_pet/client/assets).Path
          $package = (Resolve-Path bear_agent_pet/client/package).Path
          foreach ($required in @('TonyDesktopPet.exe', 'assets/states', 'assets/animations')) {
            if (-not (Test-Path (Join-Path $package $required))) { throw "Missing package entry: $required" }
          }
          foreach ($file in Get-ChildItem $source -File -Recurse) {
            $relative = [IO.Path]::GetRelativePath($source, $file.FullName)
            $deployed = Join-Path "$package/assets" $relative
            if (-not (Test-Path $deployed)) { throw "Missing artwork: $relative" }
            if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash $deployed).Hash) {
              throw "Packaged artwork differs: $relative"
            }
          }
          Write-Host 'TONY_PACKAGE_ASSETS=PASS (formal assets validated and all packaged bytes match SHA256)'
          $originalPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          try {
            $process = Start-Process -FilePath "$package/TonyDesktopPet.exe" -WorkingDirectory $package -WindowStyle Hidden -PassThru
            try {
              Start-Sleep -Seconds 6
              if ($process.HasExited) { throw "Tony exited during smoke test: $($process.ExitCode)" }
              Write-Host 'TONY_DEPLOYED_SMOKE=PASS'
            } finally {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          } finally { $env:PATH = $originalPath }
      - uses: actions/upload-artifact@v4
        with:
          name: TonyDesktopPet-windows-x64
          path: bear_agent_pet/client/package
          if-no-files-found: error

      - name: Build signed-by-hash update manifest
        if: github.ref == 'refs/heads/feature/bear-agent-pet'
        id: update_package
        shell: pwsh
        run: |
          $projectLine = Get-Content bear_agent_pet/client/CMakeLists.txt | Select-String 'project\(TonyDesktopPet VERSION ([0-9.]+)'
          $version = $projectLine.Matches[0].Groups[1].Value
          $zip = Join-Path $PWD 'TonyDesktopPet-windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path bear_agent_pet/client/package/* -DestinationPath $zip -CompressionLevel Optimal
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $zip).Length
          $download = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/tony-desktop-latest/TonyDesktopPet-windows-x64.zip?run=$env:GITHUB_RUN_ID"
          $manifest = [ordered]@{
            schema = 1
            product = 'Tony Desktop Pet'
            platform = 'windows-x64'
            version = $version
            url = $download
            sha256 = $sha
            size = $size
            published_at = (Get-Date).ToUniversalTime().ToString('o')
            commit = $env:GITHUB_SHA
            minimum_updater_version = '0.9.0'
          } | ConvertTo-Json
          Set-Content -LiteralPath latest.json -Value $manifest -Encoding utf8
          Write-Host "TONY_UPDATE_MANIFEST=PASS version=$version sha256=$sha size=$size"
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT

      - name: Publish Tony automatic update source
        if: github.ref == 'refs/heads/feature/bear-agent-pet'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view tony-desktop-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create tony-desktop-latest `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --prerelease `
              --title 'Tony Desktop Pet automatic update channel' `
              --notes 'Managed automatically by the Tony Windows build. latest.json is the updater manifest.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create Tony update release.' }
          }
          gh release upload tony-desktop-latest `
            TonyDesktopPet-windows-x64.zip latest.json `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish Tony update assets.' }
          Write-Host "TONY_UPDATE_PUBLISH=PASS version=${{ steps.update_package.outputs.version }} sha256=${{ steps.update_package.outputs.sha256 }}"
