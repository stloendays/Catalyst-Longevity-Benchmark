name: Build Tony v1.0.8 chat UX and model router

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tony-v108-chat-ux-model-router
    paths:
      - 'bear_agent_pet/client/**'
      - 'bear_agent_pet/server_gateway/app/main.py'
      - 'bear_agent_pet/server_gateway/app/main_v08.py'
      - '.github/workflows/tony-v108-chat-ux-model-router.yml'

permissions:
  contents: read

concurrency:
  group: tony-v108-chat-ux-model-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate Tony v1.0.8 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < bear_agent_pet/client/VERSION)" = "1.0.8"
          python -m py_compile bear_agent_pet/server_gateway/app/main.py bear_agent_pet/server_gateway/app/main_v08.py
          python - <<'PY'
          from pathlib import Path

          bubble=Path('bear_agent_pet/client/src/SpeechBubble.cpp').read_text(encoding='utf-8')
          composer=Path('bear_agent_pet/client/src/ChatComposer.cpp').read_text(encoding='utf-8')
          agent=Path('bear_agent_pet/client/src/AgentClient.cpp').read_text(encoding='utf-8')
          server=Path('bear_agent_pet/server_gateway/app/main.py').read_text(encoding='utf-8')
          gateway=Path('bear_agent_pet/server_gateway/app/main_v08.py').read_text(encoding='utf-8')

          assert 'const int maxTextWidth=500;' in bubble
          assert 'r.height()+42,390' in bubble
          assert 'text.left(1800)' in bubble

          for text in ('Auto', 'Fast 0.8B', 'Quality 2B', 'agent/model_profile'):
              assert text in composer, text
          assert 'model_profile' in agent
          assert 'model_profile_routing_v1' in agent

          required_server = (
              'BEAR_LOCAL_FAST_MODEL_URL',
              'BEAR_LOCAL_QUALITY_MODEL_URL',
              'tony-qwen3.5-0.8b-q4',
              'tony-qwen3.5-2b-q4',
              'normalize_model_profile',
              '_technical_with_context',
              '_strip_hidden_reasoning',
              '_looks_like_meta_reasoning',
              'reasoning_content is deliberately ignored',
              '"reasoning_budget": 0',
              '"enable_thinking": False',
          )
          for text in required_server:
              assert text in server, text
          assert '18080/v1/chat/completions' in server
          assert '18081/v1/chat/completions' in server
          assert 'Tell me which part you want me to explain.' in server

          for text in ('1.0.8', 'model_profile_routing_v1', 'thinking_visible', 'available_model_profiles'):
              assert text in gateway, text
          assert 'request_model_profile' in gateway
          assert 'call_backend_stream(' in gateway
          print('TONY_V108_SOURCE=PASS')
          PY

  build-windows:
    needs: validate-source
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify Tony v1.0.8 source
        shell: pwsh
        run: |
          $version=(Get-Content bear_agent_pet/client/VERSION -Raw).Trim()
          if ($version -ne '1.0.8') { throw "Expected 1.0.8, got $version" }
          foreach ($path in @(
            'bear_agent_pet/client/src/SpeechBubble.cpp',
            'bear_agent_pet/client/src/ChatComposer.cpp',
            'bear_agent_pet/client/src/ChatComposer.h',
            'bear_agent_pet/client/src/AgentClient.cpp',
            'bear_agent_pet/client/assets/config/tony_autonomous_responses.json'
          )) {
            if (-not (Test-Path $path)) { throw "Missing 1.0.8 source: $path" }
          }

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebsockets'
          cache: true

      - name: Validate Tony artwork
        shell: pwsh
        run: python bear_agent_pet/client/tools/validate_state_assets.py

      - name: Configure
        shell: pwsh
        run: cmake -S bear_agent_pet/client -B bear_agent_pet/client/build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build bear_agent_pet/client/build --config Release --parallel

      - name: Package Qt runtime
        shell: pwsh
        run: |
          $package="$PWD/bear_agent_pet/client/package-v108"
          if (Test-Path $package) { Remove-Item $package -Recurse -Force }
          cmake --install bear_agent_pet/client/build --config Release --prefix $package
          if ($LASTEXITCODE -ne 0) { throw 'CMake install failed' }
          windeployqt --release --no-translations "$package/TonyDesktopPet.exe"
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          Copy-Item bear_agent_pet/client/RUN_TONY.md "$package/RUN_TONY.md"
          "TonyDesktopPet 1.0.8`ncommit=$env:GITHUB_SHA" | Set-Content "$package/VERSION.txt" -Encoding utf8

          $root=(Resolve-Path $package).Path
          $managed=Get-ChildItem $package -Recurse -File | ForEach-Object {
            $_.FullName.Substring($root.Length + 1)
          } | Sort-Object
          @($managed) + 'tony-file-list.txt' | Sort-Object -Unique | Set-Content "$package/tony-file-list.txt" -Encoding utf8

          foreach ($required in @(
            'TonyDesktopPet.exe',
            'VERSION',
            'VERSION.txt',
            'tony-install-root.marker',
            'tony-file-list.txt',
            'assets/config/tony_responses.json',
            'assets/config/tony_autonomous_responses.json'
          )) {
            if (-not (Test-Path (Join-Path $package $required))) { throw "Missing package entry: $required" }
          }
          if ((Get-Content "$package/VERSION" -Raw).Trim() -ne '1.0.8') { throw 'Packaged VERSION mismatch' }

      - name: Smoke test executable
        shell: pwsh
        run: |
          $package="$PWD/bear_agent_pet/client/package-v108"
          $process=Start-Process -FilePath "$package/TonyDesktopPet.exe" -WorkingDirectory $package -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 7
            if ($process.HasExited) { throw "Tony exited during smoke test: $($process.ExitCode)" }
            Write-Host 'TONY_V108_WINDOWS_SMOKE=PASS'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: TonyDesktopPet-1.0.8-windows-x64-chat-model-router
          path: bear_agent_pet/client/package-v108
          if-no-files-found: error
