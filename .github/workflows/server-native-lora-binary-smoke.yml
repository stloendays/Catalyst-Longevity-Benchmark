name: Server native LoRA binary smoke

on:
  push:
    paths:
      - .github/workflows/server-native-lora-binary-smoke.yml

permissions:
  contents: read

jobs:
  train-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"

      - name: Retry real Q4 CPU LoRA training on server
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ConnectTimeout=15 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          TRAINER=/home/ubuntu/qvac-trainer-step3/llama-finetune-lora
          MODEL=/opt/rhocodec-llm/models/Qwen3.5-2B-Q4_K_M.gguf
          DATA=/tmp/local2b_lora_smoke_v4.jsonl
          OUT=/tmp/local2b_lora_smoke_v4.gguf
          LOG=/tmp/local2b_lora_smoke_v4.log
          test -x "$TRAINER"
          test -s "$MODEL"

          cat > "$DATA" <<'JSONL'
          {"messages":[{"role":"system","content":"You are a compact local work agent."},{"role":"user","content":"Reply exactly OK."},{"role":"assistant","content":"OK"}]}
          {"messages":[{"role":"system","content":"You are a compact local work agent."},{"role":"user","content":"Reply exactly YES."},{"role":"assistant","content":"YES"}]}
          {"messages":[{"role":"system","content":"You are a compact local work agent."},{"role":"user","content":"Reply exactly READY."},{"role":"assistant","content":"READY"}]}
          {"messages":[{"role":"system","content":"You are a compact local work agent."},{"role":"user","content":"Reply exactly DONE."},{"role":"assistant","content":"DONE"}]}
          JSONL
          rm -f "$OUT" "$LOG"

          WAS_ACTIVE=0
          if systemctl is-active --quiet rhocodec-llm.service; then
            WAS_ACTIVE=1
            sudo systemctl stop rhocodec-llm.service
          fi
          restore_service() {
            if [ "$WAS_ACTIVE" -eq 1 ]; then
              sudo systemctl start rhocodec-llm.service || true
            fi
          }
          trap restore_service EXIT

          echo '=== SERVER PRETRAIN ==='
          date -Is
          free -h
          set +e
          timeout 900 "$TRAINER" \
            -m "$MODEL" \
            -f "$DATA" \
            --assistant-loss-only \
            --num-epochs 1 \
            --lora-rank 4 \
            --lora-alpha 8 \
            --lora-modules attn_q,attn_v \
            --lora-seed 20260908 \
            --learning-rate 1e-5 \
            --weight-decay 0 \
            --checkpoint-save-steps 0 \
            --output-adapter "$OUT" \
            -c 64 -b 8 -ub 8 -ngl 0 -fa off \
            2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          set -e

          echo "TRAIN_RC=$RC"
          tail -120 "$LOG" || true
          ls -lh "$OUT" 2>/dev/null || true
          free -h

          restore_service
          WAS_ACTIVE=0
          trap - EXIT
          echo "SERVICE=$(systemctl is-active rhocodec-llm.service || true)"
          if [ "$RC" -ne 0 ]; then exit "$RC"; fi
          test -s "$OUT"
          echo 'SERVER_NATIVE_LORA_SMOKE_V2=PASS'
          REMOTE

      - name: Remove key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
