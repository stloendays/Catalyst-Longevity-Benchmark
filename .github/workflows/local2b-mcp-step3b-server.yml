name: Local2B MCP Step 3B server LoRA

on:
  workflow_dispatch:
  push:
    paths:
      - training/local2b_mcp/.stage3b-trigger

permissions:
  contents: read

concurrency:
  group: local2b-server-lora-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout Step 3 branch
        uses: actions/checkout@v4

      - name: Rebuild and verify frozen Stage 3B curriculum
        run: |
          rm -rf "$RUNNER_TEMP/local2b-s2" "$RUNNER_TEMP/local2b-s3b"
          python3 training/local2b_mcp/generate_stage2_dataset.py \
            --out "$RUNNER_TEMP/local2b-s2" \
            --train 16000 --val 0 --test 0 --seed 20260908
          mkdir -p "$RUNNER_TEMP/local2b-s3b"
          python3 training/local2b_mcp/prepare_qvac_sft_stage3b.py \
            --input "$RUNNER_TEMP/local2b-s2/train.jsonl" \
            --output "$RUNNER_TEMP/local2b-s3b/train.jsonl" \
            --manifest "$RUNNER_TEMP/local2b-s3b/manifest.json" \
            --seed 20260908 --max-tools 2
          EXPECTED=0ea19f7143ebcf2de083a4c62ea076050032c49cd6d6e3e6073bf5b0bfc3528c
          ACTUAL=$(sha256sum "$RUNNER_TEMP/local2b-s3b/train.jsonl" | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          echo "STEP3B_DATA_SHA256=$ACTUAL"

      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"

      - name: Transfer curriculum and training wrapper
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 \
            'mkdir -p /home/ubuntu/local2b-training/step3b'
          scp -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" \
            "$RUNNER_TEMP/local2b-s3b/train.jsonl" \
            "$RUNNER_TEMP/local2b-s3b/manifest.json" \
            ubuntu@150.158.27.206:/home/ubuntu/local2b-training/step3b/
          scp -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" \
            training/local2b_mcp/run_server_qvac_lora.sh \
            ubuntu@150.158.27.206:/home/ubuntu/local2b-training/run_server_qvac_lora.sh
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 \
            'chmod +x /home/ubuntu/local2b-training/run_server_qvac_lora.sh && bash -n /home/ubuntu/local2b-training/run_server_qvac_lora.sh'

      - name: Continue Stage 3B from Stage 3A adapter on server
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=600 -o ConnectTimeout=15 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT=/home/ubuntu/local2b-training/step3b
          STAGE3A=/opt/rhocodec-llm/adapters/local2b-mcp-step3a-r4-qv.gguf
          STAGE3B=/opt/rhocodec-llm/adapters/local2b-mcp-step3b-r4-qv.gguf
          EXPECTED_STAGE3A=db8b9d9509c752941c47261017e52dab0a9590bc1d4f94dc09fc2e061fa0eb27
          test -s "$STAGE3A"
          test "$(sha256sum "$STAGE3A" | awk '{print $1}')" = "$EXPECTED_STAGE3A"
          rm -rf "$ROOT/checkpoints"
          flock -n /home/ubuntu/local2b-training/server-lora.lock \
            /home/ubuntu/local2b-training/run_server_qvac_lora.sh \
            --data "$ROOT/train.jsonl" \
            --lora-init "$STAGE3A" \
            --output "$ROOT/local2b-mcp-step3b-r4-qv.gguf" \
            --context 576 --batch 16 --ubatch 8 \
            --rank 4 --alpha 8 --modules attn_q,attn_v \
            --epochs 1 --learning-rate 1e-5 --seed 20260908 \
            --timeout-seconds 14400 \
            --checkpoint-steps 10 \
            --checkpoint-dir "$ROOT/checkpoints" \
            --log "$ROOT/train.log" \
            --result "$ROOT/result.txt" \
            --install "$STAGE3B"
          cat "$ROOT/result.txt"
          grep -q "^lora_init_sha256=$EXPECTED_STAGE3A$" "$ROOT/result.txt"
          test -s "$STAGE3B"
          OUTPUT_SHA=$(awk -F= '/^adapter_sha256=/{print $2}' "$ROOT/result.txt")
          INSTALLED_SHA=$(sha256sum "$STAGE3B" | awk '{print $1}')
          test -n "$OUTPUT_SHA"
          test "$INSTALLED_SHA" = "$OUTPUT_SHA"
          curl -fsS http://127.0.0.1:18080/v1/models >/dev/null
          echo "STAGE3B_INSTALLED_SHA256=$INSTALLED_SHA"
          echo 'STAGE3B_SERVER_TRAIN=PASS'
          REMOTE

      - name: Collect Stage 3B metadata
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/step3b-result"
          for f in manifest.json result.txt train.log; do
            scp -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" \
              "ubuntu@150.158.27.206:/home/ubuntu/local2b-training/step3b/$f" \
              "$RUNNER_TEMP/step3b-result/$f" || true
          done

      - name: Upload Stage 3B metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local2b-mcp-step3b-server-result
          path: ${{ runner.temp }}/step3b-result/
          if-no-files-found: warn

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
