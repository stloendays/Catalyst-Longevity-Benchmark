name: Local2B MCP Step 3B server LoRA

on:
  push:
    paths:
      - .github/workflows/local2b-mcp-step3b-server.yml

permissions:
  contents: read

jobs:
  prepare-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Step 3 branch
        uses: actions/checkout@v4
      - name: Rebuild frozen train and freeze Stage 3B curriculum
        run: |
          rm -rf "$RUNNER_TEMP/local2b-s2" "$RUNNER_TEMP/local2b-s3b"
          python3 training/local2b_mcp/generate_stage2_dataset.py \
            --out "$RUNNER_TEMP/local2b-s2" \
            --train 16000 --val 0 --test 0 --seed 20260908
          mkdir -p "$RUNNER_TEMP/local2b-s3b"
          python3 training/local2b_mcp/prepare_qvac_sft_stage3b.py \
            --input "$RUNNER_TEMP/local2b-s2/train.jsonl" \
            --output "$RUNNER_TEMP/local2b-s3b/train.jsonl" \
            --manifest "$RUNNER_TEMP/local2b-s3b/manifest.json" \
            --seed 20260908 --max-tools 2
          cat "$RUNNER_TEMP/local2b-s3b/manifest.json"
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("${{ runner.temp }}/local2b-s3b/train.jsonl")
          rows = [json.loads(x) for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
          assert len(rows) == 64, len(rows)
          assert all(r.get("messages") for r in rows)
          print("STEP3B_CURRICULUM_PRECHECK=PASS")
          PY
      - name: Upload frozen Stage 3B curriculum
        uses: actions/upload-artifact@v4
        with:
          name: local2b-mcp-step3b-curriculum
          path: ${{ runner.temp }}/local2b-s3b/
          if-no-files-found: error
