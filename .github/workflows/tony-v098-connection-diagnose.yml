name: Tony v0.9.8 real Windows E2E

on:
  workflow_dispatch:
  push:
    branches:
      - fix/tony-v098-icon-connection
    paths:
      - '.github/workflows/tony-v098-connection-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: tony-v098-real-windows-e2e
  cancel-in-progress: true

jobs:
  windows-tony-public-e2e:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      TONY_WSS_URL: wss://150-158-27-206.sslip.io/agent/ws
      TONY_HTTPS_BASE: https://150-158-27-206.sslip.io
      TONY_SERVER_IP: 150.158.27.206
      TONY_E2E_DEVICE: Tony v0.9.8 Windows AgentClient E2E
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebsockets'
          cache: true

      - name: Public HTTPS preflight from Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $health = Invoke-RestMethod -Uri "$env:TONY_HTTPS_BASE/health" -Method Get -TimeoutSec 20
          if (-not $health.ok) { throw 'Tony public /health did not return ok=true' }
          if ($health.service -ne 'Tony Desktop Companion') { throw "Unexpected service: $($health.service)" }
          if (-not $health.device_code_pairing) { throw 'Device-code pairing is not enabled' }
          Write-Host "WINDOWS_HTTPS_HEALTH=PASS"
          Write-Host "gateway_version=$($health.version)"
          Write-Host "backend=$($health.backend)"
          Write-Host "local_model=$($health.local_model)"

      - name: Build v0.9.8 AgentClient E2E harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $PWD '.ci_tony_v098_e2e'
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          @'
          cmake_minimum_required(VERSION 3.24)
          project(TonyV098E2E LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_AUTOMOC ON)
          find_package(Qt6 6.5 REQUIRED COMPONENTS Core Network WebSockets)
          add_executable(tony_v098_e2e
              main.cpp
              ../bear_agent_pet/client/src/AgentClient.cpp
              ../bear_agent_pet/client/src/AgentClient.h
              ../bear_agent_pet/client/src/AppLogger.cpp
              ../bear_agent_pet/client/src/AppLogger.h
          )
          target_include_directories(tony_v098_e2e PRIVATE ../bear_agent_pet/client/src)
          target_compile_definitions(tony_v098_e2e PRIVATE NOMINMAX WIN32_LEAN_AND_MEAN)
          target_link_libraries(tony_v098_e2e PRIVATE Qt6::Core Qt6::Network Qt6::WebSockets Crypt32)
          '@ | Set-Content (Join-Path $src 'CMakeLists.txt') -Encoding utf8

          @'
          #include "AgentClient.h"
          #include <QCoreApplication>
          #include <QTimer>
          #include <QUrl>
          #include <iostream>

          int main(int argc, char **argv) {
              QCoreApplication app(argc, argv);
              QCoreApplication::setApplicationName("TonyDesktopPet-E2E");
              QCoreApplication::setApplicationVersion("0.9.8");

              AgentClient client;
              client.setLanguage("en");
              QString reply;
              bool sent = false;

              QObject::connect(&client, &AgentClient::pairingCodeReady,
                               [&](const QString &code, qint64 expiresAt) {
                  std::cout << "PAIRING_CODE=" << code.toStdString() << std::endl;
                  std::cout << "PAIRING_EXPIRES_AT=" << expiresAt << std::endl;
              });
              QObject::connect(&client, &AgentClient::paired,
                               [&](const QString &, const QString &deviceId, const QUrl &endpoint) {
                  std::cout << "PAIRING_APPROVED=PASS" << std::endl;
                  std::cout << "DEVICE_ID=" << deviceId.toStdString() << std::endl;
                  std::cout << "WSS_ENDPOINT=" << endpoint.toString().toStdString() << std::endl;
              });
              QObject::connect(&client, &AgentClient::connectionChanged,
                               [&](bool connected) {
                  if (!connected || sent) return;
                  sent = true;
                  std::cout << "WSS_AUTHENTICATED=PASS" << std::endl;
                  QTimer::singleShot(500, [&] {
                      client.sendMessage("Tony, answer this check in one short sentence: what is 2 + 3?");
                      std::cout << "TONY_MESSAGE_SENT=PASS" << std::endl;
                  });
              });
              QObject::connect(&client, &AgentClient::textDelta,
                               [&](const QString &piece) { reply += piece; });
              QObject::connect(&client, &AgentClient::answerFinished, [&] {
                  std::cout << "QWEN_STREAM_REPLY=" << reply.toStdString() << std::endl;
                  if (reply.trimmed().isEmpty()) {
                      std::cerr << "E2E_FAILURE=empty_model_reply" << std::endl;
                      app.exit(21);
                      return;
                  }
                  if (!reply.contains('5')) {
                      std::cerr << "E2E_FAILURE=unexpected_math_reply" << std::endl;
                      app.exit(22);
                      return;
                  }
                  std::cout << "TONY_FINAL_RECEIVED=PASS" << std::endl;
                  std::cout << "WINDOWS_HTTPS_PAIR_WSS_QWEN_TONY=PASS" << std::endl;
                  app.exit(0);
              });
              QObject::connect(&client, &AgentClient::pairingFailed,
                               [&](const QString &message) {
                  std::cerr << "PAIRING_FAILURE=" << message.toStdString() << std::endl;
                  app.exit(11);
              });
              QObject::connect(&client, &AgentClient::errorMessage,
                               [&](const QString &message) {
                  std::cerr << "TONY_ERROR=" << message.toStdString() << std::endl;
              });

              QTimer watchdog;
              watchdog.setSingleShot(true);
              QObject::connect(&watchdog, &QTimer::timeout, [&] {
                  std::cerr << "E2E_FAILURE=watchdog_timeout" << std::endl;
                  app.exit(12);
              });
              watchdog.start(120000);

              client.requestDevicePairing(
                  QUrl(QString::fromUtf8(qgetenv("TONY_WSS_URL"))),
                  QString::fromUtf8(qgetenv("TONY_E2E_DEVICE")));
              return app.exec();
          }
          '@ | Set-Content (Join-Path $src 'main.cpp') -Encoding utf8

          cmake -S $src -B (Join-Path $src 'build') -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build (Join-Path $src 'build') --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'E2E harness build failed' }
          Write-Host 'TONY_AGENTCLIENT_BUILD=PASS'

      - name: Prepare server approval key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SERVER_SSH_KEY)) { throw 'SERVER_SSH_KEY is empty' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'tony_server_key'
          $keyText = $env:SERVER_SSH_KEY.Replace("`r", '')
          [IO.File]::WriteAllText($keyPath, $keyText + "`n", [Text.UTF8Encoding]::new($false))
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(R)" | Out-Null
          "TONY_SSH_KEY=$keyPath" >> $env:GITHUB_ENV
          Write-Host 'SERVER_APPROVAL_KEY=READY'

      - name: Real Windows Tony pairing WSS Qwen round trip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD '.ci_tony_v098_e2e/build/Release/tony_v098_e2e.exe'
          if (-not (Test-Path $exe)) { throw "Missing E2E executable: $exe" }
          $stdout = Join-Path $env:RUNNER_TEMP 'tony-v098-e2e.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'tony-v098-e2e.stderr.log'
          Remove-Item $stdout,$stderr -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath $exe -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $approved = $false
          $deviceId = $null
          $deadline = (Get-Date).AddSeconds(130)
          try {
            while (-not $proc.HasExited -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
              if (-not $approved) {
                $m = [regex]::Match($out, '(?m)^PAIRING_CODE=([A-Z2-9]{4}-[A-Z2-9]{4})\s*$')
                if ($m.Success) {
                  $code = $m.Groups[1].Value
                  Write-Host "WINDOWS_HTTPS_PAIR_REQUEST=PASS code=$code"
                  $remote = "cd /home/ubuntu/.local/share/bear-agent/app && /home/ubuntu/.local/share/bear-agent/venv/bin/python -m app.pairing_cli approve '$code'"
                  & ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -i $env:TONY_SSH_KEY "ubuntu@$env:TONY_SERVER_IP" $remote
                  if ($LASTEXITCODE -ne 0) { throw 'Server-side pairing approval failed' }
                  $approved = $true
                  Write-Host 'SERVER_PAIR_APPROVAL=PASS'
                }
              }
            }

            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
              throw 'Tony E2E process exceeded orchestration deadline'
            }
            $proc.WaitForExit()
            $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
            $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
            Write-Host '===== Tony AgentClient stdout ====='
            Write-Host $out
            if ($err) {
              Write-Host '===== Tony AgentClient stderr ====='
              Write-Host $err
            }
            $dm = [regex]::Match($out, '(?m)^DEVICE_ID=([0-9a-f]+)\s*$')
            if ($dm.Success) { $deviceId = $dm.Groups[1].Value }
            if ($proc.ExitCode -ne 0) { throw "Tony E2E exited with code $($proc.ExitCode)" }
            if ($out -notmatch 'WINDOWS_HTTPS_PAIR_WSS_QWEN_TONY=PASS') { throw 'End-to-end PASS marker missing' }
          }
          finally {
            if (-not $deviceId -and (Test-Path $stdout)) {
              $out = Get-Content $stdout -Raw
              $dm = [regex]::Match($out, '(?m)^DEVICE_ID=([0-9a-f]+)\s*$')
              if ($dm.Success) { $deviceId = $dm.Groups[1].Value }
            }
            if ($deviceId) {
              $remote = "cd /home/ubuntu/.local/share/bear-agent/app && /home/ubuntu/.local/share/bear-agent/venv/bin/python -m app.pairing_cli revoke '$deviceId'"
              & ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -i $env:TONY_SSH_KEY "ubuntu@$env:TONY_SERVER_IP" $remote
              if ($LASTEXITCODE -eq 0) { Write-Host "TEMP_DEVICE_REVOKED=PASS device=$deviceId" }
            }
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Confirm server services after E2E
        if: always()
        shell: pwsh
        run: |
          $remote = "systemctl is-active bear-agent-gateway.service; systemctl is-active rhocodec-llm.service; curl -fsS http://127.0.0.1:18790/health"
          & ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -i $env:TONY_SSH_KEY "ubuntu@$env:TONY_SERVER_IP" $remote
