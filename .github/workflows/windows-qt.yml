name: Windows Qt C++ Desktop Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/qt/**"
      - ".github/workflows/windows-qt.yml"

permissions:
  contents: write

concurrency:
  group: zhice-qt-desktop
  cancel-in-progress: true

jobs:
  build-qt-desktop:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true
          modules: "qtpdf"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S native/qt -B build-qt -G "Visual Studio 17 2022" -A x64

      - name: Build C++ application
        shell: pwsh
        run: |
          cmake --build build-qt --config Release --parallel
          $exe = "build-qt\Release\智策.exe"
          if (-not (Test-Path $exe)) { throw "智策 executable was not produced: $exe" }
          Get-Item $exe | Select-Object Name, Length

      - name: Run engine PDF evidence persistence report Excel self-test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build-qt\Release\智策.exe").Path
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test" -WorkingDirectory (Split-Path $exe) -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Self-test failed with exit code $($test.ExitCode)" }
          Write-Host "智策 self-test passed."

      - name: Smoke-test desktop window
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build-qt\Release\智策.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 6
            if ($process.HasExited) {
              throw "智策 exited unexpectedly with code $($process.ExitCode)"
            }
            Write-Host "智策 desktop window stayed alive for the smoke-test interval."
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-qt\app" | Out-Null
          Copy-Item "build-qt\Release\智策.exe" "dist-qt\app\智策.exe" -Force
          Copy-Item "native\qt\THIRD_PARTY_NOTICES.md" "dist-qt\app\THIRD_PARTY_NOTICES.md" -Force
          windeployqt --release --no-translations --compiler-runtime "dist-qt\app\智策.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist-qt\app\sqldrivers\qsqlite.dll")) {
            throw "Qt SQLite driver was not deployed; .clrproj project persistence would fail on user machines"
          }
          if (-not (Test-Path "dist-qt\app\Qt6Pdf.dll")) {
            throw "Qt PDF runtime was not deployed; PDF paper reading would fail on user machines"
          }
          if (-not (Test-Path "dist-qt\app\THIRD_PARTY_NOTICES.md")) {
            throw "Third-party license notices were not included in the desktop package"
          }

      - name: Validate deployed application without Qt SDK on PATH
        shell: pwsh
        run: |
          $originalPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          try {
            $exe = (Resolve-Path "dist-qt\app\智策.exe").Path
            $workingDir = Split-Path $exe
            $test = Start-Process -FilePath $exe -ArgumentList "--self-test" -WorkingDirectory $workingDir -Wait -PassThru
            if ($test.ExitCode -ne 0) { throw "Deployed app self-test failed with exit code $($test.ExitCode)" }

            $process = Start-Process -FilePath $exe -WorkingDirectory $workingDir -PassThru
            try {
              Start-Sleep -Seconds 6
              if ($process.HasExited) {
                throw "Deployed 智策 app exited unexpectedly with code $($process.ExitCode)"
              }
            }
            finally {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          }
          finally {
            $env:PATH = $originalPath
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $sourceDir = (Resolve-Path "dist-qt\app").Path
          $outputDir = (Resolve-Path "release").Path
          & $iscc "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" "native\qt\installer\CatalystLongevity.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "release\Zhice-Setup.exe")) { throw "智策 installer was not produced" }

      - name: Package portable build and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path "dist-qt\app\*" -DestinationPath "release\Zhice-Portable.zip" -Force
          $files = @(
            "release\Zhice-Setup.exe",
            "release\Zhice-Portable.zip"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content "release\SHA256SUMS.txt"
          Get-ChildItem release | Select-Object Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zhice-Desktop
          path: |
            release/Zhice-Setup.exe
            release/Zhice-Portable.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish Qt prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qt-desktop-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: 智策 Windows 桌面版 ${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            智策 Windows 桌面应用，由 C++20 与 Qt 6 构建。

            推荐下载 `Zhice-Setup.exe` 正常安装；安装后的应用名称与快捷方式均显示为“智策”。

            当前功能包括 `.clrproj` 项目保存与打开、CSV / Excel 数据导入、长期性能与寿命分析、实验条件一致性检查、PDF 报告、论文资料提取与人工确认、公开参考库、实验建议，以及面向后续自驱动实验室的接口能力。
          files: |
            release/Zhice-Setup.exe
            release/Zhice-Portable.zip
            release/SHA256SUMS.txt
