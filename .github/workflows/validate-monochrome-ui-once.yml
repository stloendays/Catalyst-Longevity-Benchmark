name: Validate Monochrome Qt UI Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-monochrome-ui-once.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true
          modules: "qtpdf"

      - name: Configure
        shell: pwsh
        run: cmake -S native/qt -B build-qt -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build-qt --config Release --parallel

      - name: Native self-test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build-qt\Release\Catalyst Longevity Research.exe").Path
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test" -WorkingDirectory (Split-Path $exe) -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Native self-test failed with exit code $($test.ExitCode)" }

      - name: Window smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build-qt\Release\Catalyst Longevity Research.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 6
            if ($process.HasExited) { throw "Desktop window exited unexpectedly with code $($process.ExitCode)" }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Remove temporary validation workflow
        if: always()
        shell: pwsh
        run: |
          git config user.name "stloendays"
          git config user.email "157110190+stloendays@users.noreply.github.com"
          Remove-Item ".github/workflows/validate-monochrome-ui-once.yml" -Force
          git add ".github/workflows/validate-monochrome-ui-once.yml"
          git commit -m "Remove temporary monochrome UI validation workflow"
          git push origin main
