name: Export Soft Copyright Source Once

on:
  push:
    branches: [softcopyright-source-export]
    paths:
      - ".github/workflows/export-softcopyright-source-once.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ordered source bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              'native/qt/src/main.cpp',
              'native/qt/src/models.h',
              'native/qt/src/analysisengine.h',
              'native/qt/src/analysisengine.cpp',
              'native/qt/src/conditionguard.h',
              'native/qt/src/conditionguard.cpp',
              'native/qt/src/csvreader.h',
              'native/qt/src/csvreader.cpp',
              'native/qt/src/builtindatasets.h',
              'native/qt/src/builtindatasets.cpp',
              'native/qt/src/referenceknowledge.h',
              'native/qt/src/referenceknowledge.cpp',
              'native/qt/src/documentanalyzer.h',
              'native/qt/src/documentanalyzer.cpp',
              'native/qt/src/evidencepacket.h',
              'native/qt/src/evidencepacket.cpp',
              'native/qt/src/evidencepage.h',
              'native/qt/src/evidencepage.cpp',
              'native/qt/src/projectstore.h',
              'native/qt/src/projectstore.cpp',
              'native/qt/src/reportexporter.h',
              'native/qt/src/reportexporter.cpp',
              'native/qt/src/researchadvisor.h',
              'native/qt/src/researchadvisor.cpp',
              'native/qt/src/integrationgateway.h',
              'native/qt/src/integrationgateway.cpp',
              'native/qt/src/chartwidget.h',
              'native/qt/src/chartwidget.cpp',
              'native/qt/src/mainwindow.h',
              'native/qt/src/mainwindow.cpp',
          ]
          out = Path('softcopyright-source')
          out.mkdir(exist_ok=True)
          bundle = out / 'source_bundle.txt'
          with bundle.open('w', encoding='utf-8', newline='\n') as dst:
              for path in files:
                  p = Path(path)
                  if not p.exists():
                      raise SystemExit(f'missing source file: {path}')
                  dst.write(f'// ===== FILE: {path} =====\n')
                  text = p.read_text(encoding='utf-8')
                  dst.write(text)
                  if not text.endswith('\n'):
                      dst.write('\n')
          print('bundle bytes', bundle.stat().st_size)
          print('files', len(files))
          PY

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: Zhice-SoftCopyright-Source
          path: softcopyright-source/source_bundle.txt
          if-no-files-found: error
