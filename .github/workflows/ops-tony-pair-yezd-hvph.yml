name: Approve Tony 1.0 desktop pairing YEZD-HVPH

on:
  push:
    branches:
      - ops/tony-pair-yezd-hvph
    paths:
      - '.github/workflows/ops-tony-pair-yezd-hvph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approve-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SERVER_IP: 150.158.27.206
      PAIR_CODE: YEZD-HVPH
    steps:
      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          printf '%s\n' "$SERVER_SSH_KEY" > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"

      - name: Approve Tony 1.0 pairing code
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
            -i "$RUNNER_TEMP/key" "ubuntu@$SERVER_IP" \
            "cd /home/ubuntu/.local/share/bear-agent/app && /home/ubuntu/.local/share/bear-agent/venv/bin/python -m app.pairing_cli approve '$PAIR_CODE'"
          echo 'TONY_PAIR_APPROVAL_COMMAND=PASS'

      - name: Verify paired device and live WSS
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
            -i "$RUNNER_TEMP/key" "ubuntu@$SERVER_IP" 'bash -s' <<'REMOTE'
          set -euo pipefail
          STORE=/home/ubuntu/.local/share/bear-agent/pairing.json

          echo '=== pairing store ==='
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/home/ubuntu/.local/share/bear-agent/pairing.json')
          if not p.exists():
              raise SystemExit('pairing store missing')
          d=json.loads(p.read_text())
          devices=d.get('devices') or []
          if isinstance(devices, dict):
              devices=list(devices.values())
          active=[x for x in devices if isinstance(x,dict) and not x.get('revoked')]
          print('ACTIVE_DEVICES=', len(active))
          for x in active[-5:]:
              print({k:x.get(k) for k in ('device_id','device_name','revoked','created_at','last_seen_at')})
          if not active:
              raise SystemExit('no active paired device after approval')
          print('TONY_DEVICE_TOKEN_ISSUED=PASS')
          PY

          echo '=== waiting for websocket ==='
          ok=0
          for i in $(seq 1 20); do
            if ss -ntp 2>/dev/null | grep -E '127\.0\.0\.1:18790|\[::1\]:18790' | grep -q ESTAB; then
              echo 'TONY_WSS_LIVE=PASS'
              ss -ntp 2>/dev/null | grep -E '127\.0\.0\.1:18790|\[::1\]:18790' | grep ESTAB || true
              ok=1
              break
            fi
            sleep 2
          done

          echo '=== recent gateway log ==='
          sudo journalctl -u bear-agent-gateway.service --since '5 minutes ago' --no-pager | tail -n 120 || true

          if [ "$ok" -ne 1 ]; then
            echo 'TONY_WSS_LIVE=NOT_OBSERVED'
            exit 2
          fi

          systemctl is-active --quiet bear-agent-gateway.service
          systemctl is-active --quiet rhocodec-llm.service
          echo 'TONY_GATEWAY_AND_QWEN=PASS'
          echo 'TONY_1_0_DESKTOP_CONNECTED=PASS'
          REMOTE
