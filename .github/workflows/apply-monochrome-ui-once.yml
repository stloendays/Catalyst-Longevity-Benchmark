name: Apply Monochrome Interactive Qt UI Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-monochrome-ui-once.yml"

permissions:
  contents: write

jobs:
  apply-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Redesign dashboard evidence AI and chart interactions
