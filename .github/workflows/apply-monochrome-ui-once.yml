#include "models.h"

#include <QEvent>
#include <QMouseEvent>
#include <QPointF>
#include <QWidget>
#include <optional>

namespace catalyst {

class ChartWidget final : public QWidget {
    Q_OBJECT

public:
    explicit ChartWidget(QWidget* parent = nullptr);
    void setRecords(const QVector<Record>& records);

protected:
    void paintEvent(QPaintEvent* event) override;
    void mouseMoveEvent(QMouseEvent* event) override;
    void leaveEvent(QEvent* event) override;

private:
    struct HoverPoint {
        QString catalyst;
        double timeHours = 0.0;
        double performance = 0.0;
        QPointF screen;
    };
    QVector<Record> records_;
    QVector<HoverPoint> renderedPoints_;
    std::optional<HoverPoint> hovered_;
};

} // namespace catalyst
''', encoding="utf-8")

          Path("native/qt/src/chartwidget.cpp").write_text(r'''#include "chartwidget.h"

#include <QFontMetrics>
#include <QMap>
#include <QPainter>
#include <QPainterPath>
#include <QPen>
#include <algorithm>
#include <cmath>

namespace catalyst {

ChartWidget::ChartWidget(QWidget* parent)
    : QWidget(parent) {
    setMinimumHeight(330);
    setSizePolicy(QSizePolicy::Expanding, QSizePolicy::Expanding);
    setMouseTracking(true);
}

void ChartWidget::setRecords(const QVector<Record>& records) {
    records_ = records;
    hovered_.reset();
    update();
}

void ChartWidget::mouseMoveEvent(QMouseEvent* event) {
    constexpr double kHoverRadius = 15.0;
    double bestDistance = kHoverRadius;
    std::optional<HoverPoint> best;
    for (const auto& point : renderedPoints_) {
        const double dx = point.screen.x() - event->position().x();
        const double dy = point.screen.y() - event->position().y();
        const double distance = std::sqrt(dx * dx + dy * dy);
        if (distance < bestDistance) {
            bestDistance = distance;
            best = point;
        }
    }
    const bool changed = best.has_value() != hovered_.has_value()
        || (best && hovered_ && (best->catalyst != hovered_->catalyst
            || !qFuzzyCompare(best->timeHours + 1.0, hovered_->timeHours + 1.0)
            || !qFuzzyCompare(best->performance + 1.0, hovered_->performance + 1.0)));
    if (changed) {
        hovered_ = best;
        update();
    }
    QWidget::mouseMoveEvent(event);
}

void ChartWidget::leaveEvent(QEvent* event) {
    hovered_.reset();
    update();
    QWidget::leaveEvent(event);
}

void ChartWidget::paintEvent(QPaintEvent*) {
    QPainter painter(this);
    painter.setRenderHint(QPainter::Antialiasing, true);
    painter.fillRect(rect(), QColor(QStringLiteral("#FFFFFF")));
    renderedPoints_.clear();

    if (records_.isEmpty()) {
        painter.setPen(QColor(QStringLiteral("#71717A")));
        painter.drawText(rect(), Qt::AlignCenter, QStringLiteral("导入数据后显示长期性能曲线"));
        return;
    }

    QMap<QString, QVector<Record>> grouped;
    double minTime = records_.front().timeHours;
    double maxTime = minTime;
    double minPerformance = records_.front().performance;
    double maxPerformance = minPerformance;
    for (const auto& record : records_) {
        grouped[record.catalyst].append(record);
        minTime = qMin(minTime, record.timeHours);
        maxTime = qMax(maxTime, record.timeHours);
        minPerformance = qMin(minPerformance, record.performance);
        maxPerformance = qMax(maxPerformance, record.performance);
    }
    for (auto it = grouped.begin(); it != grouped.end(); ++it) {
        std::sort(it.value().begin(), it.value().end(), [](const Record& a, const Record& b) { return a.timeHours < b.timeHours; });
    }
    if (qFuzzyCompare(minTime, maxTime)) maxTime = minTime + 1.0;
    if (qFuzzyCompare(minPerformance, maxPerformance)) maxPerformance = minPerformance + 1.0;
    const double performancePad = qMax(1.0, (maxPerformance - minPerformance) * 0.12);
    minPerformance -= performancePad;
    maxPerformance += performancePad;

    const QRectF plotRect = rect().adjusted(70, 42, -30, -62);
    const auto mapX = [&](double time) { return plotRect.left() + ((time - minTime) / (maxTime - minTime)) * plotRect.width(); };
    const auto mapY = [&](double performance) { return plotRect.bottom() - ((performance - minPerformance) / (maxPerformance - minPerformance)) * plotRect.height(); };

    painter.setPen(QPen(QColor(QStringLiteral("#ECECEE")), 1));
    for (int i = 0; i <= 5; ++i) {
        const double ratio = static_cast<double>(i) / 5.0;
        const double y = plotRect.top() + ratio * plotRect.height();
        painter.drawLine(QPointF(plotRect.left(), y), QPointF(plotRect.right(), y));
        const double value = maxPerformance - ratio * (maxPerformance - minPerformance);
        painter.setPen(QColor(QStringLiteral("#71717A")));
        painter.drawText(QRectF(2, y - 9, 58, 18), Qt::AlignRight | Qt::AlignVCenter, QString::number(value, 'f', 1));
        painter.setPen(QPen(QColor(QStringLiteral("#ECECEE")), 1));
    }

    painter.setPen(QColor(QStringLiteral("#71717A")));
    for (int i = 0; i <= 5; ++i) {
        const double ratio = static_cast<double>(i) / 5.0;
        const double x = plotRect.left() + ratio * plotRect.width();
        const double value = minTime + ratio * (maxTime - minTime);
        painter.drawText(QRectF(x - 35, plotRect.bottom() + 9, 70, 20), Qt::AlignCenter, QString::number(value, 'g', 5));
    }
    painter.drawText(QRectF(plotRect.left(), plotRect.bottom() + 34, plotRect.width(), 20), Qt::AlignCenter, QStringLiteral("时间 / Time on stream (h)"));

    const QList<QColor> tones = { QColor(QStringLiteral("#111111")), QColor(QStringLiteral("#3F3F46")), QColor(QStringLiteral("#71717A")), QColor(QStringLiteral("#A1A1AA")), QColor(QStringLiteral("#52525B")), QColor(QStringLiteral("#27272A")), QColor(QStringLiteral("#8B8B92")), QColor(QStringLiteral("#18181B")) };
    const QList<Qt::PenStyle> styles = { Qt::SolidLine, Qt::DashLine, Qt::DotLine, Qt::DashDotLine, Qt::SolidLine, Qt::DashLine, Qt::DotLine, Qt::DashDotLine };

    int seriesIndex = 0;
    double legendX = plotRect.left();
    const double legendY = 12.0;
    for (auto it = grouped.constBegin(); it != grouped.constEnd(); ++it, ++seriesIndex) {
        const QColor tone = tones[seriesIndex % tones.size()];
        const auto penStyle = styles[seriesIndex % styles.size()];
        const auto& rows = it.value();
        QPainterPath path;
        for (qsizetype i = 0; i < rows.size(); ++i) {
            const QPointF point(mapX(rows[i].timeHours), mapY(rows[i].performance));
            renderedPoints_.append({it.key(), rows[i].timeHours, rows[i].performance, point});
            if (i == 0) path.moveTo(point); else path.lineTo(point);
        }
        painter.setPen(QPen(tone, 2.2, penStyle, Qt::RoundCap, Qt::RoundJoin));
        painter.setBrush(Qt::NoBrush);
        painter.drawPath(path);
        for (const auto& row : rows) {
            const QPointF point(mapX(row.timeHours), mapY(row.performance));
            painter.setPen(QPen(tone, 1.8));
            painter.setBrush(QColor(QStringLiteral("#FFFFFF")));
            painter.drawEllipse(point, 4.2, 4.2);
        }
        painter.setPen(QPen(tone, 2.2, penStyle));
        painter.drawLine(QPointF(legendX, legendY + 8), QPointF(legendX + 18, legendY + 8));
        painter.setPen(QColor(QStringLiteral("#52525B")));
        const QFontMetrics metrics(painter.font());
        const int textWidth = metrics.horizontalAdvance(it.key());
        painter.drawText(QRectF(legendX + 24, legendY, textWidth + 8, 17), Qt::AlignVCenter, it.key());
        legendX += textWidth + 52;
    }

    if (hovered_) {
        const QPointF p = hovered_->screen;
        painter.setPen(QPen(QColor(QStringLiteral("#C7C7CC")), 1, Qt::DashLine));
        painter.drawLine(QPointF(p.x(), plotRect.top()), QPointF(p.x(), plotRect.bottom()));
        painter.drawLine(QPointF(plotRect.left(), p.y()), QPointF(plotRect.right(), p.y()));
        painter.setPen(QPen(QColor(QStringLiteral("#111111")), 2.2));
        painter.setBrush(QColor(QStringLiteral("#FFFFFF")));
        painter.drawEllipse(p, 6.2, 6.2);

        const QString title = hovered_->catalyst;
        const QString detail = QStringLiteral("%1 h   ·   %2").arg(QString::number(hovered_->timeHours, 'g', 6), QString::number(hovered_->performance, 'g', 7));
        const QFontMetrics fm(painter.font());
        const int width = qMax(fm.horizontalAdvance(title), fm.horizontalAdvance(detail)) + 28;
        const int height = 58;
        double x = p.x() + 14;
        double y = p.y() - height - 12;
        if (x + width > rect().right() - 8) x = p.x() - width - 14;
        if (y < 8) y = p.y() + 14;
        const QRectF tooltip(x, y, width, height);
        painter.setPen(QPen(QColor(QStringLiteral("#D4D4D8")), 1));
        painter.setBrush(QColor(QStringLiteral("#FFFFFF")));
        painter.drawRoundedRect(tooltip, 9, 9);
        painter.setPen(QColor(QStringLiteral("#111111")));
        QFont titleFont = painter.font();
        titleFont.setBold(true);
        painter.setFont(titleFont);
        painter.drawText(tooltip.adjusted(12, 8, -12, -30), Qt::AlignLeft | Qt::AlignVCenter, title);
        QFont detailFont = painter.font();
        detailFont.setBold(false);
        painter.setFont(detailFont);
        painter.setPen(QColor(QStringLiteral("#71717A")));
        painter.drawText(tooltip.adjusted(12, 29, -12, -7), Qt::AlignLeft | Qt::AlignVCenter, detail);
    }
}

} // namespace catalyst
