name: Apply Monochrome Interactive Qt UI Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-monochrome-ui-once.yml"

permissions:
  contents: write

jobs:
  apply-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply UI migration
        shell: bash
        run: python .github/scripts/apply_monochrome_ui.py

      - name: Commit UI redesign and remove temporary files
        shell: bash
        run: |
          git config user.name "stloendays"
          git config user.email "157110190+stloendays@users.noreply.github.com"
          rm -f .github/workflows/apply-monochrome-ui-once.yml
          rm -f .github/scripts/apply_monochrome_ui.py
          git add native/qt/src/mainwindow.cpp native/qt/src/evidencepage.cpp native/qt/src/chartwidget.h native/qt/src/chartwidget.cpp native/qt/src/main.cpp .github/workflows/apply-monochrome-ui-once.yml .github/scripts/apply_monochrome_ui.py
          git commit -m "Redesign native Qt UI in monochrome with hover interactions"
          git push origin main
