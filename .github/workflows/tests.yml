name: Software Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ui.txt pytest

      - name: Compile Python modules and Streamlit pages
        run: python -m compileall -q app.py pages src tests

      - name: Run core, user-experience and UI smoke tests
        run: python -m pytest -q
