name: Apply Zhice Screenshot Capture Once

on:
  push:
    branches: [zhice-copyright-screenshots]
    paths:
      - ".github/workflows/apply-zhice-screenshot-capture-once.yml"

permissions:
  contents: write

jobs:
  apply-capture-validate:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: zhice-copyright-screenshots

      - name: Finalize semantic styling and capture scenario
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path("native/qt/src/mainwindow.cpp")
          text = p.read_text(encoding="utf-8")
          replacements = {
              '                level->setBackground(QColor(QStringLiteral("#FEF2F2")));\n': '',
              '                level->setBackground(QColor(QStringLiteral("#FFFBEB")));\n': '',
              '                level->setBackground(QColor(QStringLiteral("#F4F4F5")));\n': '',
              '                status->setBackground(QColor(QStringLiteral("#FEF2F2")));\n': '',
              '                status->setBackground(QColor(QStringLiteral("#FFFBEB")));\n': '',
              '                status->setBackground(QColor(QStringLiteral("#F0FDF4")));\n': '',
              '                priority->setBackground(QColor(QStringLiteral("#FEF2F2")));\n': '',
              '                priority->setBackground(QColor(QStringLiteral("#FFFBEB")));\n': '',
              '                priority->setBackground(QColor(QStringLiteral("#F4F4F5")));\n': '',
              '                feasibility->setBackground(QColor(QStringLiteral("#F0FDF4")));\n': '',
              '                feasibility->setBackground(QColor(QStringLiteral("#FFFBEB")));\n': '',
              '                feasibility->setBackground(QColor(QStringLiteral("#FEF2F2")));\n': '',
              '    loadDataset(2);\n    if (maxAdditionalHoursSpin_) maxAdditionalHoursSpin_->setValue(120.0);\n    if (minSamplingIntervalSpin_) minSamplingIntervalSpin_->setValue(24.0);\n': '    loadDataset(1);\n    if (maxAdditionalHoursSpin_) maxAdditionalHoursSpin_->setValue(48.0);\n    if (minSamplingIntervalSpin_) minSamplingIntervalSpin_->setValue(6.0);\n',
              '    QString title = QStringLiteral("催化剂长期稳定性评估与实验决策系统");\n': '    QString title = QStringLiteral("智策");\n',
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing source marker: {old[:80]!r}")
              text = text.replace(old,new,1)
          p.write_text(text, encoding="utf-8")
          '@ | python -

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true
          modules: "qtpdf"

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S native/qt -B build-qt -G "Visual Studio 17 2022" -A x64
          cmake --build build-qt --config Release --parallel
          if (-not (Test-Path "build-qt\Release\智策.exe")) { throw "智策.exe was not produced" }

      - name: Run native self-test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build-qt\Release\智策.exe").Path
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test" -WorkingDirectory (Split-Path $exe) -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Native self-test failed with exit code $($test.ExitCode)" }

      - name: Capture real Qt screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "ui-screenshots" | Out-Null
          $output = (Resolve-Path "ui-screenshots").Path
          $exe = (Resolve-Path "build-qt\Release\智策.exe").Path
          $capture = Start-Process -FilePath $exe -ArgumentList @("--capture-screenshots", $output) -WorkingDirectory (Split-Path $exe) -Wait -PassThru
          if ($capture.ExitCode -ne 0) { throw "Screenshot capture failed with exit code $($capture.ExitCode)" }
          $shots = Get-ChildItem "ui-screenshots" -Filter "*.png"
          if ($shots.Count -lt 11) { throw "Expected at least 11 screenshots, got $($shots.Count)" }
          $shots | Select-Object Name, Length

      - name: Upload real screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Zhice-Real-UI-Screenshots
          path: ui-screenshots/*.png
          if-no-files-found: error

      - name: Commit validated UI cleanup
        shell: pwsh
        run: |
          if (Test-Path "build-qt") { Remove-Item -Recurse -Force "build-qt" }
          if (Test-Path "ui-screenshots") { Remove-Item -Recurse -Force "ui-screenshots" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/qt/src/mainwindow.cpp
          git commit -m "Remove residual status fills and improve Zhice capture scenarios"
          git push origin zhice-copyright-screenshots
