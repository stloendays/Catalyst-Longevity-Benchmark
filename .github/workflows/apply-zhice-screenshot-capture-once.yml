name: Apply Zhice Screenshot Capture Once

on:
  push:
    branches: [zhice-copyright-screenshots]
    paths:
      - ".github/workflows/apply-zhice-screenshot-capture-once.yml"

permissions:
  contents: write

jobs:
  apply-capture-validate:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: zhice-copyright-screenshots

      - name: Finalize materials page spacing and Chinese preview
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing marker: {label}")
              return text.replace(old, new, 1)

          p = Path("native/qt/src/evidencepage.cpp")
          text = p.read_text(encoding="utf-8")
          text = replace_once(text,
              '    layout->setContentsMargins(34, 28, 34, 28);\n    layout->setSpacing(14);\n',
              '    layout->setContentsMargins(34, 20, 34, 16);\n    layout->setSpacing(10);\n',
              'page spacing')
          text = replace_once(text,
              '    sourceFrame->setMaximumHeight(96);\n',
              '    sourceFrame->setMaximumHeight(82);\n',
              'source height')
          text = replace_once(text,
              '    signalsTable_->setMaximumHeight(82);\n    signalFrame->setMaximumHeight(135);\n',
              '    signalsTable_->setMaximumHeight(50);\n    signalFrame->setMaximumHeight(102);\n',
              'signals compact')
          text = replace_once(text,
              '    evidenceTable_->setMinimumHeight(105);\n    evidenceTable_->setMaximumHeight(135);\n',
              '    evidenceTable_->setMinimumHeight(78);\n    evidenceTable_->setMaximumHeight(90);\n',
              'evidence compact table')
          text = replace_once(text,
              '    evidenceFrame->setMaximumHeight(260);\n',
              '    evidenceFrame->setMinimumHeight(225);\n    evidenceFrame->setMaximumHeight(238);\n',
              'evidence frame stable height')
          text = replace_once(text,
              '    packetPreview_->setMinimumHeight(50);\n    packetPreview_->setMaximumHeight(68);\n    packetFrame->setMaximumHeight(155);\n',
              '    packetPreview_->setMinimumHeight(36);\n    packetPreview_->setMaximumHeight(48);\n    packetFrame->setMaximumHeight(135);\n',
              'packet compact')
          text = replace_once(text,
              '    documentInfoLabel_->setText(QStringLiteral("—"));\n',
              '    documentInfoLabel_->clear();\n',
              'empty document info')
          text = replace_once(text,
              '        sourceLabel_->setText(QStringLiteral("已从项目恢复 %1 条证据候选").arg(evidenceItems_.size()));\n',
              '        sourceLabel_->setText(QStringLiteral("已从项目恢复 %1 条资料").arg(evidenceItems_.size()));\n',
              'restored materials copy')
          text = replace_once(text,
              '    evidenceTable_->resizeRowsToContents();\n    refreshEvidencePacket();\n',
              '    evidenceTable_->verticalHeader()->setDefaultSectionSize(32);\n    refreshEvidencePacket();\n',
              'evidence row sizing')
          p.write_text(text, encoding="utf-8")

          p = Path("native/qt/src/evidencepacket.cpp")
          text = p.read_text(encoding="utf-8")
          text = text.replace('"当前没有完成‘催化剂 + 时间 + 条件复核备注’的证据，因此 Evidence Packet 暂不进入 AI 上下文。"',
                              '"当前没有完成‘催化剂 + 时间 + 确认备注’的资料，因此暂不提供给 AI。"')
          text = text.replace('"%1 条证据仍处于候选/待复核状态，已从 AI 上下文中排除。"',
                              '"%1 条资料仍待关联或确认，当前不会提供给 AI。"')
          text = text.replace('"%1 条证据虽然带有复核状态，但绑定信息不完整，已按安全策略降级为待复核。"',
                              '"%1 条资料虽然标记为已确认，但关联信息不完整，已自动退回待确认状态。"')
          text = text.replace('QStringLiteral("部分证据缺少可追溯来源标识。")',
                              'QStringLiteral("部分资料缺少可追溯来源标识。")')
          start = text.index('QString EvidencePacketBuilder::toMarkdown')
          end = text.index('\n}\n\n} // namespace catalyst', start) + 2
          new_func = r'''QString EvidencePacketBuilder::toMarkdown(const EvidencePacket& packet) {
    QString text;
    text += QStringLiteral("# AI 可用资料\n\n");
    text += QStringLiteral("- 生成时间：%1\n").arg(packet.generatedUtc);
    text += QStringLiteral("- AI 可用：%1\n").arg(packet.readyForAi ? QStringLiteral("是") : QStringLiteral("否"));
    text += QStringLiteral("- 已确认资料：%1 条\n").arg(packet.reviewedContextItems);
    text += QStringLiteral("- 待确认资料：%1 条\n").arg(packet.pendingItems);
    text += QStringLiteral("- 来源数量：%1\n").arg(packet.sourceCount);
    text += QStringLiteral("- 关联催化剂：%1 个\n\n").arg(packet.catalystCount);

    if (!packet.warnings.isEmpty()) {
        text += QStringLiteral("## 使用提示\n\n");
        for (const auto& warning : packet.warnings) {
            text += QStringLiteral("- %1\n").arg(warning);
        }
        text += QLatin1Char('\n');
    }

    text += QStringLiteral("## 已确认资料\n\n");
    if (packet.contextItems.isEmpty()) {
        text += QStringLiteral("当前没有可供 AI 使用的已确认资料。\n");
        return text;
    }

    int index = 1;
    for (const auto& item : packet.contextItems) {
        const QString source = item.sourcePath.isEmpty()
            ? QStringLiteral("未知来源")
            : QFileInfo(item.sourcePath).fileName();
        const QString page = item.sourcePage > 0
            ? QStringLiteral("第 %1 页").arg(item.sourcePage)
            : QStringLiteral("页码未知");
        const QString candidate = item.valueText.isEmpty() ? item.term : item.valueText;
        const QString hash = item.sourceSha256.isEmpty()
            ? QStringLiteral("未知")
            : item.sourceSha256.left(16);

        text += QStringLiteral("### 资料 %1\n\n").arg(index++);
        text += QStringLiteral("- 来源：%1\n").arg(source);
        text += QStringLiteral("- 来源校验：%1\n").arg(hash);
        text += QStringLiteral("- 页码：%1\n").arg(page);
        text += QStringLiteral("- 催化剂：%1\n").arg(item.boundCatalyst);
        text += QStringLiteral("- 时间：%1 h\n").arg(QString::number(*item.boundTimeHours, 'g', 10));
        text += QStringLiteral("- 类型：%1\n").arg(categoryLabel(item.category));
        text += QStringLiteral("- 识别内容：%1\n").arg(candidate);
        text += QStringLiteral("- 确认备注：%1\n").arg(compact(item.note));
        if (!item.snippet.trimmed().isEmpty()) {
            text += QStringLiteral("- 原文上下文：%1\n").arg(compact(item.snippet));
        }
        text += QLatin1Char('\n');
    }

    text += QStringLiteral("以上资料仅作为分析上下文，不会改写实验观测、寿命阈值或催化剂直接排名。\n");
    return text;
}'''
          text = text[:start] + new_func + text[end:]
          p.write_text(text, encoding="utf-8")
          '@ | python -

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true
          modules: "qtpdf"

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S native/qt -B build-qt -G "Visual Studio 17 2022" -A x64
          cmake --build build-qt --config Release --parallel
          if (-not (Test-Path "build-qt\Release\智策.exe")) { throw "智策.exe was not produced" }

      - name: Run native self-test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build-qt\Release\智策.exe").Path
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test" -WorkingDirectory (Split-Path $exe) -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Native self-test failed with exit code $($test.ExitCode)" }

      - name: Capture real Qt screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "ui-screenshots" | Out-Null
          $output = (Resolve-Path "ui-screenshots").Path
          $exe = (Resolve-Path "build-qt\Release\智策.exe").Path
          $capture = Start-Process -FilePath $exe -ArgumentList @("--capture-screenshots", $output) -WorkingDirectory (Split-Path $exe) -Wait -PassThru
          if ($capture.ExitCode -ne 0) { throw "Screenshot capture failed with exit code $($capture.ExitCode)" }
          $shots = Get-ChildItem "ui-screenshots" -Filter "*.png"
          if ($shots.Count -lt 11) { throw "Expected at least 11 screenshots, got $($shots.Count)" }

      - name: Upload real screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Zhice-Real-UI-Screenshots
          path: ui-screenshots/*.png
          if-no-files-found: error

      - name: Commit validated final materials polish
        shell: pwsh
        run: |
          if (Test-Path "build-qt") { Remove-Item -Recurse -Force "build-qt" }
          if (Test-Path "ui-screenshots") { Remove-Item -Recurse -Force "ui-screenshots" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/qt/src/evidencepage.cpp native/qt/src/evidencepacket.cpp
          git commit -m "Finalize Zhice materials workspace and Chinese AI preview"
          git push origin zhice-copyright-screenshots
