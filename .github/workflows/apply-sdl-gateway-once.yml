name: Apply SDL Gateway Once

on:
  push:
    branches: [sdl-integration-gateway]
    paths:
      - ".github/workflows/apply-sdl-gateway-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sdl-integration-gateway
          fetch-depth: 0
      - name: Patch native main
        run: python tools/apply_sdl_gateway_main.py
      - name: Commit SDL main integration
        shell: bash
        run: |
          git config user.name "stloendays"
          git config user.email "157110190+stloendays@users.noreply.github.com"
          git add native/qt/src/main.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Wire SDL gateway into native desktop startup"
            git push origin HEAD:sdl-integration-gateway
          fi
