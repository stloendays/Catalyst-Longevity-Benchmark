name: Apply SDL Gateway Once

on:
  push:
    branches: [sdl-integration-gateway]
    paths:
      - ".github/workflows/apply-sdl-gateway-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sdl-integration-gateway
          fetch-depth: 0
      - name: Apply Qt character compatibility fix
        run: python tools/fix_sdl_qchar.py
      - name: Commit SDL gateway fix
        shell: bash
        run: |
          git config user.name "stloendays"
          git config user.email "157110190+stloendays@users.noreply.github.com"
          git add native/qt/src/integrationgateway.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Fix SDL gateway Qt character handling"
            git push origin HEAD:sdl-integration-gateway
          fi
