name: Validate SDL Gateway Once

on:
  push:
    branches: [sdl-integration-gateway]
    paths:
      - ".github/workflows/validate-sdl-gateway-once.yml"

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sdl-integration-gateway

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true
          modules: "qtpdf"

      - name: Configure CMake
        shell: pwsh
        run: cmake -S native/qt -B build-qt -G "Visual Studio 17 2022" -A x64

      - name: Build native desktop app
        shell: pwsh
        run: cmake --build build-qt --config Release --parallel

      - name: Run native self-test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build-qt\Release\Catalyst Longevity Research.exe").Path
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test" -WorkingDirectory (Split-Path $exe) -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Native self-test failed with exit code $($test.ExitCode)" }

      - name: Smoke-test SDL control event and instrument ports
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build-qt\Release\Catalyst Longevity Research.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:49321/v1/health" -Method Get -TimeoutSec 2
                break
              } catch {}
            }
            if (-not $health -or -not $health.ok) { throw "SDL health endpoint did not become ready" }

            $cap = Invoke-RestMethod -Uri "http://127.0.0.1:49321/v1/capabilities" -Method Get -TimeoutSec 3
            if ($cap.ports.control_http -ne 49321) { throw "Unexpected SDL control port" }
            if ($cap.ports.events_jsonl -ne 49322) { throw "Unexpected SDL event port" }
            if ($cap.ports.instrument_jsonl -ne 49323) { throw "Unexpected SDL instrument port" }
            if ($cap.safety.hardware_actuation -ne $false) { throw "Hardware actuation must remain disabled" }

            $pair = Invoke-RestMethod -Uri "http://127.0.0.1:49321/v1/pairing" -Method Get -TimeoutSec 3
            if ([string]::IsNullOrWhiteSpace($pair.token)) { throw "Loopback pairing token missing" }
            $headers = @{ Authorization = "Bearer $($pair.token)" }
            $state = Invoke-RestMethod -Uri "http://127.0.0.1:49321/v1/state" -Headers $headers -Method Get -TimeoutSec 3
            if ($state.control_port -ne 49321) { throw "Authenticated SDL state endpoint failed" }

            $eventClient = [System.Net.Sockets.TcpClient]::new("127.0.0.1", 49322)
            try {
              $eventStream = $eventClient.GetStream()
              $eventStream.ReadTimeout = 3000
              $eventReader = [System.IO.StreamReader]::new($eventStream)
              $eventWriter = [System.IO.StreamWriter]::new($eventStream)
              $eventWriter.AutoFlush = $true
              $eventHello = $eventReader.ReadLine() | ConvertFrom-Json
              if ($eventHello.channel -ne "events") { throw "Event port hello failed" }
              $eventWriter.WriteLine((@{ token = $pair.token; client = "ci-event" } | ConvertTo-Json -Compress))
              $eventAuth = $eventReader.ReadLine() | ConvertFrom-Json
              if (-not $eventAuth.ok) { throw "Event port authentication failed" }
              $eventWriter.WriteLine('{"type":"ping"}')
              $pong = $eventReader.ReadLine() | ConvertFrom-Json
              if ($pong.type -ne "pong") { throw "Event port ping/pong failed" }
            }
            finally {
              $eventClient.Dispose()
            }

            $instrumentClient = [System.Net.Sockets.TcpClient]::new("127.0.0.1", 49323)
            try {
              $instrumentStream = $instrumentClient.GetStream()
              $instrumentStream.ReadTimeout = 3000
              $instrumentReader = [System.IO.StreamReader]::new($instrumentStream)
              $instrumentWriter = [System.IO.StreamWriter]::new($instrumentStream)
              $instrumentWriter.AutoFlush = $true
              $instrumentHello = $instrumentReader.ReadLine() | ConvertFrom-Json
              if ($instrumentHello.channel -ne "instrument") { throw "Instrument port hello failed" }
              $instrumentWriter.WriteLine((@{ token = $pair.token; client = "ci-instrument" } | ConvertTo-Json -Compress))
              $instrumentAuth = $instrumentReader.ReadLine() | ConvertFrom-Json
              if (-not $instrumentAuth.ok) { throw "Instrument port authentication failed" }
              $instrumentWriter.WriteLine('{"source":"ci-gc","type":"measurement","run_id":"ci-run-1","data":{"ch4_conversion_percent":81.7}}')
              $instrumentAck = $instrumentReader.ReadLine() | ConvertFrom-Json
              if (-not $instrumentAck.ok -or $instrumentAck.hardware_command_executed -ne $false) {
                throw "Instrument telemetry acknowledgement failed"
              }
            }
            finally {
              $instrumentClient.Dispose()
            }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Verify interface contract files
        shell: pwsh
        run: |
          if (-not (Test-Path "integration/sdl_gateway.openapi.yaml")) { throw "OpenAPI contract missing" }
          if (-not (Test-Path "docs/SELF_DRIVING_LAB_GATEWAY_CN.md")) { throw "SDL gateway documentation missing" }

# Re-run after the Qt no-ASCII compatibility fix; validates all three network surfaces.