name: Server Stage3C status

on:
  push:
    paths:
      - .github/workflows/server-step3a-status.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"
      - name: Inspect Stage 3C training state
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -u
          ROOT=/home/ubuntu/local2b-training/step3c
          ADAPTER="$ROOT/local2b-mcp-step3c-r4a4-qv.gguf"
          date -Is
          echo '=== TRAINERS ==='
          ps -eo pid,ppid,lstart,etime,%cpu,%mem,args | grep -E 'llama-finetune-lora|timeout 14400' | grep -v grep || true
          echo '=== STAGE3C FILES ==='
          ls -lah "$ROOT" 2>/dev/null || echo 'STAGE3C_ROOT_MISSING'
          echo '=== STAGE3C MANIFEST ==='
          cat "$ROOT/manifest.json" 2>/dev/null || true
          echo '=== STAGE3C LOG TAIL ==='
          tail -100 "$ROOT/train.log" 2>/dev/null || true
          echo '=== STAGE3C CHECKPOINTS ==='
          find "$ROOT/checkpoints" -maxdepth 2 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TS %p %s bytes\n' 2>/dev/null | sort | tail -20 || true
          echo '=== STAGE3C ADAPTER ==='
          if [ -s "$ADAPTER" ]; then
            ls -lh "$ADAPTER"
            sha256sum "$ADAPTER"
          else
            echo 'STAGE3C_ADAPTER_NOT_FINAL_YET'
          fi
          echo '=== MEMORY ==='
          free -h
          echo '=== SERVICE ==='
          systemctl is-active rhocodec-llm.service || true
          curl -fsS http://127.0.0.1:18080/v1/models || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
