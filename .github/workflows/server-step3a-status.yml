name: Server Step3A status

on:
  push:
    paths:
      - .github/workflows/server-step3a-status.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"
      - name: Inspect server training state
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          ROOT=/home/ubuntu/local2b-training/step3a-recover
          STAGE3B=/home/ubuntu/local2b-training/step3b
          ADAPTER="$ROOT/local2b-mcp-step3a-r4-qv.gguf"
          INSTALLED=/opt/rhocodec-llm/adapters/local2b-mcp-step3a-r4-qv.gguf
          date -Is
          echo '=== TRAINERS ==='
          ps -eo pid,ppid,lstart,etime,%cpu,%mem,args | grep -E 'llama-finetune-lora|timeout 14400' | grep -v grep || true
          echo '=== STAGE3A INSTALLED ==='
          if [ -s "$INSTALLED" ]; then
            ls -lh "$INSTALLED"
            sha256sum "$INSTALLED"
          else
            echo 'INSTALLED_ADAPTER_MISSING'
          fi
          echo '=== STAGE3B FILES ==='
          ls -lah "$STAGE3B" 2>/dev/null || echo 'STAGE3B_NOT_STARTED'
          echo '=== STAGE3B MANIFEST ==='
          cat "$STAGE3B/manifest.json" 2>/dev/null || true
          echo '=== STAGE3B LOG ==='
          tail -120 "$STAGE3B/train.log" 2>/dev/null || true
          echo '=== STAGE3B CHECKPOINTS ==='
          find "$STAGE3B/checkpoints" -maxdepth 2 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TS %p %s bytes\n' 2>/dev/null | sort | tail -20 || true
          echo '=== MEMORY ==='
          free -h
          echo '=== SERVICE ==='
          systemctl is-active rhocodec-llm.service || true
          curl -fsS http://127.0.0.1:18080/v1/models || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
# formal-stage3b verification
