name: Publish Tony v1.0.7 release

on:
  push:
    branches:
      - feature/tony-v107-response-quality
    paths:
      - '.github/workflows/tony-v107-publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tony-v107-publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: '35064987401'
      SOURCE_ARTIFACT: TonyDesktopPet-1.0.7-windows-x64-response-quality
      VERSION: '1.0.7'
      RELEASE_TAG: tony-v1.0.7
      UPDATE_TAG: tony-desktop-latest
      RELEASE_COMMIT: 49af0985c967b5d90823ca491c3a00c3bf2c6cbd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tony-v107-response-quality
          fetch-depth: 0

      - name: Verify release provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < bear_agent_pet/client/VERSION)" = "$VERSION"
          git cat-file -e "$RELEASE_COMMIT^{commit}"
          git diff --quiet "$RELEASE_COMMIT" HEAD -- bear_agent_pet/client
          VERSION_AT_BUILD="$(git show "$RELEASE_COMMIT:bear_agent_pet/client/VERSION" | tr -d '\r\n ')"
          test "$VERSION_AT_BUILD" = "$VERSION"
          echo "TONY_V107_RELEASE_PROVENANCE=PASS binary_commit=$RELEASE_COMMIT workflow_head=$(git rev-parse HEAD)"

      - name: Download verified Windows artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir package
          test -f package/TonyDesktopPet.exe
          test -f package/VERSION
          test -f package/VERSION.txt
          test -f package/tony-install-root.marker
          test -f package/tony-file-list.txt
          test -f package/assets/config/tony_responses.json
          test -f package/assets/config/tony_autonomous_responses.json
          test "$(tr -d '\r\n ' < package/VERSION)" = "$VERSION"
          grep -q "commit=$RELEASE_COMMIT" package/VERSION.txt
          echo 'TONY_V107_RELEASE_ARTIFACT=PASS'

      - name: Build release and updater archives
        id: package
        shell: bash
        run: |
          set -euo pipefail
          rm -f TonyDesktopPet-windows-x64.zip "TonyDesktopPet-${VERSION}-windows-x64.zip" "TonyDesktopPet-${VERSION}-windows-x64.zip.sha256" latest.json
          (
            cd package
            zip -q -r ../TonyDesktopPet-windows-x64.zip .
          )
          cp TonyDesktopPet-windows-x64.zip "TonyDesktopPet-${VERSION}-windows-x64.zip"
          sha256sum "TonyDesktopPet-${VERSION}-windows-x64.zip" > "TonyDesktopPet-${VERSION}-windows-x64.zip.sha256"
          SHA256="$(sha256sum TonyDesktopPet-windows-x64.zip | awk '{print $1}')"
          SIZE="$(stat -c '%s' TonyDesktopPet-windows-x64.zip)"
          export SHA256 SIZE
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          repo=os.environ['GITHUB_REPOSITORY']
          version=os.environ['VERSION']
          manifest={
              'schema': 1,
              'product': 'Tony Desktop Pet',
              'platform': 'windows-x64',
              'version': version,
              'url': f'https://github.com/{repo}/releases/download/tony-desktop-latest/TonyDesktopPet-windows-x64.zip?version={version}',
              'sha256': os.environ['SHA256'],
              'size': int(os.environ['SIZE']),
              'published_at': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'commit': os.environ['RELEASE_COMMIT'],
              'minimum_updater_version': '0.9.0',
          }
          with open('latest.json','w',encoding='utf-8',newline='\n') as f:
              json.dump(manifest,f,indent=2)
              f.write('\n')
          print('TONY_V107_MANIFEST=PASS', manifest['version'], manifest['sha256'], manifest['size'])
          PY
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Validate updater package structure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify-package
          mkdir verify-package
          unzip -q TonyDesktopPet-windows-x64.zip -d verify-package
          test -f verify-package/TonyDesktopPet.exe
          test -f verify-package/VERSION
          test -f verify-package/VERSION.txt
          test -f verify-package/tony-install-root.marker
          test -f verify-package/tony-file-list.txt
          test -f verify-package/assets/config/tony_responses.json
          test -f verify-package/assets/config/tony_autonomous_responses.json
          test "$(tr -d '\r\n ' < verify-package/VERSION)" = "$VERSION"
          echo 'TONY_V107_UPDATE_STRUCTURE=PASS'

      - name: Publish versioned Tony v1.0.7 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES_FILE=release-notes-v107.md
          cat > "$NOTES_FILE" <<'EOF'
          Tony Desktop Pet v1.0.7 — Response Quality Hotfix

          - Keeps the existing end-to-end streaming transport and raises normal companion generation from about 20 tokens to 72 tokens, with a 96-token safety ceiling, so replies are much less likely to stop mid-sentence.
          - Expands short-term server conversation context from 2 messages × 120 characters to 6 messages × 300 characters.
          - Removes Tony's biography from ordinary model prompts. Name, Teddy-dog identity, China, chemistry, Paula, glasses and other character details are no longer injected into every casual generation.
          - Keeps explicit identity/persona facts available through the local intent router when they are actually relevant.
          - Rewrites autonomous English chatter in natural first person instead of repeatedly referring to Tony by name.
          - Makes the Windows client track streamed text and recover a missing suffix from the server's final frame when needed.
          - The live gateway was tested against the real local Qwen companion path and public HTTPS edge before publication.
          - Windows package was compiled, packaged and smoke-tested by GitHub Actions from commit 49af0985c967b5d90823ca491c3a00c3bf2c6cbd.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "TonyDesktopPet-${VERSION}-windows-x64.zip" \
              "TonyDesktopPet-${VERSION}-windows-x64.zip.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Tony Desktop Pet v${VERSION}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" \
              "TonyDesktopPet-${VERSION}-windows-x64.zip" \
              "TonyDesktopPet-${VERSION}-windows-x64.zip.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --title "Tony Desktop Pet v${VERSION}" \
              --notes-file "$NOTES_FILE"
          fi
          echo 'TONY_V107_VERSIONED_RELEASE=PASS'

      - name: Publish automatic update channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$UPDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$UPDATE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --prerelease \
              --title 'Tony Desktop Pet automatic update channel' \
              --notes 'Managed automatically by Tony release workflows. latest.json is the updater manifest.'
          fi
          gh release upload "$UPDATE_TAG" \
            TonyDesktopPet-windows-x64.zip latest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo 'TONY_V107_UPDATE_CHANNEL_PUBLISH=PASS'

      - name: Verify public release and updater bytes
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$UPDATE_TAG/latest.json?verify=$GITHUB_RUN_ID"
          PACKAGE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$UPDATE_TAG/TonyDesktopPet-windows-x64.zip?verify=$GITHUB_RUN_ID"
          VERSIONED_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/TonyDesktopPet-${VERSION}-windows-x64.zip?verify=$GITHUB_RUN_ID"
          curl -fL --retry 5 --retry-delay 2 "$MANIFEST_URL" -o published-latest.json
          curl -fL --retry 5 --retry-delay 2 "$PACKAGE_URL" -o published-package.zip
          curl -fL --retry 5 --retry-delay 2 "$VERSIONED_URL" -o published-versioned.zip
          python - <<'PY'
          import hashlib, json, os
          with open('published-latest.json',encoding='utf-8-sig') as f:
              m=json.load(f)
          assert m['schema']==1, m
          assert m['version']==os.environ['VERSION'], m
          assert m['platform']=='windows-x64', m
          assert m['commit']==os.environ['RELEASE_COMMIT'], m
          def digest(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):
                      h.update(chunk)
              return h.hexdigest()
          updater=digest('published-package.zip')
          versioned=digest('published-versioned.zip')
          assert updater==m['sha256'], (updater,m['sha256'])
          assert versioned==updater, (versioned,updater)
          assert os.path.getsize('published-package.zip')==m['size']
          print('TONY_V107_PUBLIC_RELEASE_VERIFY=PASS',m['version'],updater,m['size'])
          PY
