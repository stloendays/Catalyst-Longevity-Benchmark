name: One-shot Tony Qt 6.8 URL compatibility fix

on:
  push:
    branches:
      - 'refactor/tony-1.1-foundation-working'
    paths:
      - '.github/workflows/tony-qt68-compat-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/tony-1.1-foundation-working
          fetch-depth: 0

      - name: Replace ambiguous empty QUrl arguments
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('bear_agent_pet/client/src')
          changed = []
          for path in [*root.rglob('*.cpp'), *root.rglob('*.h')]:
              text = path.read_text(encoding='utf-8')
              fixed = text.replace('setQuery({});', 'setQuery(QString{});')
              fixed = fixed.replace('setFragment({});', 'setFragment(QString{});')
              if fixed != text:
                  path.write_text(fixed, encoding='utf-8')
                  changed.append(str(path))
          print('Changed:', *changed, sep='\n- ')
          PY

      - name: Commit compatibility cleanup
        run: |
          if git diff --quiet; then
            echo 'No ambiguous QUrl calls remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bear_agent_pet/client/src
          git commit -m 'fix: make empty QUrl arguments explicit for Qt 6.8'
          git push origin HEAD:refactor/tony-1.1-foundation-working
