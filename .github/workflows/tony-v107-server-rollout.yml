name: Roll out Tony v1.0.7 response-quality gateway

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tony-v107-response-quality
    paths:
      - 'bear_agent_pet/server_gateway/**'
      - '.github/workflows/tony-v107-server-rollout.yml'

permissions:
  contents: read

concurrency:
  group: tony-server-runtime
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate response-quality source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile bear_agent_pet/server_gateway/app/main.py bear_agent_pet/server_gateway/app/main_v08.py
          python - <<'PY'
          from pathlib import Path
          s=Path('bear_agent_pet/server_gateway/app/main.py').read_text(encoding='utf-8')
          assert 'MAX_HISTORY_MESSAGES = 6' in s
          assert 'MAX_HISTORY_CHARS = 300' in s
          assert 'BEAR_LOCAL_MAX_TOKENS", "72"' in s
          assert '32), 96)' in s
          assert 'Speak naturally in first person' in s
          assert "Unless the user's message directly asks about identity" in s
          assert "Answer only the user's current question in first person" in s
          assert '"stream": True' in s
          print('TONY_V107_GATEWAY_SOURCE=PASS')
          PY

      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"

      - name: Deploy Tony gateway source
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'mkdir -p /home/ubuntu/.local/share/bear-agent/app'
          rsync -az --delete -e "ssh -i $HOME/.ssh/server_key" \
            bear_agent_pet/server_gateway/ \
            ubuntu@150.158.27.206:/home/ubuntu/.local/share/bear-agent/app/

      - name: Configure and restart live gateway
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT='/home/ubuntu/.local/share/bear-agent'
          APP="$ROOT/app"
          VENV="$ROOT/venv"
          ENVFILE="$ROOT/bear-agent.env"

          if [ ! -x "$VENV/bin/python" ]; then
            python3 -m venv "$VENV"
          fi
          "$VENV/bin/pip" install --disable-pip-version-check -q -r "$APP/requirements.txt"

          set_env() {
            key="$1"; value="$2"
            touch "$ENVFILE"
            chmod 600 "$ENVFILE"
            if grep -q "^${key}=" "$ENVFILE"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$ENVFILE"
            else
              printf '%s=%s\n' "$key" "$value" >> "$ENVFILE"
            fi
          }
          set_env BEAR_LOCAL_MAX_TOKENS 72
          set_env BEAR_LOCAL_TECHNICAL_MAX_TOKENS 384
          set_env BEAR_LOCAL_TECHNICAL_MESSAGE_CHARS 6000

          sudo systemctl restart bear-agent-gateway.service

          ready=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:18790/health >/tmp/tony-v107-health.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          cat /tmp/tony-v107-health.json

          PYTHONPATH="$APP" "$VENV/bin/python" - <<'PY'
          from app.main import MAX_HISTORY_CHARS, MAX_HISTORY_MESSAGES, TONY_PERSONA_EN, _local_payload
          assert MAX_HISTORY_MESSAGES == 6
          assert MAX_HISTORY_CHARS == 300
          assert 'Speak naturally in first person' in TONY_PERSONA_EN
          assert "Unless the user's message directly asks about identity" in TONY_PERSONA_EN
          _, _, _, payload = _local_payload('How old are you?', [], 'en', technical=False)
          assert payload['stream'] is True
          assert payload['max_tokens'] == 72, payload['max_tokens']
          assert payload['temperature'] == 0.64, payload['temperature']
          prompt = payload['messages'][-1]['content']
          assert "Answer only the user's current question in first person" in prompt
          print('TONY_V107_LIVE_CONFIG=PASS')
          PY

          PYTHONPATH="$APP" "$VENV/bin/python" - <<'PY'
          import asyncio
          from app.main import call_backend

          async def main():
              answer, used_agent, fallback = await call_backend(
                  'How old are you?',
                  'v107-response-quality-smoke',
                  'en',
              )
              assert answer.strip(), answer
              assert fallback is False, fallback
              assert 'companion' in used_agent, used_agent
              low=answer.casefold()
              forbidden=('tony','paula','china','chinese','chemistry','fluffy dog','teddy dog','desktop ai agent')
              assert not any(term in low for term in forbidden), answer
              assert len(answer) >= 20, answer
              print('TONY_V107_COMPANION_GENERATION=PASS')
              print('agent=' + used_agent)
              print('answer=' + answer.replace('\n',' ')[:500])
              print('answer_chars=' + str(len(answer)))

          asyncio.run(main())
          PY

          systemctl --no-pager --full status bear-agent-gateway.service | head -n 18
          REMOTE

      - name: Probe public HTTPS edge
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://150.158.27.206/health > /tmp/public-health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/public-health.json'))
          assert d['ok'] is True, d
          assert d['backend'] == 'local-qwen-routed-chat', d
          assert d['streaming'] is True, d
          print('TONY_V107_PUBLIC_EDGE=PASS')
          PY

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/server_key"
