name: Tony v1.01 owner devices gate

on:
  push:
    branches:
      - release/tony-1.0-integration
    paths:
      - '.github/workflows/tony-v101-owner-devices-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-owner-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/tony-1.0-integration
      - name: Compile server modules
        run: |
          python3 -m py_compile bear_agent_pet/server_gateway/app/pairing.py
          python3 -m py_compile bear_agent_pet/server_gateway/app/main_v08.py
      - name: Validate owner bootstrap approval and revocation
        env:
          BEAR_PAIRING_STORE: ${{ runner.temp }}/tony-v101-pairing.json
        run: |
          export PYTHONPATH="$PWD/bear_agent_pet/server_gateway"
          python3 - <<'PY'
          from app.pairing import (
              approve_device_pairing_request,
              approve_device_pairing_request_by_id,
              claim_device_pairing_request,
              create_device_pairing_request,
              list_owner_devices,
              list_owner_pairing_requests,
              owner_device_for_token,
              revoke_device_as_owner,
              token_valid,
          )

          owner_request, owner_code, _ = create_device_pairing_request('OWNER-PC')
          approve_device_pairing_request(owner_code)
          status, owner_token, owner_id = claim_device_pairing_request(owner_request)
          assert status == 'approved' and owner_token and owner_id
          owner = owner_device_for_token(owner_token)
          assert owner and owner['id'] == owner_id, (owner, owner_id)

          friend_request, friend_code, _ = create_device_pairing_request('FRIEND-PC')
          pending = list_owner_pairing_requests()
          friend_row = next(row for row in pending if row['device_name'] == 'FRIEND-PC')
          assert friend_row['approved'] is False and friend_row['paired'] is False
          approve_device_pairing_request_by_id(friend_row['approval_id'])
          status, friend_token, friend_id = claim_device_pairing_request(friend_request)
          assert status == 'approved' and friend_token and friend_id
          assert token_valid(friend_token)
          assert owner_device_for_token(friend_token) is None

          devices = list_owner_devices()
          owner_rows = [row for row in devices if row['owner']]
          assert len(owner_rows) == 1 and owner_rows[0]['id'] == owner_id, devices
          assert revoke_device_as_owner(friend_id) is True
          assert token_valid(friend_token) is False
          try:
              revoke_device_as_owner(owner_id)
          except ValueError:
              pass
          else:
              raise AssertionError('owner self-revocation must be blocked')
          assert token_valid(owner_token)
          print('TONY_V101_OWNER_AUTH=PASS')
          print('TONY_V101_OWNER_APPROVAL=PASS')
          print('TONY_V101_OWNER_REVOCATION=PASS')
          PY

  windows-build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/tony-1.0-integration
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtwebsockets
          cache: true
      - name: Verify v1.01 semantic version
        shell: pwsh
        run: |
          $version = (Get-Content bear_agent_pet/client/VERSION -Raw).Trim()
          if ($version -ne '1.0.1') { throw "Expected 1.0.1, got $version" }
          Write-Host 'TONY_V101_VERSION=PASS'
      - name: Build Tony v1.01
        shell: pwsh
        run: |
          cmake -S bear_agent_pet/client -B bear_agent_pet/client/build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          cmake --build bear_agent_pet/client/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          Write-Host 'TONY_V101_WINDOWS_BUILD=PASS'
      - name: Package validation artifact
        shell: pwsh
        run: |
          $package = "$PWD/bear_agent_pet/client/package-tony-v101"
          cmake --install bear_agent_pet/client/build --config Release --prefix $package
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          windeployqt --release --no-translations "$package/TonyDesktopPet.exe"
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: TonyDesktopPet-1.0.1-owner-devices-validation
          path: bear_agent_pet/client/package-tony-v101
          if-no-files-found: error
