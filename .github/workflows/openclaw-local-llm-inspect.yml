name: Inspect OpenClaw local LLM integration

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/openclaw-local-llm-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"
      - name: Inspect ubuntu OpenClaw CLI and model config
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -u
          OC='/home/ubuntu/.npm-global/bin/openclaw'
          CFG='/home/ubuntu/.openclaw/openclaw.json'
          echo '=== VERSION ==='
          "$OC" --version 2>&1 || true
          echo '=== MAIN HELP ==='
          "$OC" --help 2>&1 | head -140 || true
          echo '=== CONFIG HELP ==='
          "$OC" config --help 2>&1 | head -180 || true
          echo '=== CONFIG SET HELP ==='
          "$OC" config set --help 2>&1 | head -180 || true
          echo '=== MODELS HELP ==='
          "$OC" models --help 2>&1 | head -180 || true
          echo '=== PLUGINS ==='
          "$OC" plugins list 2>&1 | head -220 || true
          echo '=== SANITIZED MODEL CONFIG ==='
          python3 - "$CFG" <<'PY'
          import json, sys
          p=sys.argv[1]
          with open(p) as f:
              d=json.load(f)
          out={
              'agents.defaults.model': (((d.get('agents') or {}).get('defaults') or {}).get('model')),
              'agents.defaults.models': (((d.get('agents') or {}).get('defaults') or {}).get('models')),
              'models.mode': ((d.get('models') or {}).get('mode')),
              'providers': {}
          }
          for k,v in (((d.get('models') or {}).get('providers')) or {}).items():
              if not isinstance(v, dict):
                  continue
              out['providers'][k]={
                  'baseUrl': v.get('baseUrl'),
                  'api': v.get('api'),
                  'timeoutSeconds': v.get('timeoutSeconds'),
                  'models': [
                      {
                          'id': m.get('id'),
                          'name': m.get('name'),
                          'contextWindow': m.get('contextWindow'),
                          'maxTokens': m.get('maxTokens'),
                          'reasoning': m.get('reasoning'),
                          'compat': m.get('compat')
                      }
                      for m in (v.get('models') or []) if isinstance(m, dict)
                  ]
              }
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
          echo '=== LOCAL LLAMA API ==='
          curl -fsS --max-time 10 http://127.0.0.1:18080/v1/models || true
          echo
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
