name: Build Tony Teddy desktop pet
# Rebuild marker: v0.8.1 desktop-aware behavior + Teddy project naming.

on:
  workflow_dispatch:
  push:
    paths:
      - 'teddy_agent_pet/client/**'
      - '.github/workflows/teddy-agent-build-windows.yml'

permissions:
  contents: read

concurrency:
  group: tony-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebsockets'
          cache: true
      - name: Validate Tony state artwork
        shell: pwsh
        run: python teddy_agent_pet/client/tools/validate_state_assets.py
      - name: Configure
        shell: pwsh
        run: cmake -S teddy_agent_pet/client -B teddy_agent_pet/client/build -G "Visual Studio 17 2022" -A x64
      - name: Build
        shell: pwsh
        run: cmake --build teddy_agent_pet/client/build --config Release --parallel
      - name: Deploy Qt runtime and Tony artwork
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path teddy_agent_pet/client/package/assets | Out-Null
          cmake --install teddy_agent_pet/client/build --config Release --prefix teddy_agent_pet/client/package
          if ($LASTEXITCODE -ne 0) { throw "CMake install failed" }
          Copy-Item teddy_agent_pet/client/RUN_TONY.md teddy_agent_pet/client/package/
          $projectLine = Get-Content teddy_agent_pet/client/CMakeLists.txt | Select-String 'project\(TonyDesktopPet VERSION ([0-9.]+)'
          $version = $projectLine.Matches[0].Groups[1].Value
          "TonyDesktopPet $version`ncommit=$env:GITHUB_SHA" | Set-Content teddy_agent_pet/client/package/VERSION.txt
          windeployqt --release --no-translations teddy_agent_pet/client/package/TonyDesktopPet.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
      - name: Verify packaged artwork and executable
        shell: pwsh
        run: |
          $source = (Resolve-Path teddy_agent_pet/client/assets).Path
          $package = (Resolve-Path teddy_agent_pet/client/package).Path
          foreach ($required in @('TonyDesktopPet.exe', 'assets/states', 'assets/animations')) {
            if (-not (Test-Path (Join-Path $package $required))) { throw "Missing package entry: $required" }
          }
          foreach ($file in Get-ChildItem $source -File -Recurse) {
            $relative = [IO.Path]::GetRelativePath($source, $file.FullName)
            $deployed = Join-Path "$package/assets" $relative
            if (-not (Test-Path $deployed)) { throw "Missing artwork: $relative" }
            if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash $deployed).Hash) {
              throw "Packaged artwork differs: $relative"
            }
          }
          Write-Host 'TONY_PACKAGE_ASSETS=PASS (Teddy project path; packaged bytes match SHA256)'
          $originalPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          try {
            $process = Start-Process -FilePath "$package/TonyDesktopPet.exe" -WorkingDirectory $package -WindowStyle Hidden -PassThru
            try {
              Start-Sleep -Seconds 6
              if ($process.HasExited) { throw "Tony exited during smoke test: $($process.ExitCode)" }
              Write-Host 'TONY_TEDDY_V081_SMOKE=PASS'
            } finally {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          } finally { $env:PATH = $originalPath }
      - uses: actions/upload-artifact@v4
        with:
          name: TonyDesktopPet-windows-x64
          path: teddy_agent_pet/client/package
          if-no-files-found: error
