name: Apply Zhice Monochrome UI Once

on:
  push:
    branches: [ui-zhice-monochrome]
    paths:
      - ".github/workflows/apply-zhice-monochrome-ui-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-zhice-monochrome
          fetch-depth: 0
      - name: Apply native UI changes
        run: python tools/apply_zhice_monochrome_ui.py
      - name: Commit UI source changes and remove one-shot files
        shell: bash
        run: |
          rm tools/apply_zhice_monochrome_ui.py
          rm .github/workflows/apply-zhice-monochrome-ui-once.yml
          git config user.name "stloendays"
          git config user.email "157110190+stloendays@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade native UI to Zhice monochrome design"
          git push origin HEAD:ui-zhice-monochrome

  validate-windows:
    needs: apply
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-zhice-monochrome
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true
      - name: Configure CMake
        shell: pwsh
        run: cmake -S native/qt -B native/qt/build -G "Visual Studio 17 2022" -A x64
      - name: Build native desktop app
        shell: pwsh
        run: cmake --build native/qt/build --config Release --parallel
      - name: Run native self-test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path native/qt/build -Recurse -Filter "Catalyst Longevity Research.exe" | Select-Object -First 1
          if (-not $exe) { throw "Native executable not found" }
          & $exe.FullName --self-test
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed with exit code $LASTEXITCODE" }
      - name: Window smoke test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path native/qt/build -Recurse -Filter "Catalyst Longevity Research.exe" | Select-Object -First 1
          if (-not $exe) { throw "Native executable not found" }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 4
          if ($p.HasExited) { throw "Desktop app exited during smoke test with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
