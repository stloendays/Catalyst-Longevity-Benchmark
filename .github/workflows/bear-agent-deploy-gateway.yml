name: Deploy Tony desktop companion

on:
  workflow_dispatch:
  push:
    paths:
      - 'bear_agent_pet/server_gateway/**'
      - '.github/workflows/bear-agent-deploy-gateway.yml'

permissions:
  contents: read

# Shared with model switching and E2E so a test never races a service restart.
concurrency:
  group: tony-server-runtime
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"

      - name: Copy gateway source
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 \
            'mkdir -p /home/ubuntu/.local/share/bear-agent/app'
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/server_key" \
            bear_agent_pet/server_gateway/ \
            ubuntu@150.158.27.206:/home/ubuntu/.local/share/bear-agent/app/

      - name: Install restart and verify Tony chat service
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT='/home/ubuntu/.local/share/bear-agent'
          APP="$ROOT/app"
          VENV="$ROOT/venv"
          ENVFILE="$ROOT/bear-agent.env"
          LOCAL_SERVICE='rhocodec-llm.service'

          if ! python3 -c 'import ensurepip' >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-venv
          fi

          rm -rf "$VENV"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install --disable-pip-version-check -q -r "$APP/requirements.txt"

          sudo systemctl enable "$LOCAL_SERVICE"
          if ! systemctl is-active --quiet "$LOCAL_SERVICE"; then
            sudo systemctl restart "$LOCAL_SERVICE"
          fi

          ready=0
          for i in $(seq 1 70); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/v1/models >/tmp/tony-local-models.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          cat /tmp/tony-local-models.json

          MODEL_ID=$(python3 - <<'PY'
          import json
          with open('/tmp/tony-local-models.json') as f:
              d=json.load(f)
          rows=d.get('data') or []
          assert rows and rows[0].get('id'), d
          print(rows[0]['id'])
          PY
          )
          echo "Active Tony model: $MODEL_ID"

          touch "$ENVFILE"
          chmod 600 "$ENVFILE"
          set_env() {
            key="$1"; value="$2"
            if grep -q "^${key}=" "$ENVFILE"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$ENVFILE"
            else
              printf '%s=%s\n' "$key" "$value" >> "$ENVFILE"
            fi
          }
          set_env BEAR_AGENT_REQUIRE_AUTH false
          set_env BEAR_TONY_PERSONA true
          set_env BEAR_LOCAL_MODEL "$MODEL_ID"
          set_env BEAR_LOCAL_MODEL_URL http://127.0.0.1:18080/v1/chat/completions
          if printf '%s' "$MODEL_ID" | grep -qi '0.8b'; then
            set_env BEAR_LOCAL_MODEL_TIMEOUT 35
          else
            # Quality mode is intentionally slower on this CPU-only host. Do not make
            # the gateway kill a valid 2B reply before the model has a chance to finish.
            set_env BEAR_LOCAL_MODEL_TIMEOUT 150
          fi
          set_env BEAR_LOCAL_MAX_TOKENS 48

          sudo tee /etc/systemd/system/bear-agent-gateway.service >/dev/null <<'UNIT'
          [Unit]
          Description=Tony English Boyfriend Desktop Companion Gateway
          After=network-online.target rhocodec-llm.service
          Wants=network-online.target rhocodec-llm.service

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/home/ubuntu/.local/share/bear-agent/app
          EnvironmentFile=/home/ubuntu/.local/share/bear-agent/bear-agent.env
          ExecStart=/home/ubuntu/.local/share/bear-agent/venv/bin/uvicorn app.main_v08:app --host 127.0.0.1 --port 18790
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo systemctl daemon-reload
          sudo systemctl enable --now bear-agent-gateway.service
          sudo systemctl restart bear-agent-gateway.service

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18790/health >/tmp/tony-health.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          cat /tmp/tony-health.json
          "$VENV/bin/python" - "$MODEL_ID" <<'PY'
          import json, sys
          expected=sys.argv[1]
          d=json.load(open('/tmp/tony-health.json'))
          assert d['ok'] is True, d
          assert d['service'] == 'Tony Desktop Companion', d
          assert d['version'] == '0.8.2', d
          assert d['backend'] == 'local-qwen-chat-only', d
          assert d['local_model'] == expected, (d, expected)
          assert d['language'] == 'English', d
          assert d['persona'] == 'Paula-boyfriend', d
          assert d['chat_only'] is True, d
          assert d['local_tools_enabled'] is False, d
          assert d['openclaw_enabled'] is False, d
          print('TONY_CHAT_GATEWAY_HEALTH=PASS')
          PY

          if printf '%s' "$MODEL_ID" | grep -qi '0.8b'; then
            echo '=== FAST MODEL BOYFRIEND CHAT SMOKE ==='
            cd "$APP"
            "$VENV/bin/python" - "$MODEL_ID" <<'PY'
          import json, sys, time, urllib.request
          model=sys.argv[1]
          payload={
            'model':model,
            'messages':[
              {'role':'system','content':"You are Tony, Paula's cute teddy-bear-like boyfriend. Speak only short natural English."},
              {'role':'user','content':'Paula says: I missed you today. Reply naturally in one short sentence.\n/no_think'}
            ],
            'temperature':0.8,
            'top_p':0.9,
            'max_tokens':32,
            'stream':False,
            'reasoning_budget':0,
            'chat_template_kwargs':{'enable_thinking':False},
          }
          req=urllib.request.Request(
            'http://127.0.0.1:18080/v1/chat/completions',
            data=json.dumps(payload).encode(),
            headers={'Content-Type':'application/json'}, method='POST')
          start=time.monotonic()
          with urllib.request.urlopen(req, timeout=45) as r:
            d=json.load(r)
          elapsed=time.monotonic()-start
          text=str(((d.get('choices') or [{}])[0].get('message') or {}).get('content') or '').strip()
          assert text, d
          assert not any('\u4e00' <= ch <= '\u9fff' for ch in text), text
          assert elapsed < 45, elapsed
          print('TONY_FAST_BOYFRIEND_CHAT=PASS')
          print('MODEL=',model)
          print('LATENCY_SEC=',round(elapsed,2))
          print('TONY_SAMPLE=', text[:300].replace('\n',' '))
          PY
          else
            # The preserved 2B profile is a quality option, not the latency gate for a
            # deployment. Readiness is verified above; its generation quality is tested
            # separately so a minute-long CPU reply cannot make a healthy deploy red.
            echo 'TONY_QUALITY_MODEL_READY=PASS'
            echo 'TONY_QUALITY_GENERATION_GATE=SKIPPED_BY_DESIGN'
          fi

          systemctl --no-pager --full status bear-agent-gateway.service | head -n 18
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
