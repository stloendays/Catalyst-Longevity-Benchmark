name: Deploy Tony desktop Agent gateway

on:
  workflow_dispatch:
  push:
    paths:
      - 'bear_agent_pet/server_gateway/**'
      - '.github/workflows/bear-agent-deploy-gateway.yml'

permissions:
  contents: read

concurrency:
  group: tony-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"

      - name: Copy gateway source
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 \
            'mkdir -p /home/ubuntu/.local/share/bear-agent/app'
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/server_key" \
            bear_agent_pet/server_gateway/ \
            ubuntu@150.158.27.206:/home/ubuntu/.local/share/bear-agent/app/

      - name: Install restart and verify service
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT='/home/ubuntu/.local/share/bear-agent'
          APP="$ROOT/app"
          VENV="$ROOT/venv"
          ENVFILE="$ROOT/bear-agent.env"

          if ! python3 -c 'import ensurepip' >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-venv
          fi

          rm -rf "$VENV"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install --disable-pip-version-check -q -r "$APP/requirements.txt"

          if [ ! -f "$ENVFILE" ]; then
            cat > "$ENVFILE" <<'ENV'
          BEAR_AGENT_REQUIRE_AUTH=false
          BEAR_OPENCLAW_AGENT=main
          BEAR_OPENCLAW_TIMEOUT=240
          BEAR_TONY_PERSONA=true
          BEAR_LOCAL_MODEL=qwen3.5-2b-q4
          BEAR_LOCAL_MODEL_URL=http://127.0.0.1:18080/v1/chat/completions
          BEAR_LOCAL_MODEL_TIMEOUT=90
          BEAR_LOCAL_MAX_TOKENS=420
          OPENCLAW_BIN=/home/ubuntu/.npm-global/bin/openclaw
          ENV
            chmod 600 "$ENVFILE"
          fi
          grep -q '^BEAR_TONY_PERSONA=' "$ENVFILE" || printf '%s\n' 'BEAR_TONY_PERSONA=true' >> "$ENVFILE"
          grep -q '^BEAR_LOCAL_MODEL=' "$ENVFILE" || printf '%s\n' 'BEAR_LOCAL_MODEL=qwen3.5-2b-q4' >> "$ENVFILE"
          grep -q '^BEAR_LOCAL_MODEL_URL=' "$ENVFILE" || printf '%s\n' 'BEAR_LOCAL_MODEL_URL=http://127.0.0.1:18080/v1/chat/completions' >> "$ENVFILE"
          grep -q '^BEAR_LOCAL_MODEL_TIMEOUT=' "$ENVFILE" || printf '%s\n' 'BEAR_LOCAL_MODEL_TIMEOUT=90' >> "$ENVFILE"
          grep -q '^BEAR_LOCAL_MAX_TOKENS=' "$ENVFILE" || printf '%s\n' 'BEAR_LOCAL_MAX_TOKENS=420' >> "$ENVFILE"

          sudo tee /etc/systemd/system/bear-agent-gateway.service >/dev/null <<'UNIT'
          [Unit]
          Description=Tony Desktop Agent OpenClaw WebSocket Gateway
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/home/ubuntu/.local/share/bear-agent/app
          EnvironmentFile=/home/ubuntu/.local/share/bear-agent/bear-agent.env
          ExecStart=/home/ubuntu/.local/share/bear-agent/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 18790
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo systemctl daemon-reload
          sudo systemctl enable --now bear-agent-gateway.service
          sudo systemctl restart bear-agent-gateway.service

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18790/health >/tmp/tony-health.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          echo '=== TONY GATEWAY HEALTH ==='
          cat /tmp/tony-health.json
          echo
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/tony-health.json'))
          assert d['ok'] is True, d
          assert d['service'] == 'Tony Desktop Agent Gateway', d
          assert d['version'] == '0.6.0', d
          assert d['tony_persona'] is True, d
          assert d['technical_agent'] == 'main', d
          assert d['local_model'] == 'qwen3.5-2b-q4', d
          print('TONY_GATEWAY_HEALTH=PASS')
          PY

          echo '=== ROUTER CONTRACT ==='
          cd "$APP"
          "$VENV/bin/python" - <<'PY'
          from app.main import action_for_text, route_backends
          assert route_backends('Can I have a hug?')[0] == 'local-qwen'
          assert route_backends('Check my VASP server job')[0] == 'openclaw-main'
          assert action_for_text('Paula is here')[0] == 'blush_wave'
          assert action_for_text('It is freezing')[0] == 'shiver'
          assert action_for_text('Can I have a hug?')[0] == 'ask_hug'
          print('TONY_ROUTER_CONTRACT=PASS')
          PY

          echo '=== LOCAL QWEN DIRECT COMPLETION ==='
          "$VENV/bin/python" - <<'PY'
          import json, urllib.request
          payload={
            'model':'qwen3.5-2b-q4',
            'messages':[{'role':'user','content':'Reply exactly with: TONY_LOCAL_QWEN_OK'}],
            'temperature':0,
            'max_tokens':32,
            'stream':False,
          }
          req=urllib.request.Request(
            'http://127.0.0.1:18080/v1/chat/completions',
            data=json.dumps(payload).encode(),
            headers={'Content-Type':'application/json'},
            method='POST')
          with urllib.request.urlopen(req, timeout=60) as r:
            d=json.load(r)
          text=((d.get('choices') or [{}])[0].get('message') or {}).get('content','')
          assert 'TONY_LOCAL_QWEN_OK' in text, d
          print('TONY_LOCAL_QWEN_DIRECT=PASS')
          PY

          echo '=== OPENCLAW CONTROL PLANE ==='
          export PATH="/home/ubuntu/.npm-global/bin:$PATH"
          /home/ubuntu/.npm-global/bin/openclaw gateway status --deep --json >/tmp/tony-openclaw-status.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/tony-openclaw-status.json'))
          assert ((d.get('service') or {}).get('runtime') or {}).get('status') == 'running', d
          assert (d.get('rpc') or {}).get('ok') is True, d
          print('TONY_OPENCLAW_CONTROL_PLANE=PASS')
          PY

          echo '=== WEBSOCKET CONTRACT ==='
          "$VENV/bin/python" - <<'PY'
          import asyncio, json
          import websockets

          async def main():
              async with websockets.connect('ws://127.0.0.1:18790/agent/ws') as ws:
                  first=json.loads(await asyncio.wait_for(ws.recv(), 5))
                  second=json.loads(await asyncio.wait_for(ws.recv(), 5))
                  assert first == {'type':'agent_state','state':'idle'}, first
                  assert second.get('type') == 'avatar_action', second
                  assert second.get('action') == 'wave', second
                  print('TONY_WEBSOCKET_CONTRACT=PASS')
          asyncio.run(main())
          PY

          systemctl --no-pager --full status bear-agent-gateway.service | head -n 24
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
