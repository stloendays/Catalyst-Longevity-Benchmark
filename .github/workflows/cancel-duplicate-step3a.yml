name: Cancel duplicate Step3A run

on:
  push:
    paths:
      - .github/workflows/cancel-duplicate-step3a.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate recovery runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in 34296317190 34296487002; do
            gh api --method POST \
              repos/${{ github.repository }}/actions/runs/${run_id}/cancel || true
            echo "DUPLICATE_RUN_CANCEL_REQUESTED=${run_id}"
          done
