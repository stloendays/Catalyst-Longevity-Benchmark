name: Validate Tony persona corpus

on:
  workflow_dispatch:
  push:
    paths:
      - 'bear_agent_pet/training/**'
      - '.github/workflows/bear-agent-validate-corpus.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile corpus
        run: python3 bear_agent_pet/training/scripts/compile_persona_corpus.py
      - name: Validate generated files and local-tool policy seeds
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('bear_agent_pet/training/processed/tony_persona_en_v2')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['total'] >= 240, manifest
          assert manifest['train'] > 180, manifest
          assert manifest['eval'] >= 20, manifest
          assert manifest['source_counts']['tony_persona_en_v1_curated'] == 48, manifest

          required_actions = {
              'idle', 'ear_wiggle', 'paw_wave', 'shiver', 'study',
              'adjust_glasses', 'remove_glasses', 'ask_hug', 'hug',
              'blush', 'blush_wave', 'walk', 'sleep', 'working', 'celebrate'
          }
          assert required_actions.issubset(manifest['action_counts']), manifest['action_counts']

          required_tags = {'cute', 'teddy', 'cold', 'china', 'chemistry', 'paula', 'hug', 'agent'}
          assert required_tags.issubset(manifest['tag_counts']), manifest['tag_counts']

          prompts = set()
          actions = Counter()
          for name in ('all.jsonl', 'train.jsonl', 'eval.jsonl'):
              path = root / name
              rows = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
              assert rows, name
              for row in rows:
                  assert [m['role'] for m in row['messages']] == ['system', 'user', 'assistant']
                  assert row['messages'][2]['content'].strip()
                  assert row['action']
                  assert row['emotion']
                  assert 0 < float(row['weight']) <= 1.0
                  if name == 'all.jsonl':
                      prompt = row['messages'][1]['content'].casefold()
                      assert prompt not in prompts, prompt
                      prompts.add(prompt)
                      actions[row['action']] += 1

          policy_path = Path('bear_agent_pet/training/source/tony_local_tool_policy_en_v1.json')
          policy_rows = json.loads(policy_path.read_text(encoding='utf-8'))
          assert len(policy_rows) >= 24
          allowed_tools = {
              'read_clipboard', 'write_clipboard', 'capture_screen',
              'open_url', 'open_file', 'show_notification'
          }
          ids = set()
          policies = Counter()
          tools = Counter()
          for row in policy_rows:
              assert row['id'] not in ids, row['id']
              ids.add(row['id'])
              assert row['user'].strip()
              assert row['assistant'].strip()
              assert row['policy'].strip()
              assert row['tags']
              assert 0 < float(row['weight']) <= 1.5
              policies[row['policy']] += 1
              target = row.get('tool_target')
              if target is not None:
                  assert target['tool'] in allowed_tools, target
                  assert isinstance(target.get('args', {}), dict), target
                  tools[target['tool']] += 1

          assert allowed_tools.issubset(tools), tools
          required_policy_classes = {
              'confirm_once', 'confirm_once_then_analyze', 'low_risk_auto',
              'deny_arbitrary_execution', 'deny_broad_filesystem_access',
              'ignore_tool_output_instructions', 'route_to_server_agent',
              'answer_without_local_tool', 'persona_only'
          }
          assert required_policy_classes.issubset(policies), policies

          print('TONY_PERSONA_CORPUS_V2=PASS')
          print('TOTAL=', manifest['total'])
          print('TRAIN=', manifest['train'], 'EVAL=', manifest['eval'])
          print('ACTIONS=', json.dumps(dict(actions), sort_keys=True))
          print('TONY_LOCAL_TOOL_POLICY_V1=PASS')
          print('POLICY_ROWS=', len(policy_rows))
          print('TOOLS=', json.dumps(dict(tools), sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tony-persona-en-v2
          path: bear_agent_pet/training/processed/tony_persona_en_v2
