name: Validate Tony boyfriend corpus

on:
  workflow_dispatch:
  push:
    paths:
      - 'bear_agent_pet/training/**'
      - '.github/workflows/bear-agent-validate-corpus.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile English boyfriend corpus v3
        run: python3 bear_agent_pet/training/scripts/compile_boyfriend_corpus_v3.py

      - name: Validate boyfriend corpus
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('bear_agent_pet/training/processed/tony_boyfriend_en_v3')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '3.0', manifest
          assert manifest['language'] == 'en', manifest
          assert manifest['role'] == 'Paula-boyfriend', manifest
          assert manifest['total'] >= 100, manifest
          assert manifest['train'] >= 80, manifest
          assert manifest['eval'] >= 8, manifest

          required_tags = {
              'paula', 'boyfriend', 'hug', 'cold', 'glasses',
              'boundary', 'cute', 'relationship'
          }
          assert required_tags.issubset(manifest['tag_counts']), manifest['tag_counts']
          required_actions = {
              'blush_wave', 'blush', 'ask_hug', 'hug', 'shiver',
              'remove_glasses', 'adjust_glasses', 'sleep', 'quiet_idle'
          }
          assert required_actions.issubset(manifest['action_counts']), manifest['action_counts']

          prompts=set()
          forbidden=('chemistry','catalyst','vasp','server','github','openclaw','powershell','coding assistant')
          rows=[]
          for line in (root/'all.jsonl').read_text(encoding='utf-8').splitlines():
              if line.strip():
                  rows.append(json.loads(line))
          assert len(rows) == manifest['total']
          for row in rows:
              assert [m['role'] for m in row['messages']] == ['system','user','assistant']
              user=row['messages'][1]['content']
              assistant=row['messages'][2]['content']
              assert user.casefold() not in prompts, user
              prompts.add(user.casefold())
              assert assistant.strip()
              assert not any('\u4e00' <= ch <= '\u9fff' for ch in user+assistant), user
              combined=(user+' '+assistant).casefold()
              assert not any(term in combined for term in forbidden), combined
              system=row['messages'][0]['content'].casefold()
              assert 'paula' in system and 'girlfriend' in system
              assert 'english' in system

          print('TONY_BOYFRIEND_CORPUS_V3=PASS')
          print('TOTAL=', manifest['total'])
          print('TRAIN=', manifest['train'], 'EVAL=', manifest['eval'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tony-boyfriend-en-v3
          path: bear_agent_pet/training/processed/tony_boyfriend_en_v3
