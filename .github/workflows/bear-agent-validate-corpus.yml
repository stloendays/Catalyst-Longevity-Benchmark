name: Validate Tony persona corpus

on:
  workflow_dispatch:
  push:
    paths:
      - 'bear_agent_pet/training/**'
      - '.github/workflows/bear-agent-validate-corpus.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile corpus
        run: python3 bear_agent_pet/training/scripts/compile_persona_corpus.py
      - name: Validate generated files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('bear_agent_pet/training/processed/tony_persona_en_v1')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['total'] == 48, manifest
          assert manifest['train'] > 0, manifest
          assert manifest['eval'] > 0, manifest

          for name in ('all.jsonl', 'train.jsonl', 'eval.jsonl'):
              path = root / name
              rows = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
              assert rows, name
              for row in rows:
                  assert [m['role'] for m in row['messages']] == ['system', 'user', 'assistant']
                  assert row['messages'][2]['content'].strip()
                  assert row['action']
                  assert row['emotion']
          print('TONY_PERSONA_CORPUS=PASS')
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tony-persona-en-v1
          path: bear_agent_pet/training/processed/tony_persona_en_v1
