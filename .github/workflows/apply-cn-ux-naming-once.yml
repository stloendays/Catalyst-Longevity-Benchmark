name: Apply Chinese UX Naming Once

on:
  push:
    branches: [ui-linked-catalyst-focus]
    paths:
      - ".github/workflows/apply-cn-ux-naming-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-linked-catalyst-focus
          fetch-depth: 0

      - name: Apply Chinese UX naming
        run: python tools/apply_cn_ux_and_linked_focus.py

      - name: Commit UI wording changes and cleanup
        shell: bash
        run: |
          git config user.name "stloendays"
          git config user.email "157110190+stloendays@users.noreply.github.com"
          rm -f tools/apply_cn_ux_and_linked_focus.py .github/workflows/apply-cn-ux-naming-once.yml
          git add -A
          git commit -m "Refine Chinese UI naming for familiar desktop UX"
          git push origin ui-linked-catalyst-focus
