name: Apply Research Value Modules Once

on:
  push:
    branches: [ui-linked-catalyst-focus]
    paths:
      - ".github/workflows/apply-research-value-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-linked-catalyst-focus
          fetch-depth: 0

      - name: Apply application-value modules
        run: python tools/apply_research_value_ui.py

      - name: Commit source changes and cleanup
        shell: bash
        run: |
          git config user.name "stloendays"
          git config user.email "157110190+stloendays@users.noreply.github.com"
          rm -f tools/apply_research_value_ui.py .github/workflows/apply-research-value-once.yml
          git add native/qt/CMakeLists.txt native/qt/src/mainwindow.h native/qt/src/mainwindow.cpp native/qt/src/main.cpp native/qt/src/researchadvisor.h native/qt/src/researchadvisor.cpp tools/apply_research_value_ui.py .github/workflows/apply-research-value-once.yml
          git commit -m "Add data checks experiment advice and pair comparison"
          git push origin ui-linked-catalyst-focus
