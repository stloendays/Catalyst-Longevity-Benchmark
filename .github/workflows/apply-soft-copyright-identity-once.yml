name: Apply Software Copyright Identity Once

on:
  push:
    branches: [ui-linked-catalyst-focus]
    paths:
      - ".github/workflows/apply-soft-copyright-identity-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-linked-catalyst-focus
          fetch-depth: 0

      - name: Apply software identity polish
        run: python tools/apply_soft_copyright_identity.py

      - name: Commit identity changes and cleanup temporary workflows
        shell: bash
        run: |
          git config user.name "stloendays"
          git config user.email "157110190+stloendays@users.noreply.github.com"
          rm -f tools/apply_soft_copyright_identity.py
          rm -f .github/workflows/apply-soft-copyright-identity-once.yml
          rm -f .github/workflows/validate-research-value-once.yml
          git add native/qt/src/mainwindow.cpp native/qt/src/main.cpp native/qt/src/reportexporter.cpp tools/apply_soft_copyright_identity.py .github/workflows/apply-soft-copyright-identity-once.yml .github/workflows/validate-research-value-once.yml
          git commit -m "Polish V1.0 software identity for copyright materials"
          git push origin ui-linked-catalyst-focus
