name: Finalize Zhice UI Once

on:
  push:
    branches: [ui-zhice-final-polish]
    paths:
      - ".github/workflows/finalize-zhice-ui-once.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui-zhice-final-polish
          fetch-depth: 0

      - name: Apply final UI cleanup
        shell: pwsh
        run: python tools/finalize_zhice_ui.py

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true
          modules: "qtpdf"

      - name: Configure and build
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "zhice-build"
          cmake -S native/qt -B $build -G "Visual Studio 17 2022" -A x64
          cmake --build $build --config Release --parallel
          $exe = Join-Path $build "Release\Catalyst Longevity Research.exe"
          if (-not (Test-Path $exe)) { throw "Executable not produced: $exe" }
          "ZHICE_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run native self-test
        shell: pwsh
        run: |
          $test = Start-Process -FilePath $env:ZHICE_EXE -ArgumentList "--self-test" -WorkingDirectory (Split-Path $env:ZHICE_EXE) -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Native self-test failed with exit code $($test.ExitCode)" }

      - name: Smoke-test desktop window
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:ZHICE_EXE -WorkingDirectory (Split-Path $env:ZHICE_EXE) -PassThru
          try {
            Start-Sleep -Seconds 6
            if ($process.HasExited) { throw "Desktop app exited unexpectedly with code $($process.ExitCode)" }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Commit validated source changes
        shell: pwsh
        run: |
          Remove-Item "tools/finalize_zhice_ui.py" -Force
          Remove-Item ".github/workflows/finalize-zhice-ui-once.yml" -Force
          git config user.name "stloendays"
          git config user.email "157110190+stloendays@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { throw "No final UI changes produced" }
          git commit -m "Finalize Zhice native UI details"
          git push origin HEAD:ui-zhice-final-polish
