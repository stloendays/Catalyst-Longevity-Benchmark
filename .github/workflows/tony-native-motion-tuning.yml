name: Tune Tony native animation cadence

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bear-agent-pet
    paths:
      - '.github/scripts/tune_tony_native_motion.py'
      - '.github/workflows/tony-native-motion-tuning.yml'

permissions:
  contents: write

concurrency:
  group: tony-native-motion-tuning
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bear-agent-pet
          fetch-depth: 0

      - name: Restore the last clean native action poses
        shell: bash
        run: |
          set -euo pipefail
          # The later replacements for these three files were byte-corrupted.
          # Restore their earlier complete versions before tightening validation.
          BASE=c9921e19106b2ce4200773b98da71984f65413a0
          for name in celebrate thinking wave; do
            git show "$BASE:bear_agent_pet/client/assets/states/$name.png" > "bear_agent_pet/client/assets/states/$name.png"
          done

      - name: Apply slower native-motion cadence
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/tune_tony_native_motion.py
          python bear_agent_pet/client/tools/validate_state_assets.py
          git diff --check
          grep -F 'animTimer_.setInterval(110);' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -F 'bounded(140000,320001)' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -F 'VERSION 0.9.2' bear_agent_pet/client/CMakeLists.txt

      - name: Commit calmer Tony motion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bear_agent_pet/client/src/PetWindowV7.cpp \
                  bear_agent_pet/client/CMakeLists.txt \
                  bear_agent_pet/client/tools/validate_state_assets.py \
                  bear_agent_pet/client/assets/states/celebrate.png \
                  bear_agent_pet/client/assets/states/thinking.png \
                  bear_agent_pet/client/assets/states/wave.png
          if git diff --cached --quiet; then
            echo 'Tony native-motion tuning is already applied.'
            exit 0
          fi
          git commit -m 'Slow Tony native motion and restore clean poses'
          git pull --rebase origin feature/bear-agent-pet
          git push origin HEAD:feature/bear-agent-pet
