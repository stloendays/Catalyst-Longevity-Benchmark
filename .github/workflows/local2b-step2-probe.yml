name: Local2B Step 2 probe

on:
  push:
    paths:
      - .github/workflows/local2b-step2-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"

      - name: Probe Step-2 benchmark
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== TIME ==='; date -Is
          echo '=== BENCHMARK PROCESS ==='
          ps -eo pid,ppid,user,%cpu,%mem,etime,args | grep -E 'benchmark_tool_use.py|llama-server' | grep -v grep || true
          echo '=== TMP FILES ==='
          ls -lah /tmp/local2b-mcp-step2 2>/dev/null || true
          echo '=== SERVICE ==='
          systemctl is-active rhocodec-llm.service || true
          echo '=== RECENT LLAMA LOG ==='
          journalctl -u rhocodec-llm.service --since '10 minutes ago' --no-pager -n 30 2>/dev/null || true
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
