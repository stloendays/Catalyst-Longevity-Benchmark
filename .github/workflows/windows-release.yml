name: Windows EXE Test Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop_launcher.py"
      - "build/**"
      - "requirements-ui.txt"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: write

concurrency:
  group: catalyst-intelligence-windows-test-release
  cancel-in-progress: true

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ui.txt

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ui.txt pytest pyinstaller

      - name: Run software tests before packaging
        shell: pwsh
        run: |
          python -m compileall -q app.py pages src tests desktop_launcher.py
          python -m pytest -q

      - name: Build single-file Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm build/CatalystIntelligenceWorkspace.spec
          if (-not (Test-Path "dist\Catalyst_Intelligence_Workspace.exe")) {
            throw "Expected Windows executable was not produced."
          }

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $env:CATALYST_DESKTOP_PORT = "8765"
          $env:CATALYST_DESKTOP_HEADLESS = "1"
          $env:CATALYST_DESKTOP_LOG = (Join-Path $PWD "desktop-smoke.log")
          $exe = (Resolve-Path "dist\Catalyst_Intelligence_Workspace.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          $healthy = $false
          try {
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 2
              if ($process.HasExited) {
                if (Test-Path $env:CATALYST_DESKTOP_LOG) {
                  Write-Host "----- desktop launcher log -----"
                  Get-Content $env:CATALYST_DESKTOP_LOG
                  Write-Host "--------------------------------"
                }
                throw "Packaged executable exited before the local server became healthy. Exit code: $($process.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8765/_stcore/health" -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              }
              catch {
                # Server is still starting; keep polling.
              }
            }
            if (-not $healthy) {
              if (Test-Path $env:CATALYST_DESKTOP_LOG) {
                Write-Host "----- desktop launcher log -----"
                Get-Content $env:CATALYST_DESKTOP_LOG
                Write-Host "--------------------------------"
              }
              throw "Packaged executable did not expose a healthy Streamlit server within the timeout."
            }
            Write-Host "Packaged executable smoke test passed."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Prepare release files and checksum
        id: package
        shell: pwsh
        run: |
          $releaseDir = "release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $output = "$releaseDir\Catalyst-Intelligence-Workspace-Windows-Test.exe"
          Copy-Item "dist\Catalyst_Intelligence_Workspace.exe" $output -Force
          $hash = (Get-FileHash -Algorithm SHA256 $output).Hash.ToLower()
          "$hash  $([IO.Path]::GetFileName($output))" | Set-Content "$releaseDir\SHA256SUMS.txt"
          "asset=$output" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=windows-test-$env:GITHUB_RUN_NUMBER" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-Item $output | Select-Object Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catalyst-Intelligence-Workspace-Windows-Test
          path: |
            release/Catalyst-Intelligence-Workspace-Windows-Test.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish private-repository prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Catalyst Intelligence Workspace Windows Test ${{ github.run_number }}
          body: |
            Windows x64 test build for Catalyst Longevity Research / Catalyst Intelligence Workspace.

            The packaged executable passed the repository test suite and a local Streamlit health-check after freezing. API keys remain runtime-only and are not embedded in the executable.
          prerelease: true
          make_latest: false
          files: |
            release/Catalyst-Intelligence-Workspace-Windows-Test.exe
            release/SHA256SUMS.txt
