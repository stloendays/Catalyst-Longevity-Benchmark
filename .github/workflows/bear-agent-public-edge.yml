name: Deploy Tony public WSS edge

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bear-agent-public-edge.yml'

permissions:
  contents: read

concurrency:
  group: tony-public-edge
  cancel-in-progress: false

jobs:
  deploy-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TONY_HOST: 150-158-27-206.sslip.io
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"

      - name: Install Caddy and configure HTTPS/WSS
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          HOST='150-158-27-206.sslip.io'

          if ! command -v caddy >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq caddy
          fi

          sudo tee /etc/caddy/Caddyfile >/dev/null <<CADDY
          ${HOST} {
              encode zstd gzip
              reverse_proxy 127.0.0.1:18790
          }
          CADDY

          if command -v ufw >/dev/null 2>&1 && sudo ufw status | grep -q '^Status: active'; then
            sudo ufw allow 80/tcp
            sudo ufw allow 443/tcp
          fi

          # Keep the application port private. Only Caddy is internet-facing.
          sudo systemctl enable caddy
          sudo systemctl restart caddy
          sudo systemctl is-active --quiet caddy
          sudo systemctl is-active --quiet bear-agent-gateway.service
          ss -ltn | grep -E '(:80 |:443 |127\.0\.0\.1:18790 )' || true
          REMOTE

      - name: Verify public HTTPS endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 5 --max-time 10 "https://${TONY_HOST}/health" >/tmp/tony-public-health.json; then
              cat /tmp/tony-public-health.json
              python3 - <<'PY'
          import json
          d=json.load(open('/tmp/tony-public-health.json'))
          assert d['ok'] is True, d
          assert d['service'] == 'Tony Desktop Companion', d
          assert d['pairing_mode'] == 'reusable-friend-code', d
          print('TONY_PUBLIC_HTTPS=PASS')
          PY
              exit 0
            fi
            sleep 5
          done
          echo 'Public HTTPS did not become reachable. Check the cloud security group for TCP 80/443.' >&2
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
