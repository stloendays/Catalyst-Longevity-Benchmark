name: Finalize upgraded OpenClaw using existing service

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/openclaw-finalize-existing-service.yml

permissions:
  contents: read

concurrency:
  group: openclaw-finalize-existing-service
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"

      - name: Start existing ubuntu Gateway on upgraded runtime
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=30 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          export PATH="/home/ubuntu/.npm-global/bin:$PATH"
          OC='/home/ubuntu/.npm-global/bin/openclaw'

          "$OC" --version | tee /tmp/openclaw-version.txt
          grep -q '2026.9.2' /tmp/openclaw-version.txt
          "$OC" config validate
          sudo systemctl is-active --quiet rhocodec-llm.service
          "$OC" models list --provider llama-cpp | tee /tmp/llama-model-list.txt
          grep -q 'llama-cpp/qwen3.5-2b-q4' /tmp/llama-model-list.txt

          systemctl --user daemon-reload
          "$OC" gateway start --json | tee /tmp/gateway-start.json

          ready=0
          for i in $(seq 1 45); do
            "$OC" gateway status --deep --json >/tmp/gateway-status.json 2>/tmp/gateway-status.err || true
            if python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/gateway-status.json'))
          except Exception:
              raise SystemExit(1)
          runtime=((d.get('service') or {}).get('runtime') or {})
          rpc=d.get('rpc') or {}
          healthy=(d.get('health') or {}).get('healthy')
          version=((rpc.get('server') or {}).get('version'))
          ok=(runtime.get('status') == 'running') and (rpc.get('ok') is True or healthy is True) and version == '2026.9.2'
          raise SystemExit(0 if ok else 1)
          PY
            then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Gateway did not become healthy on the upgraded runtime.'
            cat /tmp/gateway-status.json 2>/dev/null || true
            cat /tmp/gateway-status.err 2>/dev/null || true
            systemctl --user status openclaw-gateway.service --no-pager -l || true
            journalctl --user -u openclaw-gateway.service -n 160 --no-pager || true
            exit 1
          fi

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/gateway-status.json'))
          print('Gateway runtime:', ((d.get('service') or {}).get('runtime') or {}).get('status'))
          print('Gateway RPC:', (d.get('rpc') or {}).get('ok'))
          print('Gateway healthy:', (d.get('health') or {}).get('healthy'))
          print('Gateway version:', ((d.get('rpc') or {}).get('server') or {}).get('version'))
          PY
          REMOTE

      - name: Verify local Qwen through OpenClaw
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=30 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          export PATH="/home/ubuntu/.npm-global/bin:$PATH"
          OC='/home/ubuntu/.npm-global/bin/openclaw'
          MODEL='llama-cpp/qwen3.5-2b-q4'

          echo '=== CURRENT PRIMARY ==='
          "$OC" config get agents.defaults.model --json || true

          echo '=== TRANSPORT PROBE ==='
          "$OC" infer model run --local --model "$MODEL" --prompt 'Reply exactly with: LOCAL_TRANSPORT_OK' --json > /tmp/local-transport.json
          cat /tmp/local-transport.json
          grep -q 'LOCAL_TRANSPORT_OK' /tmp/local-transport.json

          echo '=== GATEWAY PROBE ==='
          "$OC" infer model run --gateway --model "$MODEL" --prompt 'Reply exactly with: LOCAL_GATEWAY_OK' --json > /tmp/local-gateway.json
          cat /tmp/local-gateway.json
          grep -q 'LOCAL_GATEWAY_OK' /tmp/local-gateway.json

          echo '=== LEAN AGENT PROBE ==='
          "$OC" agent exec 'Reply exactly with: OPENCLAW_LOCAL_2B_OK' \
            --model "$MODEL" --code-mode direct --local-model-lean --thinking off --timeout 180 --json > /tmp/local-agent.json
          cat /tmp/local-agent.json
          grep -q 'OPENCLAW_LOCAL_2B_OK' /tmp/local-agent.json
          echo 'OPENCLAW_LOCAL_2B=PASS'
          REMOTE

      - name: Verify removed chat integrations and root instance
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('/home/ubuntu/.openclaw/openclaw.json'))
          terms=('qqbot','openclaw-qqbot','weixin','openclaw-weixin','wechat','wecom','yuanbao','dingtalk','ddingtalk')
          bad=[]
          channels=d.get('channels') if isinstance(d.get('channels'),dict) else {}
          entries=((d.get('plugins') or {}).get('entries') or {}) if isinstance(d.get('plugins'),dict) else {}
          for section,mapping in [('channels',channels),('plugins.entries',entries)]:
              for key in mapping:
                  if any(t in key.lower() for t in terms): bad.append(section+'.'+key)
          assert not bad, bad
          print('Active chat integration config residue: none')
          PY

          residue=$(sudo find /home/ubuntu/.openclaw/extensions /root/.openclaw/extensions -mindepth 1 -maxdepth 1 \
            \( -iname '*qqbot*' -o -iname '*weixin*' -o -iname '*wechat*' -o -iname '*wecom*' -o -iname '*yuanbao*' -o -iname '*dingtalk*' -o -iname '*ddingtalk*' \) -print 2>/dev/null || true)
          test -z "$residue" || { echo "$residue"; exit 1; }
          echo 'External chat extension residue: none'

          ! pgrep -u root -f '^openclaw-gateway$' >/dev/null 2>&1
          ! pgrep -u root -f '^openclaw$' >/dev/null 2>&1
          echo 'Legacy root OpenClaw process: none'

          ! sudo ss -lntp | grep -q ':11931'
          echo 'Legacy port 11931: closed'

          echo '=== FINAL PORTS ==='
          sudo ss -lntp | grep -E '(:18080|:18789|:11931)' || true
          echo '=== FINAL SERVICES ==='
          systemctl --user status openclaw-gateway.service --no-pager -l | head -30
          sudo systemctl status rhocodec-llm.service --no-pager -l | head -25
          echo '=== FINAL RESOURCES ==='
          free -h
          df -h /
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
