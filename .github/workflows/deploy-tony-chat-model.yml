name: Deploy Tony fast chat model

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-tony-chat-model.yml'

permissions:
  contents: read

# Shared with gateway deployment and E2E. A model switch restarts both the local
# model service and gateway, so it must never overlap a conversation test.
concurrency:
  group: tony-server-runtime
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"

      - name: Download Qwen3.5 0.8B and keep Qwen3.5 2B
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT='/opt/rhocodec-llm'
          FAST_MODEL="$ROOT/models/Qwen3.5-0.8B-Q4_0.gguf"
          FAST_TMP="$FAST_MODEL.part"
          QUALITY_MODEL="$ROOT/models/Qwen3.5-2B-Q4_K_M.gguf"
          QUALITY_SHA_FILE="$ROOT/models/.Qwen3.5-2B-Q4_K_M.sha256"
          MIRROR_URL='https://hf-mirror.com/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_0.gguf?download=true'
          OFFICIAL_URL='https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_0.gguf?download=true'

          mkdir -p "$ROOT/models"
          echo '=== PRESERVED QUALITY MODEL ==='
          # The 2B model is a retained asset, not a disposable fallback. This workflow
          # must fail rather than silently proceed if that known model disappears.
          test -s "$QUALITY_MODEL"
          QUALITY_SHA_BEFORE=$(sha256sum "$QUALITY_MODEL" | awk '{print $1}')
          printf '%s\n' "$QUALITY_SHA_BEFORE" > "$QUALITY_SHA_FILE"
          ls -lh "$QUALITY_MODEL"
          echo "Qwen3.5 2B SHA256: $QUALITY_SHA_BEFORE"
          echo 'Qwen3.5 2B Q4 is preserved and will not be deleted.'

          if [ ! -s "$FAST_MODEL" ]; then
            echo 'Downloading Qwen3.5 0.8B Q4_0; mirror first for mainland/Tencent connectivity.'
            download_model() {
              url="$1"
              label="$2"
              echo "Trying $label"
              curl -fL -C - --retry 8 --retry-all-errors --retry-delay 4 \
                --connect-timeout 20 --speed-time 120 --speed-limit 1024 \
                -o "$FAST_TMP" "$url"
            }
            if ! download_model "$MIRROR_URL" 'hf-mirror.com'; then
              echo 'Mirror failed; falling back to official Hugging Face.'
              download_model "$OFFICIAL_URL" 'huggingface.co'
            fi
            test "$(stat -c '%s' "$FAST_TMP")" -gt 500000000
            mv -f "$FAST_TMP" "$FAST_MODEL"
          fi

          echo '=== AVAILABLE TONY MODELS ==='
          test -s "$FAST_MODEL"
          test -s "$QUALITY_MODEL"
          ls -lh "$FAST_MODEL" "$QUALITY_MODEL"
          sha256sum "$FAST_MODEL" "$QUALITY_MODEL"
          test "$(sha256sum "$QUALITY_MODEL" | awk '{print $1}')" = "$QUALITY_SHA_BEFORE"
          echo 'TONY_2B_PRESERVATION=PASS'
          REMOTE

      - name: Install dual-model selector and activate fast mode
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT='/opt/rhocodec-llm'
          ACTIVE_ENV="$ROOT/active-model.env"
          FAST_MODEL="$ROOT/models/Qwen3.5-0.8B-Q4_0.gguf"
          QUALITY_MODEL="$ROOT/models/Qwen3.5-2B-Q4_K_M.gguf"
          QUALITY_SHA_FILE="$ROOT/models/.Qwen3.5-2B-Q4_K_M.sha256"
          GATEWAY_ENV='/home/ubuntu/.local/share/bear-agent/bear-agent.env'

          test -x "$ROOT/bin/llama-server"
          test -s "$FAST_MODEL"
          test -s "$QUALITY_MODEL"
          QUALITY_SHA_BEFORE=$(cat "$QUALITY_SHA_FILE")

          sudo tee /etc/systemd/system/rhocodec-llm.service >/dev/null <<'UNIT'
          [Unit]
          Description=Tony selectable local Qwen chat server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=/opt/rhocodec-llm/bin
          Environment=HOME=/home/ubuntu
          Environment=LD_LIBRARY_PATH=/opt/rhocodec-llm/bin
          EnvironmentFile=/opt/rhocodec-llm/active-model.env
          ExecStart=/opt/rhocodec-llm/bin/llama-server -m ${TONY_MODEL_PATH} -a ${TONY_MODEL_ALIAS} --host 127.0.0.1 --port 18080 -c ${TONY_CONTEXT} -t 4 -b ${TONY_BATCH} -ub ${TONY_UBATCH} --parallel 1 --jinja --reasoning-budget 0 --no-webui
          Restart=on-failure
          RestartSec=3
          TimeoutStartSec=180
          LimitNOFILE=65535

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo tee /usr/local/bin/tony-model >/dev/null <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT='/opt/rhocodec-llm'
          ACTIVE_ENV="$ROOT/active-model.env"
          GATEWAY_ENV='/home/ubuntu/.local/share/bear-agent/bear-agent.env'
          FAST_MODEL="$ROOT/models/Qwen3.5-0.8B-Q4_0.gguf"
          QUALITY_MODEL="$ROOT/models/Qwen3.5-2B-Q4_K_M.gguf"

          set_gateway_env() {
            key="$1"; value="$2"
            [ -f "$GATEWAY_ENV" ] || return 0
            if grep -q "^${key}=" "$GATEWAY_ENV"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$GATEWAY_ENV"
            else
              printf '%s=%s\n' "$key" "$value" >> "$GATEWAY_ENV"
            fi
          }

          show_status() {
            echo '=== Tony model selector ==='
            cat "$ACTIVE_ENV" 2>/dev/null || true
            echo '=== Model files ==='
            ls -lh "$FAST_MODEL" "$QUALITY_MODEL" 2>/dev/null || true
            echo '=== Runtime ==='
            curl -fsS --max-time 3 http://127.0.0.1:18080/v1/models 2>/dev/null || true
            echo
          }

          case "${1:-status}" in
            fast|0.8b|08b)
              test -s "$FAST_MODEL"
              cat > "$ACTIVE_ENV" <<EOF
          TONY_MODEL_PATH=$FAST_MODEL
          TONY_MODEL_ALIAS=tony-qwen3.5-0.8b-q4
          TONY_CONTEXT=1024
          TONY_BATCH=64
          TONY_UBATCH=64
          EOF
              set_gateway_env BEAR_LOCAL_MODEL tony-qwen3.5-0.8b-q4
              set_gateway_env BEAR_LOCAL_MODEL_TIMEOUT 35
              set_gateway_env BEAR_LOCAL_MAX_TOKENS 48
              MODE='fast / Qwen3.5 0.8B Q4'
              ;;
            quality|2b)
              test -s "$QUALITY_MODEL"
              cat > "$ACTIVE_ENV" <<EOF
          TONY_MODEL_PATH=$QUALITY_MODEL
          TONY_MODEL_ALIAS=tony-qwen3.5-2b-q4
          TONY_CONTEXT=1536
          TONY_BATCH=64
          TONY_UBATCH=64
          EOF
              set_gateway_env BEAR_LOCAL_MODEL tony-qwen3.5-2b-q4
              # 2B is deliberately kept as the slower quality profile on this CPU host.
              set_gateway_env BEAR_LOCAL_MODEL_TIMEOUT 150
              set_gateway_env BEAR_LOCAL_MAX_TOKENS 48
              MODE='quality / Qwen3.5 2B Q4'
              ;;
            status)
              show_status
              exit 0
              ;;
            *)
              echo 'Usage: tony-model {fast|0.8b|quality|2b|status}' >&2
              exit 2
              ;;
          esac

          echo "Switching Tony to $MODE"
          sudo systemctl daemon-reload
          sudo systemctl enable rhocodec-llm.service >/dev/null
          sudo systemctl restart rhocodec-llm.service

          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/v1/models >/tmp/tony-models.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          cat /tmp/tony-models.json

          if systemctl list-unit-files bear-agent-gateway.service >/dev/null 2>&1; then
            sudo systemctl restart bear-agent-gateway.service || true
          fi
          show_status
          SCRIPT
          sudo chmod 0755 /usr/local/bin/tony-model
          sudo chown ubuntu:ubuntu "$ROOT"
          sudo chown ubuntu:ubuntu "$ROOT/models" "$FAST_MODEL"
          sudo chown ubuntu:ubuntu "$QUALITY_MODEL"
          sudo touch "$ACTIVE_ENV"
          sudo chown ubuntu:ubuntu "$ACTIVE_ENV"

          /usr/local/bin/tony-model fast

          # Switching to fast is not allowed to mutate or replace the retained 2B file.
          test "$(sha256sum "$QUALITY_MODEL" | awk '{print $1}')" = "$QUALITY_SHA_BEFORE"
          echo 'TONY_2B_AFTER_FAST_SWITCH=PASS'

          echo '=== FAST LATENCY SMOKE ==='
          python3 - <<'PY'
          import json, time, urllib.request
          payload={
            'model':'tony-qwen3.5-0.8b-q4',
            'messages':[
              {'role':'system','content':"You are Tony, Paula's cute teddy-bear-like boyfriend. Speak only short natural English."},
              {'role':'user','content':'Paula says: I missed you. Reply in one short sentence.\n/no_think'}
            ],
            'temperature':0.8,
            'top_p':0.9,
            'max_tokens':32,
            'stream':False,
            'reasoning_budget':0,
            'chat_template_kwargs':{'enable_thinking':False},
          }
          req=urllib.request.Request('http://127.0.0.1:18080/v1/chat/completions',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
          start=time.monotonic()
          with urllib.request.urlopen(req,timeout=45) as r:
              data=json.load(r)
          elapsed=time.monotonic()-start
          text=str(((data.get('choices') or [{}])[0].get('message') or {}).get('content') or '').strip()
          assert text, data
          assert not any('\u4e00' <= ch <= '\u9fff' for ch in text), text
          assert elapsed < 45, elapsed
          print('TONY_FAST_MODEL=PASS')
          print('LATENCY_SEC=',round(elapsed,2))
          print('SAMPLE=',text[:240].replace('\n',' '))
          PY

          echo '=== FINAL MODEL INVENTORY ==='
          test -s "$FAST_MODEL"
          test -s "$QUALITY_MODEL"
          ls -lh "$FAST_MODEL" "$QUALITY_MODEL"
          echo 'TONY_DUAL_MODEL_INVENTORY=PASS'
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
