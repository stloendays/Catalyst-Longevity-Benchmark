name: Deploy Tony fast chat model

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-tony-chat-model.yml'

permissions:
  contents: read

concurrency:
  group: tony-server-runtime
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"

      - name: Verify both Tony models and install selector
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT='/opt/rhocodec-llm'
          FAST_MODEL="$ROOT/models/Qwen3.5-0.8B-Q4_0.gguf"
          FAST_TMP="$FAST_MODEL.part"
          QUALITY_MODEL="$ROOT/models/Qwen3.5-2B-Q4_K_M.gguf"
          QUALITY_SHA_FILE="$ROOT/models/.Qwen3.5-2B-Q4_K_M.sha256"
          GATEWAY_ENV='/home/ubuntu/.local/share/bear-agent/bear-agent.env'
          OLD_DROPIN='/etc/systemd/system/rhocodec-llm.service.d/openclaw.conf'
          BACKUP_DIR="$ROOT/systemd-backups"
          MIRROR_URL='https://hf-mirror.com/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_0.gguf?download=true'
          OFFICIAL_URL='https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_0.gguf?download=true'

          test -x "$ROOT/bin/llama-server"
          test -s "$QUALITY_MODEL"
          QUALITY_SHA=$(sha256sum "$QUALITY_MODEL" | awk '{print $1}')
          printf '%s\n' "$QUALITY_SHA" > "$QUALITY_SHA_FILE"

          if [ ! -s "$FAST_MODEL" ]; then
            echo 'Fast model missing; downloading without touching the 2B quality model.'
            if ! curl -fL -C - --retry 8 --retry-all-errors --retry-delay 4 \
              --connect-timeout 20 --speed-time 120 --speed-limit 1024 \
              -o "$FAST_TMP" "$MIRROR_URL"; then
              curl -fL -C - --retry 8 --retry-all-errors --retry-delay 4 \
                --connect-timeout 20 --speed-time 120 --speed-limit 1024 \
                -o "$FAST_TMP" "$OFFICIAL_URL"
            fi
            test "$(stat -c '%s' "$FAST_TMP")" -gt 500000000
            mv -f "$FAST_TMP" "$FAST_MODEL"
          fi
          test -s "$FAST_MODEL"
          test "$(sha256sum "$QUALITY_MODEL" | awk '{print $1}')" = "$QUALITY_SHA"
          echo 'TONY_2B_PRESERVATION=PASS'

          if [ -f "$OLD_DROPIN" ]; then
            sudo mkdir -p "$BACKUP_DIR"
            sudo cp -a "$OLD_DROPIN" "$BACKUP_DIR/openclaw.conf.hardcoded-2b.disabled"
            sudo rm -f "$OLD_DROPIN"
          fi

          sudo tee /etc/systemd/system/rhocodec-llm.service >/dev/null <<'UNIT'
          [Unit]
          Description=Tony selectable local Qwen chat server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=/opt/rhocodec-llm/bin
          Environment=HOME=/home/ubuntu
          Environment=LD_LIBRARY_PATH=/opt/rhocodec-llm/bin
          EnvironmentFile=/opt/rhocodec-llm/active-model.env
          ExecStart=/opt/rhocodec-llm/bin/llama-server -m ${TONY_MODEL_PATH} -a ${TONY_MODEL_ALIAS} --host 127.0.0.1 --port 18080 -c ${TONY_CONTEXT} -t 4 -b ${TONY_BATCH} -ub ${TONY_UBATCH} --parallel 1 --jinja --reasoning-budget 0 --no-webui
          Restart=on-failure
          RestartSec=3
          TimeoutStartSec=180
          LimitNOFILE=65535

          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo systemctl daemon-reload

          sudo tee /usr/local/bin/tony-model >/dev/null <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT='/opt/rhocodec-llm'
          ACTIVE_ENV="$ROOT/active-model.env"
          GATEWAY_ENV='/home/ubuntu/.local/share/bear-agent/bear-agent.env'
          FAST_MODEL="$ROOT/models/Qwen3.5-0.8B-Q4_0.gguf"
          QUALITY_MODEL="$ROOT/models/Qwen3.5-2B-Q4_K_M.gguf"

          set_gateway_env() {
            key="$1"; value="$2"
            [ -f "$GATEWAY_ENV" ] || return 0
            if grep -q "^${key}=" "$GATEWAY_ENV"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$GATEWAY_ENV"
            else
              printf '%s=%s\n' "$key" "$value" >> "$GATEWAY_ENV"
            fi
          }

          case "${1:-status}" in
            fast|0.8b|08b)
              test -s "$FAST_MODEL"
              cat > "$ACTIVE_ENV" <<EOF
          TONY_MODEL_PATH=$FAST_MODEL
          TONY_MODEL_ALIAS=tony-qwen3.5-0.8b-q4
          TONY_CONTEXT=768
          TONY_BATCH=128
          TONY_UBATCH=128
          EOF
              set_gateway_env BEAR_LOCAL_MODEL tony-qwen3.5-0.8b-q4
              set_gateway_env BEAR_LOCAL_MODEL_TIMEOUT 60
              set_gateway_env BEAR_LOCAL_MAX_TOKENS 20
              EXPECTED_ALIAS='tony-qwen3.5-0.8b-q4'
              EXPECTED_PATH="$FAST_MODEL"
              EXPECTED_PROFILE='fast'
              ;;
            quality|2b)
              test -s "$QUALITY_MODEL"
              cat > "$ACTIVE_ENV" <<EOF
          TONY_MODEL_PATH=$QUALITY_MODEL
          TONY_MODEL_ALIAS=tony-qwen3.5-2b-q4
          TONY_CONTEXT=1536
          TONY_BATCH=64
          TONY_UBATCH=64
          EOF
              set_gateway_env BEAR_LOCAL_MODEL tony-qwen3.5-2b-q4
              set_gateway_env BEAR_LOCAL_MODEL_TIMEOUT 150
              set_gateway_env BEAR_LOCAL_MAX_TOKENS 20
              EXPECTED_ALIAS='tony-qwen3.5-2b-q4'
              EXPECTED_PATH="$QUALITY_MODEL"
              EXPECTED_PROFILE='quality'
              ;;
            status)
              cat "$ACTIVE_ENV" 2>/dev/null || true
              curl -fsS --max-time 3 http://127.0.0.1:18080/v1/models || true
              echo
              curl -fsS --max-time 3 http://127.0.0.1:18790/health || true
              echo
              exit 0
              ;;
            *)
              echo 'Usage: tony-model {fast|0.8b|quality|2b|status}' >&2
              exit 2
              ;;
          esac

          sudo systemctl daemon-reload
          sudo systemctl enable rhocodec-llm.service >/dev/null
          sudo systemctl stop rhocodec-llm.service || true
          for i in $(seq 1 30); do
            if ! curl -fsS --max-time 1 http://127.0.0.1:18080/v1/models >/dev/null 2>&1; then break; fi
            sleep 1
          done
          sudo systemctl start rhocodec-llm.service

          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/v1/models >/tmp/tony-models.json 2>/dev/null; then
              if python3 - "$EXPECTED_ALIAS" "$EXPECTED_PROFILE" <<'PY'
          import json,sys
          alias,profile=sys.argv[1:3]
          d=json.load(open('/tmp/tony-models.json'))
          row=(d.get('data') or [{}])[0]
          if row.get('id') != alias: raise SystemExit(1)
          n=int(((row.get('meta') or {}).get('n_params')) or 0)
          if profile == 'fast' and n and n >= 1_200_000_000: raise SystemExit(1)
          if profile == 'quality' and n and n <= 1_500_000_000: raise SystemExit(1)
          PY
              then ready=1; break; fi
            fi
            sleep 2
          done
          test "$ready" -eq 1

          PID=$(systemctl show rhocodec-llm.service -p MainPID --value)
          test -n "$PID"; test "$PID" != 0
          CMD=$(tr '\0' ' ' < "/proc/$PID/cmdline")
          printf '%s' "$CMD" | grep -F -- "$EXPECTED_PATH" >/dev/null
          printf '%s' "$CMD" | grep -F -- "$EXPECTED_ALIAS" >/dev/null

          if systemctl list-unit-files bear-agent-gateway.service >/dev/null 2>&1; then
            sudo systemctl restart bear-agent-gateway.service
            for i in $(seq 1 30); do
              if curl -fsS --max-time 3 http://127.0.0.1:18790/health >/tmp/tony-health.json 2>/dev/null; then
                if python3 - "$EXPECTED_ALIAS" "$EXPECTED_PROFILE" <<'PY'
          import json,sys
          alias,profile=sys.argv[1:3]
          d=json.load(open('/tmp/tony-health.json'))
          raise SystemExit(0 if d.get('local_model')==alias and d.get('model_profile')==profile else 1)
          PY
                then break; fi
              fi
              sleep 1
            done
          fi
          SCRIPT
          sudo chmod 0755 /usr/local/bin/tony-model
          sudo touch "$ROOT/active-model.env"
          sudo chown ubuntu:ubuntu "$ROOT/active-model.env" "$FAST_MODEL" "$QUALITY_MODEL"

          echo '=== VERIFY QUALITY PROFILE ==='
          /usr/local/bin/tony-model quality
          test "$(sha256sum "$QUALITY_MODEL" | awk '{print $1}')" = "$QUALITY_SHA"
          echo 'TONY_QUALITY_RUNTIME_SWITCH=PASS'

          echo '=== RESTORE FAST DEFAULT ==='
          /usr/local/bin/tony-model fast
          test "$(sha256sum "$QUALITY_MODEL" | awk '{print $1}')" = "$QUALITY_SHA"
          echo 'TONY_2B_AFTER_FAST_SWITCH=PASS'

          echo '=== FAST 20-TOKEN SMOKE ==='
          python3 - <<'PY'
          import json,time,urllib.request
          models=json.load(urllib.request.urlopen('http://127.0.0.1:18080/v1/models',timeout=5))
          row=(models.get('data') or [{}])[0]
          assert row.get('id')=='tony-qwen3.5-0.8b-q4',row
          n=int(((row.get('meta') or {}).get('n_params')) or 0)
          assert not n or n < 1_200_000_000,row
          payload={
            'model':'tony-qwen3.5-0.8b-q4',
            'messages':[
              {'role':'system','content':"You are Tony, Paula's cute boyfriend. Reply only in short natural English."},
              {'role':'user','content':'Paula says: I missed you. Reply in one short sentence.\n/no_think'}],
            'temperature':0.78,'top_p':0.88,'max_tokens':20,'stream':False,
            'reasoning_budget':0,'chat_template_kwargs':{'enable_thinking':False}}
          req=urllib.request.Request('http://127.0.0.1:18080/v1/chat/completions',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
          start=time.monotonic()
          with urllib.request.urlopen(req,timeout=60) as r: data=json.load(r)
          elapsed=time.monotonic()-start
          text=str(((data.get('choices') or [{}])[0].get('message') or {}).get('content') or '').strip()
          assert text,data
          assert not any('\u4e00' <= c <= '\u9fff' for c in text),text
          print('TONY_FAST_MODEL=PASS')
          print('FAST_RUNTIME_PARAMS=',n)
          print('LATENCY_SEC=',round(elapsed,2))
          print('SAMPLE=',text[:200].replace('\n',' '))
          PY

          test -s "$FAST_MODEL"; test -s "$QUALITY_MODEL"
          test "$(sha256sum "$QUALITY_MODEL" | awk '{print $1}')" = "$QUALITY_SHA"
          echo 'TONY_DUAL_MODEL_INVENTORY=PASS'
          echo 'TONY_FINAL_DEFAULT_PROFILE=FAST'
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
