name: Server transfer size

on:
  push:
    paths:
      - .github/workflows/server-transfer-size.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"
      - name: Read Stage 3A training state
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          echo '=== TIME ==='; date -Is
          echo '=== FILES ==='; ls -lh /home/ubuntu/local2b-training/step3a 2>/dev/null || true
          echo '=== LOG ==='; tail -60 /home/ubuntu/local2b-training/step3a/train.log 2>/dev/null || true
          echo '=== PROCESS ==='; ps -eo pid,user,%cpu,%mem,etime,args | grep -E 'llama-finetune-lora|llama-server' | grep -v grep || true
          echo '=== MEMORY ==='; free -h
          echo '=== SERVICE ==='; systemctl is-active rhocodec-llm.service || true
          REMOTE
      - name: Remove key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
