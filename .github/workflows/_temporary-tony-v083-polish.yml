name: Polish Tony V0.8.3 desktop behavior

on:
  push:
    branches:
      - feature/teddy-agent-pet-v083
    paths:
      - .github/workflows/_temporary-tony-v083-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/teddy-agent-pet-v083
      - run: python3 .github/scripts/polish_tony_desktop_v083.py
      - run: git diff --check
      - name: Commit polish
        run: |
          git config user.name 'Tony'
          git config user.email '157110190+stloendays@users.noreply.github.com'
          git add teddy_agent_pet/client/src/PetWindowV7.cpp
          git commit -m 'Polish Tony V0.8.3 desktop physics interactions'
          git push origin HEAD:feature/teddy-agent-pet-v083
