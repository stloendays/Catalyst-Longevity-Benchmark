name: Tony v0.9.8 TLS recover

on:
  workflow_dispatch:
  push:
    branches:
      - fix/tony-v098-icon-connection
    paths:
      - .github/workflows/tony-v098-tls-recover.yml

permissions:
  contents: read

jobs:
  recover-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TONY_SERVER_IP: 150.158.27.206
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          printf '%s\n' "$SERVER_SSH_KEY" > "$RUNNER_TEMP/tony_server_key"
          chmod 600 "$RUNNER_TEMP/tony_server_key"
          echo "TONY_SSH_KEY=$RUNNER_TEMP/tony_server_key" >> "$GITHUB_ENV"

      - name: Install issued trusted IP certificate into Caddy
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/install_tony_ip_tls.sh" <<'REMOTE'
          set -euo pipefail
          IP='150.158.27.206'
          CERTBOT='/opt/tony-certbot/bin/certbot'
          LIVE="/etc/letsencrypt/live/$IP"

          sudo test -x "$CERTBOT"
          sudo test -s "$LIVE/fullchain.pem"
          sudo test -s "$LIVE/privkey.pem"

          sudo install -d -o caddy -g caddy -m 750 /etc/caddy/tony-tls
          sudo install -o caddy -g caddy -m 644 "$LIVE/fullchain.pem" /etc/caddy/tony-tls/fullchain.pem
          sudo install -o caddy -g caddy -m 600 "$LIVE/privkey.pem" /etc/caddy/tony-tls/privkey.pem

          printf '%s\n' \
            "https://$IP {" \
            '    tls /etc/caddy/tony-tls/fullchain.pem /etc/caddy/tony-tls/privkey.pem' \
            '    encode zstd gzip' \
            '    reverse_proxy 127.0.0.1:18790' \
            '}' | sudo tee /etc/caddy/Caddyfile >/dev/null

          sudo caddy fmt --overwrite /etc/caddy/Caddyfile
          sudo caddy validate --config /etc/caddy/Caddyfile
          sudo systemctl restart caddy
          sleep 3
          sudo systemctl is-active caddy

          echo '=== CERTIFICATE ==='
          sudo openssl x509 -in /etc/caddy/tony-tls/fullchain.pem -noout -subject -issuer -dates -ext subjectAltName
          echo '=== CADDYFILE ==='
          sudo cat /etc/caddy/Caddyfile
          echo '=== LOCAL HTTPS ==='
          curl -fsS --max-time 10 "https://$IP/health"
          REMOTE
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -i "$TONY_SSH_KEY" "ubuntu@$TONY_SERVER_IP" 'bash -s' < "$RUNNER_TEMP/install_tony_ip_tls.sh"

      - name: Install automatic IP certificate renewal
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/install_renewal.sh" <<'REMOTE'
          set -euo pipefail
          sudo tee /usr/local/sbin/tony-renew-ip-cert >/dev/null <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          IP='150.158.27.206'
          CERTBOT='/opt/tony-certbot/bin/certbot'
          LIVE="/etc/letsencrypt/live/$IP"
          systemctl stop caddy
          start_caddy() { systemctl start caddy >/dev/null 2>&1 || true; }
          trap start_caddy EXIT
          "$CERTBOT" renew --quiet
          install -o caddy -g caddy -m 644 "$LIVE/fullchain.pem" /etc/caddy/tony-tls/fullchain.pem
          install -o caddy -g caddy -m 600 "$LIVE/privkey.pem" /etc/caddy/tony-tls/privkey.pem
          systemctl start caddy
          trap - EXIT
          SCRIPT
          sudo chmod 750 /usr/local/sbin/tony-renew-ip-cert

          sudo tee /etc/systemd/system/tony-ip-cert-renew.service >/dev/null <<'UNIT'
          [Unit]
          Description=Renew Tony public IP TLS certificate
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/tony-renew-ip-cert
          UNIT

          sudo tee /etc/systemd/system/tony-ip-cert-renew.timer >/dev/null <<'TIMER'
          [Unit]
          Description=Renew Tony public IP TLS certificate every 3 days

          [Timer]
          OnBootSec=12h
          OnUnitActiveSec=3d
          RandomizedDelaySec=30m
          Persistent=true

          [Install]
          WantedBy=timers.target
          TIMER

          sudo systemctl daemon-reload
          sudo systemctl enable --now tony-ip-cert-renew.timer
          systemctl list-timers --all tony-ip-cert-renew.timer --no-pager
          REMOTE
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -i "$TONY_SSH_KEY" "ubuntu@$TONY_SERVER_IP" 'bash -s' < "$RUNNER_TEMP/install_renewal.sh"

      - name: Verify trusted public HTTPS directly by IP
        shell: bash
        run: |
          set -euo pipefail
          timeout 8 bash -c "</dev/tcp/$TONY_SERVER_IP/443"
          echo PUBLIC_TCP_443=OPEN
          curl -fsS --max-time 20 "https://$TONY_SERVER_IP/health" | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          echo PUBLIC_IP_HTTPS_HEALTH=PASS
