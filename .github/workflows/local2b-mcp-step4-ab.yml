name: Local2B MCP Step 4 LoRA A/B benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/local2b-mcp-step4-ab.yml

permissions:
  contents: read

concurrency:
  group: local2b-server-lora-training
  cancel-in-progress: false

jobs:
  ab-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Step 3 branch
        uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"

      - name: Copy frozen benchmark code to server
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 \
            'rm -rf /tmp/local2b-mcp-step4 && mkdir -p /tmp/local2b-mcp-step4'
          scp -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" \
            training/local2b_mcp/generate_stage2_dataset.py \
            training/local2b_mcp/benchmark_tool_use.py \
            training/local2b_mcp/validate_dataset.py \
            ubuntu@150.158.27.206:/tmp/local2b-mcp-step4/

      - name: Regenerate and freeze-check Step 2 test set
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=30 -o ConnectTimeout=15 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT=/tmp/local2b-mcp-step4
          cd "$ROOT"
          rm -rf dataset
          python3 generate_stage2_dataset.py \
            --out dataset \
            --train 16000 \
            --val 1600 \
            --test 1600 \
            --seed 20260908
          python3 validate_dataset.py dataset
          TRAIN_SHA=$(sha256sum dataset/train.jsonl | awk '{print $1}')
          VAL_SHA=$(sha256sum dataset/val.jsonl | awk '{print $1}')
          TEST_SHA=$(sha256sum dataset/test.jsonl | awk '{print $1}')
          test "$TRAIN_SHA" = d2f3ec25be2599642f6355dcec997b55039137e60d9f0fb618ce18b0a7a42303
          test "$VAL_SHA" = 89e4aca2f72fc4efd6bab0a88299a68a32cd637edc0561d7d2c95b2b27463990
          test "$TEST_SHA" = 460b5308f6791eb53692fc0736a53e6f6b553a925207caa34517b456e28d78f2
          cp dataset/manifest.json step2-manifest.json
          printf 'TRAIN_SHA256=%s\nVAL_SHA256=%s\nTEST_SHA256=%s\n' "$TRAIN_SHA" "$VAL_SHA" "$TEST_SHA" | tee frozen-data-sha.txt
          REMOTE

      - name: Run Stage 3B LoRA on identical 80-record benchmark
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -o ConnectTimeout=15 \
            -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT=/tmp/local2b-mcp-step4
          MODEL=/opt/rhocodec-llm/models/Qwen3.5-2B-Q4_K_M.gguf
          MODEL_SHA_EXPECTED=d6bd9f4175302658c1d704e44858842606652bbe53c56cd542e31ff10d0cfd58
          ADAPTER=/opt/rhocodec-llm/adapters/local2b-mcp-step3b-r4-qv.gguf
          ADAPTER_SHA_EXPECTED=177dafa0114e5f41f7bb4fe518be8a6e2dfbc998ca86687287bb7d2f0dd72502
          SERVER=/opt/rhocodec-llm/bin/llama-server
          PORT=18081
          ALIAS=qwen3.5-2b-q4-stage3b
          SERVER_LOG="$ROOT/stage3b-server.log"
          SERVER_PID=""

          test -s "$MODEL"
          test -s "$ADAPTER"
          test -x "$SERVER"
          test "$(sha256sum "$MODEL" | awk '{print $1}')" = "$MODEL_SHA_EXPECTED"
          test "$(sha256sum "$ADAPTER" | awk '{print $1}')" = "$ADAPTER_SHA_EXPECTED"
          "$SERVER" --help 2>&1 | grep -q -- '--lora'

          restore_base() {
            if [ -n "$SERVER_PID" ]; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
            sudo systemctl start rhocodec-llm.service || true
          }
          trap restore_base EXIT INT TERM

          sudo systemctl stop rhocodec-llm.service
          "$SERVER" \
            -m "$MODEL" \
            --lora "$ADAPTER" \
            --alias "$ALIAS" \
            --host 127.0.0.1 --port "$PORT" \
            -c 16384 -t 4 -b 128 -ub 128 --parallel 1 \
            --jinja --reasoning-budget 0 --no-webui \
            >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!

          READY=0
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${PORT}/v1/models" > "$ROOT/stage3b-models.json" 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            tail -160 "$SERVER_LOG" || true
            exit 20
          fi

          python3 - "$ROOT/stage3b-models.json" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1], encoding='utf-8'))
          rows=payload.get('data') or []
          assert rows and rows[0].get('id') == 'qwen3.5-2b-q4-stage3b', payload
          print('STAGE3B_ENDPOINT=PASS')
          PY

          cd "$ROOT"
          python3 benchmark_tool_use.py \
            --dataset dataset/test.jsonl \
            --endpoint "http://127.0.0.1:${PORT}/v1/chat/completions" \
            --model "$ALIAS" \
            --limit 80 \
            --max-tokens 192 \
            --timeout 120 \
            --out stage3b-lora-benchmark.json

          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          SERVER_PID=""
          sudo systemctl start rhocodec-llm.service
          BASE_HEALTHY=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/v1/models > "$ROOT/base-models-after.json" 2>/dev/null; then
              BASE_HEALTHY=1
              break
            fi
            sleep 1
          done
          test "$BASE_HEALTHY" -eq 1
          systemctl is-active --quiet rhocodec-llm.service
          printf 'stage3b_adapter_sha256=%s\nbase_service_after=HEALTHY\n' "$ADAPTER_SHA_EXPECTED" | tee "$ROOT/runtime-status.txt"
          trap - EXIT INT TERM
          REMOTE

      - name: Collect LoRA benchmark evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/local2b-mcp-step4
          for f in stage3b-lora-benchmark.json step2-manifest.json frozen-data-sha.txt runtime-status.txt stage3b-models.json base-models-after.json stage3b-server.log; do
            scp -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" \
              "ubuntu@150.158.27.206:/tmp/local2b-mcp-step4/$f" \
              build/local2b-mcp-step4/ || true
          done

      - name: Compare frozen Base Q4 against Stage 3B LoRA
        if: always()
        run: |
          set -euo pipefail
          test -s build/local2b-mcp-step4/stage3b-lora-benchmark.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path('training/local2b_mcp/baselines/base_q4_step2.json').read_text())
          lora = json.loads(Path('build/local2b-mcp-step4/stage3b-lora-benchmark.json').read_text())
          bm = base['metrics']
          lm = lora['metrics']

          keys = [
              'tool_gate_accuracy',
              'tool_sequence_exact_accuracy',
              'call_exact_accuracy',
              'valid_argument_shape_rate',
              'no_tool_precision',
              'false_tool_call_rate',
              'api_or_parse_error_rate',
              'mean_latency_s',
          ]
          lower_better = {'false_tool_call_rate', 'api_or_parse_error_rate', 'mean_latency_s'}
          metrics = {}
          for key in keys:
              b = bm.get(key)
              l = lm.get(key)
              metrics[key] = {
                  'base': b,
                  'stage3b_lora': l,
                  'delta': None if b is None or l is None else l - b,
                  'direction': 'lower_is_better' if key in lower_better else 'higher_is_better',
              }

          required_nonregression = (
              lm['api_or_parse_error_rate'] == 0
              and lm['tool_gate_accuracy'] >= bm['tool_gate_accuracy']
              and lm['call_exact_accuracy'] >= bm['call_exact_accuracy']
              and lm['no_tool_precision'] >= bm['no_tool_precision']
              and lm['false_tool_call_rate'] <= bm['false_tool_call_rate']
          )
          strict_gain = (
              lm['tool_gate_accuracy'] > bm['tool_gate_accuracy']
              or lm['call_exact_accuracy'] > bm['call_exact_accuracy']
              or lm['no_tool_precision'] > bm['no_tool_precision']
              or lm['false_tool_call_rate'] < bm['false_tool_call_rate']
          )
          promote = bool(required_nonregression and strict_gain)

          report = {
              'benchmark': 'local2b_mcp_step4_frozen_ab_v1',
              'base_source': 'training/local2b_mcp/baselines/base_q4_step2.json',
              'stage3b_adapter_sha256': '177dafa0114e5f41f7bb4fe518be8a6e2dfbc998ca86687287bb7d2f0dd72502',
              'records': lora.get('records_loaded'),
              'counts': lora.get('counts'),
              'metrics': metrics,
              'by_task_type': lora.get('by_task_type'),
              'promote_recommended': promote,
              'promotion_rule': 'zero parse/API errors; tool gate, exact call, no-tool non-regression; false-tool-call non-regression; at least one strict primary gain',
          }
          Path('build/local2b-mcp-step4/comparison.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n')

          def pct(x):
              return f'{100*x:.2f}%' if x is not None else 'n/a'
          def delta_pp(x):
              return f'{100*x:+.2f} pp' if x is not None else 'n/a'

          lines = [
              '# Local2B Step 4: Base Q4 vs Stage 3B LoRA',
              '',
              '| Metric | Base Q4 | Stage 3B LoRA | Delta |',
              '|---|---:|---:|---:|',
          ]
          for key in keys[:-1]:
              row=metrics[key]
              lines.append(f"| {key} | {pct(row['base'])} | {pct(row['stage3b_lora'])} | {delta_pp(row['delta'])} |")
          latency=metrics['mean_latency_s']
          lines.append(f"| mean_latency_s | {latency['base']:.3f} | {latency['stage3b_lora']:.3f} | {latency['delta']:+.3f} s |")
          lines += ['', f"**PROMOTE_RECOMMENDED={'true' if promote else 'false'}**", '']
          Path('build/local2b-mcp-step4/summary.md').write_text('\n'.join(lines))
          print('\n'.join(lines))
          PY
          cat build/local2b-mcp-step4/comparison.json
          cat build/local2b-mcp-step4/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Step 4 A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local2b-mcp-step4-stage3b-ab
          path: build/local2b-mcp-step4/
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
