name: Apply Reference Knowledge Base Once

on:
  push:
    branches: [real-reference-kb-feasible-advice]
    paths:
      - ".github/workflows/apply-reference-kb-advice-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-reference-kb-feasible-advice
          fetch-depth: 0
      - name: Apply planning constraints
        run: python tools/apply_planning_constraints.py
      - name: Commit planning constraint integration
        shell: bash
        run: |
          git config user.name "stloendays"
          git config user.email "157110190+stloendays@users.noreply.github.com"
          git add native/qt/src/researchadvisor.cpp native/qt/src/mainwindow.cpp native/qt/src/mainwindow.h native/qt/src/reportexporter.cpp native/qt/src/reportexporter.h
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Add experiment planning constraints to advice"
            git push origin HEAD:real-reference-kb-feasible-advice
          fi
