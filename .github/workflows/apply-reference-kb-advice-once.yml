name: Apply Reference Knowledge Base Once

on:
  push:
    branches: [real-reference-kb-feasible-advice]
    paths:
      - ".github/workflows/apply-reference-kb-advice-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-reference-kb-feasible-advice
          fetch-depth: 0
      - name: Enforce planning caps
        run: python tools/fix_planning_constraint_caps.py
      - name: Commit planning cap fix
        shell: bash
        run: |
          git config user.name "stloendays"
          git config user.email "157110190+stloendays@users.noreply.github.com"
          git add native/qt/src/researchadvisor.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Enforce experiment planning stage caps"
            git push origin HEAD:real-reference-kb-feasible-advice
          fi
