name: Tony v0.9.8.1 visual convergence

on:
  push:
    branches:
      - fix/tony-v0981-visual-convergence
    paths:
      - '.github/workflows/tony-v0981-visual-convergence.yml'
      - '.github/tony_assets_bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tony-v0981-visual-convergence
          fetch-depth: 0

      - name: Detect already-converged branch
        id: state
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n ' < bear_agent_pet/client/VERSION)
          if [ "$version" = '0.9.8.1' ] && [ ! -f '.github/tony_assets_bootstrap/chunk_00' ]; then
            echo 'done=true' >> "$GITHUB_OUTPUT"
            echo 'TONY_V0981_ALREADY_CONVERGED=PASS'
          else
            test "$version" = '0.9.8'
            test -f '.github/tony_assets_bootstrap/chunk_00'
            echo 'done=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify networked v0.9.8 base
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'wss://150.158.27.206/agent/ws' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -q 'authoredAlias="pat"' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -q 'authoredAlias="lifted"' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -q 'authoredAlias="landing"' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -q 'authoredAlias="dizzy"' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -q 'authoredAlias="stretch"' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -q 'authoredAlias="yawn"' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -q 'authoredAlias="cursor_watch"' bear_agent_pet/client/src/PetWindowV7.cpp
          echo 'TONY_V0981_BASE=PASS'

      - name: Recover original 21 authored interaction frames
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n ' < .github/tony_assets_bootstrap/chunk_00 | base64 -d > /tmp/tony-v0981-assets.zip
          unzip -t /tmp/tony-v0981-assets.zip
          for action in pat lifted landing dizzy stretch yawn cursor_watch; do
            rm -rf "bear_agent_pet/client/assets/animations/$action"
          done
          unzip -o /tmp/tony-v0981-assets.zip -d .
          for action in pat lifted landing dizzy stretch yawn cursor_watch; do
            for n in 01 02 03; do
              test -f "bear_agent_pet/client/assets/animations/$action/frame_${n}.png"
            done
            count=$(find "bear_agent_pet/client/assets/animations/$action" -maxdepth 1 -type f -name 'frame_*.png' | wc -l)
            test "$count" -eq 3
          done
          total=$(find bear_agent_pet/client/assets/animations -type f -name 'frame_*.png' \
            \( -path '*/pat/*' -o -path '*/lifted/*' -o -path '*/landing/*' -o -path '*/dizzy/*' -o -path '*/stretch/*' -o -path '*/yawn/*' -o -path '*/cursor_watch/*' \) | wc -l)
          test "$total" -eq 21
          echo 'TONY_V0981_RECOVERY=PASS frames=21'

      - name: Validate artwork contract
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python bear_agent_pet/client/tools/validate_state_assets.py
          echo 'TONY_V0981_ASSET_VALIDATION=PASS'

      - name: Converge to one filesystem resource system
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f bear_agent_pet/client/src/EmbeddedActionAssets.cpp
          rm -f bear_agent_pet/client/src/EmbeddedActionAssets.h
          rm -f bear_agent_pet/client/src/EmbeddedActionAssetsInternal.h
          rm -f bear_agent_pet/client/src/EmbeddedActionAssets_pat.cpp
          if grep -R -n 'EmbeddedActionAssets' bear_agent_pet/client/CMakeLists.txt bear_agent_pet/client/src/PetWindowV7.cpp; then
            echo 'Embedded action asset references still exist in active build path.'
            exit 1
          fi
          printf '0.9.8.1\n' > bear_agent_pet/client/VERSION
          rm -rf .github/tony_assets_bootstrap
          rm -f .github/workflows/tony-v010-integrate.yml
          rm -f .github/workflows/tony-v010-from-staging.yml
          rm -f .github/workflows/tony-v010-recover-assets.yml
          echo 'TONY_V0981_RESOURCE_CONVERGENCE=PASS'

      - name: Guard against network-code drift
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- bear_agent_pet/client/src/AgentClient.cpp bear_agent_pet/client/src/AgentClient.h bear_agent_pet/server_gateway
          echo 'TONY_V0981_NETWORK_UNCHANGED=PASS'

      - name: Commit recovered visual resources
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recover Tony 0.9.8.1 interaction artwork'
          git push origin HEAD:fix/tony-v0981-visual-convergence
          echo 'TONY_V0981_COMMIT=PASS'
