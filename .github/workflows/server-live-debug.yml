name: Server live debug

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/server-live-debug.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"
      - name: Inspect current Step 3A training
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          echo '=== TIME ==='; date -Is
          echo '=== LOG ==='; tail -100 /home/ubuntu/local2b-training/step3a/train.log 2>/dev/null || true
          echo '=== RESULT ==='; cat /home/ubuntu/local2b-training/step3a/result.txt 2>/dev/null || true
          echo '=== ADAPTER ==='; ls -lh /home/ubuntu/local2b-training/step3a/local2b-mcp-step3a-r4-qv.gguf 2>/dev/null || true
          ls -lh /opt/rhocodec-llm/adapters/local2b-mcp-step3a-r4-qv.gguf 2>/dev/null || true
          echo '=== PROCESSES ==='; ps -eo pid,%cpu,%mem,etime,args | grep -E 'llama-finetune-lora|llama-server' | grep -v grep || true
          echo '=== MEMORY ==='; free -h
          echo '=== SERVICE ==='; systemctl is-active rhocodec-llm.service || true
          REMOTE
      - name: Remove key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
