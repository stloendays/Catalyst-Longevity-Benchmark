name: Server live debug

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/server-live-debug.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"
      - name: Probe live state
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          echo '=== TIME ==='; date -Is
          echo '=== STEP2 PROCESSES ==='
          ps -eo pid,ppid,user,%cpu,%mem,etime,args | grep -E 'benchmark_tool_use.py|llama-server' | grep -v grep || true
          echo '=== REQUESTS SINCE BENCHMARK START ==='
          journalctl -u rhocodec-llm.service --since '2026-09-08 22:30:10' --no-pager 2>/dev/null | grep -c 'processing task' || true
          echo '=== BASELINE FILE ==='
          ls -lah /tmp/local2b-mcp-step2/base-q4-baseline.json 2>/dev/null || true
          echo '=== SERVICE ==='; systemctl is-active rhocodec-llm.service || true
          REMOTE
      - name: Remove key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
