name: Server live debug

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/server-live-debug.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"
      - name: Probe training capability
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -u
          echo '=== TIME ==='; date -Is
          echo '=== CPU ==='; lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
          echo '=== MEMORY ==='; free -h
          echo '=== DISK ==='; df -h /
          echo '=== GPU ==='; command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi || echo NO_NVIDIA_GPU
          echo '=== PYTHON ==='; python3 --version; python3 -m pip --version || true
          echo '=== TORCH ==='; python3 - <<'PY'
          try:
              import torch
              print('torch', torch.__version__)
              print('cuda_available', torch.cuda.is_available())
              print('cuda_version', torch.version.cuda)
          except Exception as e:
              print('torch_unavailable', repr(e))
          try:
              import bitsandbytes as bnb
              print('bitsandbytes', bnb.__version__)
          except Exception as e:
              print('bitsandbytes_unavailable', repr(e))
          PY
          echo '=== SERVICES ==='; systemctl is-active rhocodec-llm.service || true
          echo '=== MODEL ==='; ls -lh /opt/rhocodec-llm/models/Qwen3.5-2B-Q4_K_M.gguf 2>/dev/null || true
          echo '=== TRAINING PROCESSES ==='; ps -eo pid,user,%cpu,%mem,etime,args | grep -E 'train_qlora|finetune|llama-server' | grep -v grep || true
          REMOTE
      - name: Remove key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
