name: Server live debug

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/server-live-debug.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"
      - name: Probe llama.cpp training binaries
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          set -u
          echo '=== TIME ==='; date -Is
          echo '=== LLAMA ROOT ==='; find /opt/rhocodec-llm -maxdepth 2 -type f \( -name '*finetune*' -o -name 'llama-*' \) -printf '%p\n' 2>/dev/null | sort | head -120
          echo '=== BIN DIR ==='; ls -lah /opt/rhocodec-llm/bin 2>/dev/null || true
          echo '=== BUILD TOOLS ==='; cmake --version | head -1 || true; g++ --version | head -1 || true; git --version || true
          echo '=== HOME SOURCE CANDIDATES ==='; find /home/ubuntu -maxdepth 2 -type d \( -name 'llama.cpp' -o -name '*llama*src*' \) -print 2>/dev/null || true
          echo '=== GGUF META ==='; /opt/rhocodec-llm/bin/llama-cli -m /opt/rhocodec-llm/models/Qwen3.5-2B-Q4_K_M.gguf --metadata 2>/dev/null | grep -E 'general.architecture|general.name|quantization_version|file_type' | head -20 || true
          echo '=== SERVICE ==='; systemctl is-active rhocodec-llm.service || true
          REMOTE
      - name: Remove key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
