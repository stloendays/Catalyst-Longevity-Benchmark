name: Server live debug

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/server-live-debug.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_key"
          chmod 600 "$HOME/.ssh/server_key"
          ssh-keyscan -T 10 -H 150.158.27.206 >> "$HOME/.ssh/known_hosts"
      - name: Probe live state
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i "$HOME/.ssh/server_key" ubuntu@150.158.27.206 'bash -s' <<'REMOTE'
          echo '=== TIME ==='; date -Is
          echo '=== DISK ==='; df -h /
          echo '=== MEMORY ==='; free -h
          echo '=== STEP2 PROCESSES ==='
          ps -eo pid,ppid,user,%cpu,%mem,etime,args | grep -E 'benchmark_tool_use.py|llama-server' | grep -v grep || true
          echo '=== STEP2 TMP ==='
          find /tmp/local2b-mcp-step2 -maxdepth 2 -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null | sort || true
          echo '=== LLM SERVICE ==='; systemctl is-active rhocodec-llm.service || true
          echo '=== RECENT LLM LOG ==='
          journalctl -u rhocodec-llm.service --since '15 minutes ago' --no-pager -n 60 2>/dev/null || true
          REMOTE
      - name: Remove key
        if: always()
        run: rm -f "$HOME/.ssh/server_key"
