name: Tony v0.9.8.1 asset forensics

on:
  push:
    branches:
      - fix/tony-v0981-visual-convergence
    paths:
      - '.github/workflows/tony-v0981-asset-forensics.yml'
      - '.github/tony_assets_forensics/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-fragments:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tony-v0981-visual-convergence
          fetch-depth: 0

      - name: Diagnose every Base64-aligned local header inside each surviving chunk
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, struct, zlib

          marker='UEsDB'
          png_magic=b'\x89PNG\r\n\x1a\n'
          rows=[]
          for i in range(11):
              text=''.join(Path(f'.github/tony_assets_forensics/chunk_{i:02d}').read_text(encoding='ascii').split())
              start=0
              while True:
                  at=text.find(marker,start)
                  if at<0:
                      break
                  start=at+1
                  suffix=text[at:]
                  usable=suffix[:(len(suffix)//4)*4]
                  try:
                      raw=base64.b64decode(usable,validate=False)
                  except Exception as exc:
                      rows.append((i,at,'<decode>',f'base64:{exc}'))
                      continue
                  try:
                      if not raw.startswith(b'PK\x03\x04') or len(raw)<30:
                          raise ValueError('no local header')
                      version,flags,method,mtime,mdate,crc32,csize,usize,nlen,xlen=struct.unpack_from('<HHHHHIIIHH',raw,4)
                      ns=30; ne=ns+nlen; ps=ne+xlen; pe=ps+csize
                      name=raw[ns:ne].decode('utf-8','strict')
                      available=max(0,len(raw)-ps)
                      status=f'need={csize} available={available} method={method} flags=0x{flags:04x}'
                      if pe<=len(raw) and not (flags&0x08):
                          payload=raw[ps:pe]
                          out=payload if method==0 else zlib.decompress(payload,-15) if method==8 else b''
                          if len(out)==usize:
                              status += f' COMPLETE usize={usize}'
                              if name.endswith('.png'):
                                  status += ' PNG_OK' if out.startswith(png_magic) else ' PNG_BAD'
                          else:
                              status += f' SIZE_BAD={len(out)}/{usize}'
                      else:
                          status += ' INCOMPLETE'
                      rows.append((i,at,name,status))
                  except Exception as exc:
                      rows.append((i,at,'<parse>',f'error:{exc}'))

          print(f'TONY_CHUNK_HEADER_ROWS={len(rows)}')
          for i,at,name,status in rows:
              if '/assets/animations/' in name or name in ('<decode>','<parse>'):
                  print(f'CHUNK_HEADER chunk={i:02d} offset={at} name={name} {status}')
          Path('/tmp/tony-v0981-header-diagnostic.txt').write_text(
              '\n'.join(f'chunk={i:02d} offset={at} name={name} {status}' for i,at,name,status in rows) + '\n',
              encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Tony-v0981-header-diagnostic
          path: /tmp/tony-v0981-header-diagnostic.txt
          if-no-files-found: error
