name: Tony v0.9.8.1 asset forensics

on:
  push:
    branches:
      - fix/tony-v0981-visual-convergence
    paths:
      - '.github/workflows/tony-v0981-asset-forensics.yml'
      - '.github/tony_assets_forensics/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tony-v0981-visual-convergence
          fetch-depth: 0

      - name: Reconstruct surviving archive prefix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          parts = []
          for i in range(11):
              p = Path(f'.github/tony_assets_forensics/chunk_{i:02d}')
              if not p.is_file():
                  raise SystemExit(f'missing forensic chunk: {p}')
              parts.append(p.read_text(encoding='ascii'))
          text = ''.join(parts)
          text = ''.join(text.split())
          usable = text[:(len(text)//4)*4]
          raw = base64.b64decode(usable, validate=False)
          Path('/tmp/tony-v0981-prefix.zip.partial').write_bytes(raw)
          print(f'TONY_FORENSIC_BASE64_CHARS={len(text)}')
          print(f'TONY_FORENSIC_USABLE_BASE64_CHARS={len(usable)}')
          print(f'TONY_FORENSIC_PREFIX_BYTES={len(raw)}')
          PY

      - name: Parse complete ZIP local entries without central directory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import struct, zlib

          data = Path('/tmp/tony-v0981-prefix.zip.partial').read_bytes()
          sig = b'PK\x03\x04'
          png_magic = b'\x89PNG\r\n\x1a\n'
          pos = 0
          recovered = []
          incomplete = None
          skipped = []

          while True:
              p = data.find(sig, pos)
              if p < 0:
                  break
              if p + 30 > len(data):
                  incomplete = ('header', p, len(data) - p)
                  break
              version, flags, method, mtime, mdate, crc32, csize, usize, nlen, xlen = struct.unpack_from('<HHHHHIIIHH', data, p + 4)
              name_start = p + 30
              name_end = name_start + nlen
              payload_start = name_end + xlen
              if name_end > len(data) or payload_start > len(data):
                  incomplete = ('name_or_extra', p, len(data) - p)
                  break
              name = data[name_start:name_end].decode('utf-8', 'replace')
              if flags & 0x08:
                  skipped.append((name, 'data_descriptor'))
                  pos = payload_start
                  continue
              payload_end = payload_start + csize
              if payload_end > len(data):
                  incomplete = (name, p, payload_end - len(data))
                  break
              payload = data[payload_start:payload_end]
              try:
                  if method == 0:
                      out = payload
                  elif method == 8:
                      out = zlib.decompress(payload, -15)
                  else:
                      skipped.append((name, f'compression_{method}'))
                      pos = payload_end
                      continue
              except Exception as exc:
                  incomplete = (name, p, f'decompress:{exc}')
                  break
              if len(out) != usize:
                  incomplete = (name, p, f'size:{len(out)}!={usize}')
                  break
              if name.endswith('.png') and '/assets/animations/' in name:
                  if not out.startswith(png_magic):
                      raise SystemExit(f'PNG magic mismatch: {name}')
                  target = Path('/tmp/recovered') / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(out)
                  recovered.append(name)
              pos = payload_end

          actions = ['pat','lifted','landing','dizzy','stretch','yawn','cursor_watch']
          expected = [f'bear_agent_pet/client/assets/animations/{a}/frame_{n:02d}.png' for a in actions for n in range(1,4)]
          have = set(recovered)
          missing = [x for x in expected if x not in have]

          print(f'TONY_FORENSIC_RECOVERED_COUNT={len(recovered)}')
          for name in recovered:
              print('RECOVERED ' + name)
          print(f'TONY_FORENSIC_MISSING_COUNT={len(missing)}')
          for name in missing:
              print('MISSING ' + name)
          print('TONY_FORENSIC_FIRST_INCOMPLETE=' + repr(incomplete))
          for item in skipped:
              print('SKIPPED ' + repr(item))

          Path('/tmp/tony-v0981-forensic-manifest.txt').write_text(
              '\n'.join([
                  f'recovered={len(recovered)}',
                  *('RECOVERED ' + x for x in recovered),
                  f'missing={len(missing)}',
                  *('MISSING ' + x for x in missing),
                  'incomplete=' + repr(incomplete),
              ]) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Tony-v0981-asset-forensics
          path: /tmp/tony-v0981-forensic-manifest.txt
          if-no-files-found: error
