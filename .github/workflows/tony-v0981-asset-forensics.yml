name: Tony v0.9.8.1 asset forensics

on:
  push:
    branches:
      - fix/tony-v0981-visual-convergence
    paths:
      - '.github/workflows/tony-v0981-asset-forensics.yml'
      - '.github/tony_assets_forensics/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-windowed-fragments:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tony-v0981-visual-convergence
          fetch-depth: 0

      - name: Brute-force Base64 phase across one-to-three adjacent fragment windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, struct, zlib

          texts=[]
          for i in range(11):
              texts.append(''.join(Path(f'.github/tony_assets_forensics/chunk_{i:02d}').read_text(encoding='ascii').split()))

          sig=b'PK\x03\x04'
          png_magic=b'\x89PNG\r\n\x1a\n'
          recovered={}
          sources={}
          header_hits=0

          def scan(raw,label):
              global header_hits
              cursor=0
              while True:
                  p=raw.find(sig,cursor)
                  if p<0:
                      return
                  cursor=p+4
                  header_hits+=1
                  try:
                      if p+30>len(raw):
                          continue
                      version,flags,method,mtime,mdate,crc32,csize,usize,nlen,xlen=struct.unpack_from('<HHHHHIIIHH',raw,p+4)
                      ns=p+30; ne=ns+nlen; ps=ne+xlen; pe=ps+csize
                      if ne>len(raw) or ps>len(raw) or pe>len(raw) or flags&0x08:
                          continue
                      name=raw[ns:ne].decode('utf-8','strict')
                      if not name.startswith('bear_agent_pet/client/assets/animations/') or not name.endswith('.png'):
                          continue
                      payload=raw[ps:pe]
                      if method==0:
                          out=payload
                      elif method==8:
                          out=zlib.decompress(payload,-15)
                      else:
                          continue
                      if len(out)!=usize or not out.startswith(png_magic):
                          continue
                      recovered.setdefault(name,out)
                      sources.setdefault(name,label)
                  except Exception:
                      continue

          for width in (1,2,3):
              for i in range(0,11-width+1):
                  stream=''.join(texts[i:i+width])
                  for phase in range(4):
                      s=stream[phase:]
                      usable=s[:(len(s)//4)*4]
                      try:
                          raw=base64.b64decode(usable,validate=False)
                      except Exception:
                          continue
                      scan(raw,f'chunks_{i:02d}-{i+width-1:02d}/phase{phase}')

          actions=['pat','lifted','landing','dizzy','stretch','yawn','cursor_watch']
          expected=[f'bear_agent_pet/client/assets/animations/{a}/frame_{n:02d}.png' for a in actions for n in range(1,4)]
          missing=[x for x in expected if x not in recovered]
          print(f'TONY_WINDOWED_HEADER_HITS={header_hits}')
          print(f'TONY_WINDOWED_RECOVERED_COUNT={len(recovered)}')
          for name in sorted(recovered):
              print(f'RECOVERED {name} SOURCE={sources[name]} BYTES={len(recovered[name])}')
          print(f'TONY_WINDOWED_MISSING_COUNT={len(missing)}')
          for name in missing:
              print('MISSING '+name)
          Path('/tmp/tony-v0981-windowed-manifest.txt').write_text(
              '\n'.join([
                  f'recovered={len(recovered)}',
                  *('RECOVERED '+x+' SOURCE='+sources[x] for x in sorted(recovered)),
                  f'missing={len(missing)}',
                  *('MISSING '+x for x in missing),
              ])+'\n',encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Tony-v0981-windowed-forensics
          path: /tmp/tony-v0981-windowed-manifest.txt
          if-no-files-found: error
