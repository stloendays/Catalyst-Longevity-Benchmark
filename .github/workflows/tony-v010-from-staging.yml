name: Integrate Tony v0.10 animation assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tony-v010-from-staging.yml'

permissions:
  contents: write

concurrency:
  group: tony-v010-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bear-agent-pet
          fetch-depth: 0
      - name: Reconstruct and integrate Tony animations
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin tony-v010-assets-staging:refs/remotes/origin/tony-v010-assets-staging
          : > /tmp/tony-v010-assets.b64
          for i in $(seq -w 0 13); do
            git show "origin/tony-v010-assets-staging:.github/tony_assets_bootstrap/chunk_${i}" >> /tmp/tony-v010-assets.b64
          done
          tr -d '\r\n ' < /tmp/tony-v010-assets.b64 | base64 -d > /tmp/tony-v010-assets.zip
          unzip -t /tmp/tony-v010-assets.zip
          unzip -o /tmp/tony-v010-assets.zip -d .
          python bear_agent_pet/client/tools/apply_v010_interactions.py
          python bear_agent_pet/client/tools/validate_state_assets.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bear_agent_pet/client
          git commit -m 'Add seven living Tony interaction animations'
          git push origin HEAD:feature/bear-agent-pet
          echo 'TONY_V010_ARTWORK_INTEGRATION=PASS'
