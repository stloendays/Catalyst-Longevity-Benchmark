name: Temporary Tony 0.9.6 device-code validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tony-v096-device-code
    paths:
      - 'bear_agent_pet/client/**'
      - 'bear_agent_pet/server_gateway/**'
      - '.github/scripts/apply_tony_v096_connection_ux.py'
      - '.github/workflows/_temporary-tony-v096-device-code.yml'

permissions:
  contents: write

concurrency:
  group: tony-v096-device-code-validation
  cancel-in-progress: true

jobs:
  integrate-and-test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tony-v096-device-code
          fetch-depth: 0

      - name: Apply default device-code connection UX
        run: python .github/scripts/apply_tony_v096_connection_ux.py

      - name: Compile server pairing modules
        run: python -m compileall -q bear_agent_pet/server_gateway/app bear_agent_pet/server_gateway/tools

      - name: Test approval-gated device-code lifecycle
        env:
          PYTHONPATH: bear_agent_pet/server_gateway
        run: python bear_agent_pet/server_gateway/tools/test_device_code_pairing.py

      - name: Verify pairing and desktop regression contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'requestDevicePairing' bear_agent_pet/client/src/AgentClient.h
          grep -q 'pairingCodeReady' bear_agent_pet/client/src/AgentClient.h
          grep -q 'void PetWindow::configureConnection(){' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -A2 'void PetWindow::configureConnection(){' bear_agent_pet/client/src/PetWindowV7.cpp | grep -q 'startAutomaticPairing();'
          grep -q 'configureRecoveryConnection' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -q '连接码：%1' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -q 'blinkSequence\[\].*{-1, 1, 1, -1, -1}' bear_agent_pet/client/src/PetWindowV7.cpp
          if grep -q 'blinkSequence\[\].*2' bear_agent_pet/client/src/PetWindowV7.cpp; then
            echo 'Bad idle blink frame is still referenced' >&2
            exit 1
          fi
          grep -q 'bounded(140000,320001)' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -q 'QTimer::singleShot(2200' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -q 'topSafety=(action_==Action::Hug) ? 16.0 : 8.0' bear_agent_pet/client/src/PetWindowV7.cpp
          grep -q 'rotatedUnitH' bear_agent_pet/client/src/PetWindowV7.cpp
          test "$(tr -d '\r\n ' < bear_agent_pet/client/VERSION)" = '0.9.6'
          echo 'TONY_V096_REGRESSION_CONTRACT=PASS'

      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bear_agent_pet/client/src/PetWindowV7.cpp bear_agent_pet/client/src/main.cpp
          if git diff --cached --quiet; then
            echo 'TONY_V096_SOURCE_ALREADY_INTEGRATED=PASS'
            exit 0
          fi
          git commit -m 'Make Tony device code the default connection flow'
          git push origin HEAD:feature/tony-v096-device-code

  windows:
    needs: integrate-and-test-server
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tony-v096-device-code

      - name: Read canonical version
        shell: pwsh
        run: |
          $version=(Get-Content bear_agent_pet/client/VERSION -Raw).Trim()
          if ($version -ne '0.9.6') { throw "Expected 0.9.6, got $version" }
          "TONY_VERSION=$version" >> $env:GITHUB_ENV

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebsockets'
          cache: true

      - name: Validate artwork
        shell: pwsh
        run: python bear_agent_pet/client/tools/validate_state_assets.py

      - name: Configure
        shell: pwsh
        run: cmake -S bear_agent_pet/client -B bear_agent_pet/client/build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build bear_agent_pet/client/build --config Release --parallel

      - name: Verify executable version
        shell: pwsh
        run: |
          $exe="$PWD/bear_agent_pet/client/build/Release/TonyDesktopPet.exe"
          if (-not (Test-Path $exe)) { throw 'TonyDesktopPet.exe missing' }
          $pv=(Get-Item $exe).VersionInfo.ProductVersion
          if ($pv -notlike '0.9.6*') { throw "ProductVersion mismatch: $pv" }
          Write-Host "TONY_V096_PRODUCT_VERSION=PASS $pv"

      - name: Startup smoke test without network dialogs
        shell: pwsh
        env:
          TONY_VISUAL_ACTION: idle
        run: |
          $exe="$PWD/bear_agent_pet/client/build/Release/TonyDesktopPet.exe"
          $process=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 6
            if ($process.HasExited) { throw "Tony exited: $($process.ExitCode)" }
            Write-Host 'TONY_V096_IDLE_STARTUP_SMOKE=PASS'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Hug startup smoke test
        shell: pwsh
        env:
          TONY_VISUAL_ACTION: hug
        run: |
          $exe="$PWD/bear_agent_pet/client/build/Release/TonyDesktopPet.exe"
          $process=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 6
            if ($process.HasExited) { throw "Tony hug pose exited: $($process.ExitCode)" }
            Write-Host 'TONY_V096_HUG_STARTUP_SMOKE=PASS'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
